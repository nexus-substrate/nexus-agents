# registry/techniques.yaml
# Implementation techniques extracted from research papers
# Schema version for future migrations
schema_version: '1.0'

techniques:
  # ============================================================================
  # CONSENSUS PROTOCOLS
  # ============================================================================

  aegean-consensus:
    name: 'Aegean Consensus Protocol'
    description: |
      Formal consensus protocol for stochastic reasoning with
      incremental quorum detection. Achieves 1.2x-20x latency
      reduction and 4.4x token reduction.

    source_papers:
      - arxiv-2512.20184

    topic: consensus
    tags:
      - formal-verification
      - quorum
      - streaming

    metrics:
      latency_reduction: '1.2x-20x'
      token_reduction: '4.4x'
      quality_impact: 'within 2.5% of baseline'

    status: implemented
    priority: P1
    complexity: medium

    integration_files:
      - 'packages/nexus-agents/src/agents/collaboration/aegean-types.ts'
      - 'packages/nexus-agents/src/agents/collaboration/aegean-protocol.ts'

    implementation_issue: 119
    related_prs: []

    notes: |
      Implemented as AegeanProtocol class with:
      - Leader-based coordination with round-robin selection
      - Incremental quorum detection for early termination
      - Byzantine fault tolerance (tolerates f faults out of 3f+1 agents)
      - Full test coverage (23 tests)

    dependencies: []

    decision_history:
      - date: '2026-01-06'
        decision: 'Added to roadmap Phase 1'
        rationale: 'High impact, direct replacement for existing module'
      - date: '2026-01-07'
        decision: 'Implemented'
        rationale: 'Commit 8bca0fa - feat(collaboration): implement Aegean consensus protocol (#119)'

  task-aware-protocol-selection:
    name: 'Task-Type Protocol Selection'
    description: |
      Select consensus protocol (voting vs consensus) based on task type.
      Voting for reasoning tasks (+13.2%), consensus for knowledge tasks.

    source_papers:
      - arxiv-2502.19130

    topic: consensus
    tags:
      - task-classification
      - protocol-selection

    metrics:
      reasoning_improvement: '+13.2%'
      knowledge_improvement: '+2.8%'

    status: planned
    priority: P1
    complexity: low

    integration_files:
