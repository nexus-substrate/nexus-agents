    implementation_issue: 125
    related_prs: []

    notes: |
      Implemented TaskTypeClassifier and AdaptiveProtocolSelector:
      - Keyword-based task classification (reasoning vs knowledge)
      - Automatic protocol selection based on task type
      - Configurable pattern mapping
      - 31 comprehensive tests

    dependencies: []

    decision_history:
      - date: '2026-01-06'
        decision: 'Added to roadmap Phase 1'
        rationale: 'Low complexity, immediate benefit'
      - date: '2026-01-07'
        decision: 'Implemented'
        rationale: 'Commit 33f1f95 - feat(collaboration): implement task-aware protocol selection (#125)'

  cp-wbft-consensus:
    name: 'CP-WBFT Byzantine Fault Tolerant Consensus'
    description: |
      Confidence Probe-based Weighted Byzantine Fault Tolerant consensus
