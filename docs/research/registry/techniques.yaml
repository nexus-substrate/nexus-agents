    implementation_issue: null
    related_prs: []

    notes: |
      Low complexity, high impact. Add task-type classifier to
      select between majority voting and consensus.

    dependencies: []

    decision_history:
      - date: '2026-01-06'
        decision: 'Added to roadmap Phase 1'
        rationale: 'Low complexity, immediate benefit'

  cp-wbft-consensus:
