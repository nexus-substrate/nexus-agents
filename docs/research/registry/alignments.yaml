# registry/alignments.yaml
# Technique alignment tracking for overlap detection
# Schema version for future migrations
schema_version: '1.0'

# Alignment categories:
# - complementary: Techniques work well together
# - overlapping: Solve same problem differently
# - conflicting: Contradictory approaches
# - enhances: New technique improves existing
# - supersedes: New technique replaces existing

alignments:
  # ============================================================================
  # ROUTING TECHNIQUE ALIGNMENTS
  # ============================================================================

  routing-cascade-quality:
    techniques:
      - cascade-routing
      - ipr-quality-estimators
    category: complementary
    relationship: |
      cascade-routing (ABC) uses multi-model ensemble agreement to determine
      when to escalate. ipr-quality-estimators routes based on quality/cost
      trade-offs. These can be combined: use quality-router for initial model
      selection, then cascade if quality threshold not met.
    integration_approach: |
      QualityRouter selects initial model based on complexity.
      AgreementCascadeRouter escalates on disagreement.
      Chain: QualityRouter -> AgreementCascadeRouter -> final result
    status: rejected
    date: '2026-04-18'
    decision_rationale: |
      Both components ship independently: QualityConstraintStage lives in the
      CompositeRouter pipeline; AgreementCascadeRouter / canCascadeEarly() lives
      in the consensus engine. They solve different problems (model selection vs
      consensus escalation) and run in different execution paths. A unified
      chain was never needed — CompositeRouter handles quality-aware selection;
      the consensus engine handles cascade-on-disagreement. No consumer has
      requested the combined pipeline in 3+ months.

  routing-quality-budget:
    techniques:
      - ipr-quality-estimators
      - pilot-budget-routing
    category: overlapping
    relationship: |
      Both address cost optimization but with different constraints:
      - Quality-routing: minimize cost while meeting quality threshold
      - Budget-routing: maximize quality within budget constraint
      These are dual formulations of the same optimization problem.
    integration_approach: |
      Could unify into single router with mode selection:
      - quality_constrained: minimize cost, quality >= threshold
      - budget_constrained: maximize quality, cost <= budget
    status: rejected
    date: '2026-04-18'
    decision_rationale: |
      YAGNI. CompositeRouter runs both stages sequentially (BudgetRouter first,
      QualityConstraintStage later) and the dual-pipeline approach has been
      stable across 10k+ observed tasks (84% overall success). Unification would
      require refactoring two production stages to resolve a conflict that
      hasn't materialized in practice. Additionally, NEXUS_BILLING_MODE=plan
      zeros cost for most users, making quality-first the effective default.

  routing-sater-cascade:
    techniques:
      - sater-routing
      - cascade-routing
    category: enhances
    relationship: |
      SATER adds confidence-aware rejection to cascade routing.
      Rather than just ensemble agreement, SATER uses model confidence
      to decide escalation. Can enhance existing cascade implementation.
    integration_approach: |
      Add confidence scoring to AgreementCascadeRouter.
      Use both agreement threshold AND confidence for escalation.
    status: rejected
    date: '2026-04-18'
    decision_rationale: |
      Different subsystems. SATER is a ConfidenceCascadeStage in the routing
      pipeline (pre-dispatch model selection). AgreementCascadeRouter runs in
      the consensus engine (post-dispatch escalation on disagreement). Fusing
      their confidence signals would cross a subsystem boundary without a clear
      benefit — the confidence information SATER needs comes from response
      content, which is only available after consensus execution starts.

  # ============================================================================
  # CONSENSUS TECHNIQUE ALIGNMENTS
  # ============================================================================

  consensus-aegean-reflexion:
    techniques:
      - aegean-consensus
      - multi-agent-reflexion
    category: complementary
    relationship: |
      Aegean provides formal consensus mechanism with quorum detection.
      Reflexion provides iterative self-critique and refinement loop.
      Both implemented and used for different purposes:
      - Aegean: multi-agent agreement on decisions
      - Reflexion: single-agent reasoning improvement
    integration_approach: |
      Already integrated. Can combine: use Aegean for multi-agent
      decisions, then apply Reflexion for quality improvement.
    status: implemented
    date: '2026-01-07'

  consensus-task-protocol:
    techniques:
      - task-aware-protocol-selection
      - aegean-consensus
    category: complementary
    relationship: |
      Task-aware selection chooses between voting vs consensus based
      on task type (reasoning vs knowledge). Aegean provides the
      consensus implementation. These are designed to work together.
    integration_approach: |
      TaskTypeClassifier -> AdaptiveProtocolSelector ->
      (VotingProtocol or AegeanConsensus)
    status: implemented
    date: '2026-01-07'

  consensus-free-mad:
    techniques:
      - free-mad-scoring
      - aegean-consensus
    category: enhances
    relationship: |
      Free-MAD adds anti-conformity scoring to prevent majority
      influence on correct answers. Could enhance Aegean's voting
      by adding score-based decision making.
    integration_approach: |
      Add confidence scoring with anti-conformity adjustment
      to Aegean's position aggregation phase.
    status: rejected
    date: '2026-04-18'
    decision_rationale: |
      Superseded by higher-order-voting (OW/ISP). The Bayesian correlation-aware
      aggregation in higher-order-voting addresses the same problem Free-MAD
      solves (majority-over-correct bias, groupthink) with a more principled
      mathematical framework. ConsensusEngine uses higher_order strategy for
      architecture/security votes; adding Free-MAD's anti-conformity scoring on
      top would be redundant.

  # ============================================================================
  # MEMORY TECHNIQUE ALIGNMENTS
  # ============================================================================

  memory-reflexion-mirix:
    techniques:
      - multi-agent-reflexion
      - mirix-six-type-memory
    category: enhances
    relationship: |
      Reflexion generates learnings through self-critique.
      MIRIX episodic memory persists learnings across sessions.
      Together: Reflexion produces insights, MIRIX episodic stores them.
    integration_approach: |
      After Reflexion completes, extract learnings and store
      in MIRIX episodic memory for future session retrieval.
    status: deferred
    date: '2026-04-18'
    decision_rationale: |
      Both components ship independently: ReflexionProtocol (collaboration/)
      maintains its own per-session episodic memory; MIRIX provides the
      multi-backend memory system. A dedicated Reflexion→MIRIX bridge would add
      cross-session persistence of reflexion traces, but no current consumer
      requires this. Promote when a real workflow needs reflexion learnings
      retrieved across sessions (candidates: SWE-bench long-running runs
      #1414/#1574, or evolving-orchestration with learned-policy carryover).
      Matches the deferred-research pattern of #1895 and #1898.

  # ============================================================================
  # SELF-IMPROVEMENT ALIGNMENTS
  # ============================================================================

  self-improve-refine-eval:
    techniques:
      - self-refine-loop
      - sica-self-improvement
    category: complementary
    relationship: |
      Self-refine provides iterative improvement loop (generate -> feedback -> refine).
      SICA self-improvement extends this with tool-orchestrated versioning and
      performance tracking across agent iterations.
      Different scopes: self-refine for individual outputs,
      sica for full agent implementation improvement.
    integration_approach: |
      Could use SICA versioning to identify best-performing configurations,
      then apply self-refine to improve individual outputs within each version.
    status: implemented
    date: '2026-01-07'

