<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <!-- Gradient for the central node -->
    <radialGradient id="centerGradientLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>
    <!-- Gradient for connection lines -->
    <linearGradient id="lineGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glowLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Network/Swarm Icon -->
  <g transform="translate(5, 5)">
    <!-- Connection lines -->
    <line x1="20" y1="20" x2="8" y2="8" stroke="url(#lineGradientLight)" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="32" y2="8" stroke="url(#lineGradientLight)" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="8" y2="32" stroke="url(#lineGradientLight)" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="32" y2="32" stroke="url(#lineGradientLight)" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="38" y2="20" stroke="url(#lineGradientLight)" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="2" y2="20" stroke="url(#lineGradientLight)" stroke-width="1.5"/>

    <!-- Outer nodes -->
    <circle cx="8" cy="8" r="4" fill="#1e3a5f" filter="url(#glowLight)"/>
    <circle cx="32" cy="8" r="4" fill="#1e3a5f" filter="url(#glowLight)"/>
    <circle cx="8" cy="32" r="4" fill="#1e3a5f" filter="url(#glowLight)"/>
    <circle cx="32" cy="32" r="4" fill="#1e3a5f" filter="url(#glowLight)"/>
    <circle cx="38" cy="20" r="3" fill="#1e3a5f" filter="url(#glowLight)"/>
    <circle cx="2" cy="20" r="3" fill="#1e3a5f" filter="url(#glowLight)"/>

    <!-- Central hub node -->
    <circle cx="20" cy="20" r="7" fill="url(#centerGradientLight)" filter="url(#glowLight)"/>
    <circle cx="20" cy="20" r="3" fill="#00d4ff" opacity="0.8"/>
  </g>

  <!-- Text: Nexus -->
  <text x="52" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">
    Nexus
  </text>

  <!-- Text: Agents -->
  <text x="118" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#1e3a5f">
    Agents
  </text>
</svg>
