name: 'nexus-agents Describe PR'
description: 'Auto-generate PR descriptions from diff analysis using nexus-agents'
author: 'williamzujkowski'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  max-diff-size:
    description: 'Maximum diff size in bytes to analyze (default: 50000)'
    required: false
    default: '50000'

outputs:
  description:
    description: 'Generated PR description in markdown'
    value: ${{ steps.describe.outputs.description }}

runs:
  using: 'composite'
  steps:
    - name: Get PR metadata
      id: meta
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUMBER=${{ github.event.pull_request.number }}
        gh pr view ${PR_NUMBER} --json title,body,files,commits,additions,deletions \
          --jq '{
            title: .title,
            files: [.files[].path],
            file_count: (.files | length),
            commits: (.commits | length),
            additions: .additions,
            deletions: .deletions
          }' > /tmp/pr-meta.json

        echo "file_count=$(jq '.file_count' /tmp/pr-meta.json)" >> $GITHUB_OUTPUT
        echo "title=$(jq -r '.title' /tmp/pr-meta.json)" >> $GITHUB_OUTPUT

    - name: Get PR diff
      id: diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUMBER=${{ github.event.pull_request.number }}
        MAX_SIZE=${{ inputs.max-diff-size }}

        gh pr diff ${PR_NUMBER} > /tmp/pr-diff.txt
        DIFF_SIZE=$(wc -c < /tmp/pr-diff.txt)

        if [ "$DIFF_SIZE" -gt "$MAX_SIZE" ]; then
          head -c "$MAX_SIZE" /tmp/pr-diff.txt > /tmp/pr-diff-truncated.txt
          echo "" >> /tmp/pr-diff-truncated.txt
          echo "... (diff truncated at ${MAX_SIZE} bytes, ${DIFF_SIZE} total)" >> /tmp/pr-diff-truncated.txt
          mv /tmp/pr-diff-truncated.txt /tmp/pr-diff.txt
        fi

    - name: Generate description
      id: describe
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUMBER=${{ github.event.pull_request.number }}
        TITLE=$(jq -r '.title' /tmp/pr-meta.json)
        FILES=$(jq -r '.files | join(", ")' /tmp/pr-meta.json)
        ADDITIONS=$(jq '.additions' /tmp/pr-meta.json)
        DELETIONS=$(jq '.deletions' /tmp/pr-meta.json)
        COMMITS=$(jq '.commits' /tmp/pr-meta.json)

        # Build description from diff analysis
        DESCRIPTION="## Summary

        Analyzing ${COMMITS} commit(s) across $(jq '.file_count' /tmp/pr-meta.json) file(s) (+${ADDITIONS}/-${DELETIONS} lines).

        ### Changed Files
        $(jq -r '.files[] | "- \`" + . + "\`"' /tmp/pr-meta.json)

        ---
        _Auto-generated by nexus-agents describe-pr_"

        # Update PR body
        gh pr edit ${PR_NUMBER} --body "${DESCRIPTION}" 2>/dev/null || true

        echo "description<<EOF" >> $GITHUB_OUTPUT
        echo "${DESCRIPTION}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

branding:
  icon: 'file-text'
  color: 'purple'
