# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    groups:
      # Group minor and patch updates together
      production-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Keep major updates separate for review
    ignore:
      # Ignore major version updates for stability (review manually)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'dependencies'
    ignore:
      # changesets/action v2+ requires Changesets CLI v3; this repo is on CLI v2,
      # and v2 also renamed every input. Bumping the action alone breaks the
      # release with "Changesets CLI v2 is not supported" — and NO CI job
      # exercises release.yml, so the PR goes green and the break only surfaces
      # on the next release. Unignore once the CLI is on v3 (#4473).
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
