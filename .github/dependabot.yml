# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    groups:
      # Group minor and patch updates together
      production-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Keep major updates separate for review
    ignore:
      # Ignore major version updates for stability (review manually)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'dependencies'
    ignore:
      # changesets/action and @changesets/cli must move together — action v2
      # requires CLI v3, and neither combination is forward/backward compatible.
      # A lone major bump of either breaks the release, and NO CI job exercises
      # release.yml, so the PR goes green and the break surfaces only at release
      # time (#4469 did exactly that). Both are now on the paired v2/v3, so a
      # future major still needs to be done as a coordinated pair by hand.
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
      - dependency-name: '@changesets/cli'
        update-types: ['version-update:semver-major']
