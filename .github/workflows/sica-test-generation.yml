name: SICA Weekly Test Generation

# Automated test generation using SICA agent
# (Source: Issue #256 - Self-Generated Test Automation, Phase 3.2)

on:
  # Weekly schedule DISABLED pending #4240. This job failed on every run for 6+
  # weeks: the generator's coverage-gap discovery is a stub with a hardcoded,
  # repo-root-relative target path, so writeFile ENOENTs, no *.sica.test.ts files
  # land, and Create-PR dies on an empty pathspec. Re-enable the cron once the
  # generator is fixed or the workflow is intentionally retired (see #4240).
  # Manual dispatch is kept so the fix can be exercised on demand.
  # schedule:
  #   - cron: '0 9 * * 1'  # every Monday 09:00 UTC (05:00 ET)
  workflow_dispatch:
    inputs:
      target_coverage:
        description: 'Target coverage percentage'
        required: false
        default: '85'
        type: string
      dry_run:
        description: 'Dry run (no PR creation)'
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: sica-test-generation
  cancel-in-progress: false
env:
  NODE_VERSION: '22'
  TARGET_COVERAGE: ${{ github.event.inputs.target_coverage || '85' }}

jobs:
  generate-tests:
    name: Generate Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Build nexus-agents
        run: pnpm build

      - name: Measure current coverage
        id: coverage
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          echo "📊 Measuring current test coverage..."
          # Note: don't pipe to coverage-report.json — that's two failures rolled
          # into one. (1) `pnpm test:coverage` is `turbo test:coverage`, which
          # rejects --reporter=json with "Unknown option: 'run'", and (2) the
          # captured output gets staged for the auto-PR step where lint-staged
          # runs prettier on *.json files and chokes on the non-JSON content.
          # Coverage data we actually need is read from coverage-summary.json
          # below; the captured run output is only useful as debug, so write
          # it to a non-staged path with a non-JSON extension.
          pnpm test:coverage > coverage-report.log 2>&1 || true

          # Extract coverage metrics (#4727).
          #
          # These are REPORTING only — the generator targets $TARGET_COVERAGE and
          # never reads them. But they are printed in the PR body and the job
          # summary, so a wrong number here is read by a human as fact.
          #
          # `// 0` and the else-branch previously turned "no measurement" into
          # "0% coverage" at two levels. Absence must not read as the worst
          # possible measurement; it reads as `unmeasured`.
          #
          # Until #4668 added the `json-summary` reporter this file was never
          # produced, so the else-branch was the only path and every run
          # reported 0%.
          SUMMARY=packages/nexus-agents/coverage/coverage-summary.json
          # Emits "87.5%" or "unmeasured" — the unit travels with the value so
          # consumers cannot append "%" to a non-number.
          read_pct() {
            local pct
            pct=$(jq -er "$1" "$SUMMARY" 2>/dev/null) && echo "${pct}%" || echo "unmeasured"
          }
          if [ -f "$SUMMARY" ]; then
            LINE_COV=$(read_pct '.total.lines.pct')
            BRANCH_COV=$(read_pct '.total.branches.pct')
            FUNC_COV=$(read_pct '.total.functions.pct')
          else
            echo "::warning::$SUMMARY not found — coverage reported as unmeasured, not 0%"
            LINE_COV=unmeasured
            BRANCH_COV=unmeasured
            FUNC_COV=unmeasured
          fi

          echo "line_coverage=$LINE_COV" >> $GITHUB_OUTPUT
          echo "branch_coverage=$BRANCH_COV" >> $GITHUB_OUTPUT
          echo "function_coverage=$FUNC_COV" >> $GITHUB_OUTPUT
          echo "Current coverage: Lines=$LINE_COV, Branches=$BRANCH_COV, Functions=$FUNC_COV"

      - name: Run SICA Test Generator
        id: generate
        run: |
          echo "🤖 Running SICA Test Generator..."
          echo "Target coverage: $TARGET_COVERAGE%"

          # Create test generation script
          cat > generate-tests.ts << 'EOF'
          import { SicaTestGenerator } from './packages/nexus-agents/src/agents/self-improving/sica-test-generator.js';
          import * as fs from 'node:fs/promises';

          async function main() {
            const generator = new SicaTestGenerator();
            const targetCoverage = parseInt(process.env.TARGET_COVERAGE || '85', 10);

            console.log(`Generating tests for target coverage: ${targetCoverage}%`);

            const result = await generator.generateTests({
              targetCoverage,
              framework: 'vitest',
              testTypes: ['unit', 'integration'],
              validate: true,
            });

            console.log(`Generated ${result.tests.length} tests`);
            console.log(`Coverage gain: ${result.coverageGain}%`);

            // Write results to file
            await fs.writeFile('sica-results.json', JSON.stringify(result, null, 2));

            // Write generated tests to files
            for (const test of result.tests) {
              const testPath = test.target.replace('.ts', '.sica.test.ts');
              console.log(`Writing test: ${testPath}`);
              await fs.writeFile(testPath, test.code, 'utf-8');
            }
          }

          // Exit code is the contract: 0 means the generator ran to completion
          // and sica-results.json holds the count (which may be 0 — a measured
          // "nothing to generate"). Anything else is a failure. It used to exit
          // 1 on zero tests and `.catch(console.error)` on a crash, i.e. exit
          // 0 — so the step below could not tell a crash from a clean empty
          // run (#4927 finding 2).
          main().catch((e: unknown) => {
            console.error(e);
            process.exit(1);
          });
          EOF

          # Run the generator. Its exit code propagates: this step runs under
          # `bash -e`, so a non-zero exit fails the step here. The old
          # `|| echo "No tests generated"` swallowed it.
          pnpm exec tsx generate-tests.ts 2>&1

          # A zero exit without the results file is a generator bug, not an
          # empty run — say so rather than defaulting to test_count=0.
          if [ ! -f sica-results.json ]; then
            echo "::error::generator exited 0 but wrote no sica-results.json — cannot tell how many tests were generated"
            exit 1
          fi
          TEST_COUNT=$(jq '.tests | length' sica-results.json)
          COVERAGE_GAIN=$(jq '.coverageGain' sica-results.json)
          echo "test_count=$TEST_COUNT" >> "$GITHUB_OUTPUT"
          echo "coverage_gain=$COVERAGE_GAIN" >> "$GITHUB_OUTPUT"
          echo "Generated $TEST_COUNT tests with $COVERAGE_GAIN% coverage gain"

      # This is the only gate between machine-written tests and an open PR.
      # It used to be `pnpm test || echo "Some tests may need adjustment"`,
      # which cannot fail, so failing generated tests produced a green step and
      # a PR (#4927 finding 2). Now the step fails, the job goes red, and no PR
      # is opened: a generated test that fails is most likely a wrong test, and
      # the failing output is in this step's log for triage. If a draft PR for
      # triage is ever wanted, it must be `draft: true` with a body line that
      # says the tests failed — never a green step.
      - name: Validate generated tests
        id: validate
        if: steps.generate.outputs.test_count > 0
        run: |
          echo "✅ Validating generated tests..."
          # `pnpm test` is `turbo test`, which already runs vitest in --run
          # mode; passing --run through to turbo trips "Unknown option: 'run'".
          pnpm test

      - name: Create Pull Request
        id: pr
        # `steps.validate.outcome == 'success'` is explicit even though a failed
        # validate already fails the job: the condition is the record of what
        # a PR from this workflow means (the generated tests passed).
        if: |
          steps.validate.outcome == 'success' &&
          steps.generate.outputs.test_count > 0 &&
          github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Limit the PR to the actual generated artifacts so the
          # workflow's scratch `generate-tests.ts` heredoc and
          # `coverage-report.log` debug output don't get staged —
          # lint-staged's ESLint pass rejects the scratch file and
          # fails the whole PR-creation step. See issue #2591.
          add-paths: |
            **/*.sica.test.ts
            sica-results.json
          commit-message: |
            test: add SICA-generated tests

            Generated ${{ steps.generate.outputs.test_count }} tests.
            Expected coverage gain: ${{ steps.generate.outputs.coverage_gain }}%

            Co-Authored-By: SICA Agent <noreply@nexus-agents.dev>
          title: 'test: SICA-generated tests (${{ steps.generate.outputs.test_count }} tests)'
          body: |
            ## SICA Automated Test Generation

            **Date:** ${{ github.run_id }}
            **Target Coverage:** ${{ env.TARGET_COVERAGE }}%

            ### Coverage Metrics (Before)
            - Line: ${{ steps.coverage.outputs.line_coverage }}
            - Branch: ${{ steps.coverage.outputs.branch_coverage }}
            - Function: ${{ steps.coverage.outputs.function_coverage }}

            ### Generated
            - Tests: ${{ steps.generate.outputs.test_count }}
            - Expected Coverage Gain: ${{ steps.generate.outputs.coverage_gain }}%

            ### Review Notes
            - [ ] Verify test logic is correct
            - [ ] Check for false positives
            - [ ] Ensure tests are meaningful (not trivial)

            ---
            *Generated by SICA Agent (Issue #256)*
          branch: sica/tests-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            testing
            sica

      - name: Post Summary
        if: always()
        run: |
          echo "### 🤖 SICA Test Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Coverage:** ${{ env.TARGET_COVERAGE }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Coverage Before" >> $GITHUB_STEP_SUMMARY
          echo "- Line: ${{ steps.coverage.outputs.line_coverage }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ steps.coverage.outputs.branch_coverage }}" >> $GITHUB_STEP_SUMMARY
          echo "- Function: ${{ steps.coverage.outputs.function_coverage }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Results" >> $GITHUB_STEP_SUMMARY
          echo "- Tests Generated: ${{ steps.generate.outputs.test_count || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Gain: ${{ steps.generate.outputs.coverage_gain || 0 }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Report what happened, not what the happy path would have been.
          # `always()` runs this after a failed generate or validate, so each
          # branch reads the step outcome that decides it.
          if [ "${{ steps.generate.outcome }}" != "success" ]; then
            echo "❌ Generator failed (outcome: ${{ steps.generate.outcome }}) — no tests written, no PR" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.generate.outputs.test_count || 0 }}" -gt "0" ]; then
            if [ "${{ steps.validate.outcome }}" != "success" ]; then
              echo "❌ Generated tests FAILED validation (outcome: ${{ steps.validate.outcome }}) — no PR opened; see the Validate step log" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "⚠️ Dry run - no PR created" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ steps.pr.outcome }}" = "success" ]; then
              echo "✅ PR created with generated tests" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ PR creation did not succeed (outcome: ${{ steps.pr.outcome }})" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ No tests generated (coverage may already meet target)" >> $GITHUB_STEP_SUMMARY
          fi
