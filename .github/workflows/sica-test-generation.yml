name: SICA Weekly Test Generation

# Automated test generation using SICA agent
# (Source: Issue #256 - Self-Generated Test Automation, Phase 3.2)

on:
  schedule:
    # Run every Monday at 9:00 AM UTC (5:00 AM ET)
    - cron: '0 9 * * 1'
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      target_coverage:
        description: 'Target coverage percentage'
        required: false
        default: '85'
        type: string
      dry_run:
        description: 'Dry run (no PR creation)'
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: sica-test-generation
  cancel-in-progress: false
env:
  NODE_VERSION: '22'
  TARGET_COVERAGE: ${{ github.event.inputs.target_coverage || '85' }}

jobs:
  generate-tests:
    name: Generate Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Build nexus-agents
        run: pnpm build

      - name: Measure current coverage
        id: coverage
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          echo "📊 Measuring current test coverage..."
          pnpm test:coverage --reporter=json > coverage-report.json 2>&1 || true

          # Extract coverage metrics
          if [ -f packages/nexus-agents/coverage/coverage-summary.json ]; then
            LINE_COV=$(jq '.total.lines.pct // 0' packages/nexus-agents/coverage/coverage-summary.json)
            BRANCH_COV=$(jq '.total.branches.pct // 0' packages/nexus-agents/coverage/coverage-summary.json)
            FUNC_COV=$(jq '.total.functions.pct // 0' packages/nexus-agents/coverage/coverage-summary.json)
          else
            LINE_COV=0
            BRANCH_COV=0
            FUNC_COV=0
          fi

          echo "line_coverage=$LINE_COV" >> $GITHUB_OUTPUT
          echo "branch_coverage=$BRANCH_COV" >> $GITHUB_OUTPUT
          echo "function_coverage=$FUNC_COV" >> $GITHUB_OUTPUT
          echo "Current coverage: Lines=$LINE_COV%, Branches=$BRANCH_COV%, Functions=$FUNC_COV%"

      - name: Run SICA Test Generator
        id: generate
        run: |
          echo "🤖 Running SICA Test Generator..."
          echo "Target coverage: $TARGET_COVERAGE%"

          # Create test generation script
          cat > generate-tests.ts << 'EOF'
          import { SicaTestGenerator } from './packages/nexus-agents/src/agents/self-improving/sica-test-generator.js';
          import * as fs from 'node:fs/promises';

          async function main() {
            const generator = new SicaTestGenerator();
            const targetCoverage = parseInt(process.env.TARGET_COVERAGE || '85', 10);

            console.log(`Generating tests for target coverage: ${targetCoverage}%`);

            const result = await generator.generateTests({
              targetCoverage,
              framework: 'vitest',
              testTypes: ['unit', 'integration'],
              validate: true,
            });

            console.log(`Generated ${result.tests.length} tests`);
            console.log(`Coverage gain: ${result.coverageGain}%`);

            // Write results to file
            await fs.writeFile('sica-results.json', JSON.stringify(result, null, 2));

            // Write generated tests to files
            for (const test of result.tests) {
              const testPath = test.target.replace('.ts', '.sica.test.ts');
              console.log(`Writing test: ${testPath}`);
              await fs.writeFile(testPath, test.code, 'utf-8');
            }

            process.exit(result.tests.length > 0 ? 0 : 1);
          }

          main().catch(console.error);
          EOF

          # Run the generator
          npx tsx generate-tests.ts 2>&1 || echo "No tests generated"

          # Check if tests were generated
          if [ -f sica-results.json ]; then
            TEST_COUNT=$(jq '.tests | length' sica-results.json)
            COVERAGE_GAIN=$(jq '.coverageGain' sica-results.json)
            echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
            echo "coverage_gain=$COVERAGE_GAIN" >> $GITHUB_OUTPUT
            echo "Generated $TEST_COUNT tests with $COVERAGE_GAIN% coverage gain"
          else
            echo "test_count=0" >> $GITHUB_OUTPUT
            echo "coverage_gain=0" >> $GITHUB_OUTPUT
          fi

      - name: Validate generated tests
        if: steps.generate.outputs.test_count > 0
        run: |
          echo "✅ Validating generated tests..."
          pnpm test --run 2>&1 || echo "Some tests may need adjustment"

      - name: Create Pull Request
        if: |
          steps.generate.outputs.test_count > 0 &&
          github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            test: add SICA-generated tests

            Generated ${{ steps.generate.outputs.test_count }} tests.
            Expected coverage gain: ${{ steps.generate.outputs.coverage_gain }}%

            Co-Authored-By: SICA Agent <noreply@nexus-agents.dev>
          title: 'test: SICA-generated tests (${{ steps.generate.outputs.test_count }} tests)'
          body: |
            ## SICA Automated Test Generation

            **Date:** ${{ github.run_id }}
            **Target Coverage:** ${{ env.TARGET_COVERAGE }}%

            ### Coverage Metrics (Before)
            - Line: ${{ steps.coverage.outputs.line_coverage }}%
            - Branch: ${{ steps.coverage.outputs.branch_coverage }}%
            - Function: ${{ steps.coverage.outputs.function_coverage }}%

            ### Generated
            - Tests: ${{ steps.generate.outputs.test_count }}
            - Expected Coverage Gain: ${{ steps.generate.outputs.coverage_gain }}%

            ### Review Notes
            - [ ] Verify test logic is correct
            - [ ] Check for false positives
            - [ ] Ensure tests are meaningful (not trivial)

            ---
            *Generated by SICA Agent (Issue #256)*
          branch: sica/tests-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            testing
            sica

      - name: Post Summary
        if: always()
        run: |
          echo "### 🤖 SICA Test Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Coverage:** ${{ env.TARGET_COVERAGE }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Coverage Before" >> $GITHUB_STEP_SUMMARY
          echo "- Line: ${{ steps.coverage.outputs.line_coverage }}%" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ steps.coverage.outputs.branch_coverage }}%" >> $GITHUB_STEP_SUMMARY
          echo "- Function: ${{ steps.coverage.outputs.function_coverage }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Results" >> $GITHUB_STEP_SUMMARY
          echo "- Tests Generated: ${{ steps.generate.outputs.test_count || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Gain: ${{ steps.generate.outputs.coverage_gain || 0 }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.generate.outputs.test_count }}" -gt "0" ]; then
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "⚠️ Dry run - no PR created" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ PR created with generated tests" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ No tests generated (coverage may already meet target)" >> $GITHUB_STEP_SUMMARY
          fi
