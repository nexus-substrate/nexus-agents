name: Documentation Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'packages/nexus-agents/src/**'
      - 'packages/nexus-agents/docs/**'
      - 'docs/**'
      - 'scripts/inject-governance.ts'
      - 'scripts/generate-docs-content.ts'
      - 'scripts/generate-tool-reference.ts'
      - 'scripts/generate-strategy-reference.ts'
      - 'scripts/claims-check.ts'
      - 'governance/claims-registry.yaml'
      # #3878: the claims-check job polices the `subject` docs of the registry.
      # README.md / ARCHITECTURE.md are the `subject` of every current claim, so
      # the gate MUST fire when they change — otherwise doc drift skips the gate.
      # Keep this list in sync with the distinct `subject` values in
      # governance/claims-registry.yaml.
      - 'README.md'
      - 'ARCHITECTURE.md'
      # #3844: the per-loop promotion-criteria doc is the `subject` of the
      # loop-promotion-criterion claims, so the gate must fire when it changes.
      - 'docs/governance/loop-promotion-criteria.md'
      - 'CLAUDE.md'
      - 'skills/**'
      - '.github/workflows/docs-check.yml'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Job 1: TypeDoc Drift Detection
  #
  # #4449: the API reference is DERIVED from source + JSDoc and is no longer
  # committed. Two trees used to be: 20 markdown files (126,712 lines) consumed
  # by the website, and 1,931 HTML files (153,130 lines) consumed by nothing at
  # all except this drift check. `changeset:version` regenerated the HTML tree
  # every release, churning 5,886 lines of pure version-string diff into every
  # version PR.
  #
  # The old drift gate was warning-only (#2027), i.e. a check that cannot fail
  # — so the committed docs rotted until they documented deleted symbols. It is
  # replaced by a check that CAN fail: generation must succeed from this PR's
  # source. Output is discarded; only the exit status matters.
  typedoc-check:
    name: TypeDoc Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Generate TypeDoc (must succeed)
        run: |
          # nexus-memory must be built first so TypeDoc can resolve its types
          # (#2766 Phase 5+ adds nexus-memory as a workspace dep of nexus-agents).
          pnpm --filter nexus-memory --fail-if-no-match build
          # The markdown output is what the website renders, so that is the one
          # whose generation must be green. A failure here means the published
          # API reference would be missing, not merely stale.
          pnpm --filter nexus-agents --fail-if-no-match docs:api:md

      # #4504: "some pages exist" is too weak a check — three declared entry
      # points silently emitted nothing for months, so `PipelineRunner` (a
      # canonical path) has no published reference. This asserts page count
      # against DECLARED entry points, with an enumerated allowlist for the
      # three known gaps. A fourth regression still fails.
      - name: Confirm every declared entry point produced a page
        run: pnpm exec tsx scripts/check-typedoc-coverage.ts

      # #4523: a page existing is not the same as a page existing at the URL
      # it has always had. Three barrels emit to docs/api/exports/ because
      # their `@module` tag carries a slash; the other sixteen land flat. A
      # 7-voter panel chose to keep that asymmetry — published URLs are a
      # stable interface — and every voter said a comment would not survive
      # the next tidy-up. This runs against the tree the step above just
      # generated; it does not detect a stale one.
      - name: Confirm the generated page layout has not moved
        run: pnpm exec tsx scripts/check-typedoc-layout.ts

  # Job 2: Link Validation
  # Link validation happens in a dedicated workflow (.github/workflows/link-check.yml)
  # using lychee (broader coverage: external URLs, relative paths, anchors).
  # The previous markdown-link-check job here wrapped every invocation in `|| true`
  # so failures were swallowed — effectively dead CI time. Removed with the
  # devDep cleanup in #2101 (epic #2096).

  # Job 3: Documentation Coverage Check (non-blocking warning per DevEx amendment)
  schema-fanout:
    name: Schema-Fan-Out Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    # #2408 designed this job and two documents have asserted it exists since
    # 2026-05-07 — `docs/architecture/SCHEMA_FANOUT_COVERAGE.md` ("runs in CI")
    # and the documentation-management skill ("Runs ... on every PR"). It was
    # never added. The gate, its tests and its docs all shipped; only the
    # wiring did not, so the cascade it was built to catch (#2253 → #2254 →
    # #2255) has been unguarded while the docs said otherwise.
    #
    # Warn-only, as v1 was designed: the script exits 0 on warnings and only
    # fails on a missing schema or under `--strict`. Promotion to `--strict` is
    # a separate decision that needs a false-positive rate to justify it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check diffs the PR against its base, so it needs history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Check schema fan-out
        run: pnpm exec tsx scripts/check-schema-fanout.ts origin/${{ github.base_ref || 'main' }} --verbose

  docs-coverage:
    name: Documentation Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    continue-on-error: true

    # Skip if [skip-docs] is in PR title or body
    # Rate limited per escape hatch controls

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check escape hatch rate limit
        if: |
          contains(github.event.pull_request.title, '[skip-docs]') ||
          contains(github.event.pull_request.body, '[skip-docs]')
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "::warning::Escape hatch [skip-docs] used by $AUTHOR"

          # #5302: a rate limit used to be claimed here — "2 per author per 7
          # days" — and it could never fire. It read
          # docs/.audit/escape-hatch.log, but that directory holds only
          # .gitkeep and `*.log` is gitignored, so the file is absent from
          # every checkout: the `if [ -f ]` was a provable no-op. The append
          # below it wrote to the runner's workspace, which is discarded when
          # the job ends, so no run could ever observe another's usage. The
          # count was wrong too — `tail -14 | wc -l` counts lines, not days.
          #
          # The claim is removed rather than left standing, because a limit
          # that is advertised and unenforced is worse than none: it invites
          # reliance on a control that does not exist. Real enforcement needs
          # cross-run state (a GitHub API search over past PRs by this author),
          # tracked separately.
          #
          # What remains is genuine: the ::warning:: above records every use in
          # the Actions log and the PR checks UI, attributed to the author.

      - name: Skip if escape hatch used
        if: |
          contains(github.event.pull_request.title, '[skip-docs]') ||
          contains(github.event.pull_request.body, '[skip-docs]')
        run: |
          echo "## Documentation Check Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Escape hatch \`[skip-docs]\` detected. Documentation check bypassed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ This usage has been logged to \`docs/.audit/escape-hatch.log\`" >> $GITHUB_STEP_SUMMARY

      - name: Get changed source files
        id: changed
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]')
        run: |
          # Get source files changed in this PR
          CHANGED_SRC=$(git diff --name-only origin/main...HEAD -- 'packages/nexus-agents/src/**/*.ts' | grep -v '\.test\.ts$' | grep -v '\.spec\.ts$' | grep -v '/types/' || true)
          echo "Changed source files:"
          echo "$CHANGED_SRC"

          # Handle empty case to avoid GITHUB_OUTPUT format errors
          if [ -z "$CHANGED_SRC" ]; then
            echo "No source files changed"
            echo "count=0" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            COUNT=$(echo "$CHANGED_SRC" | grep -c . || echo 0)
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_SRC" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Check for documentation updates
        id: docs
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]') &&
          steps.changed.outputs.count > 0
        run: |
          # Check if any documentation was updated
          DOC_CHANGED=$(git diff --name-only origin/main...HEAD -- \
            'README.md' \
            'ARCHITECTURE.md' \
            'CLAUDE.md' \
            'CODING_STANDARDS.md' \
            'CHANGELOG.md' \
            'docs/**/*.md' \
            'docs/ENTRYPOINTS.md' || true)

          echo "Documentation files changed:"
          echo "$DOC_CHANGED"

          if [ -z "$DOC_CHANGED" ]; then
            echo "has_docs=false" >> $GITHUB_OUTPUT
          else
            echo "has_docs=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for new modules
        id: modules
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]') &&
          steps.changed.outputs.count > 0
        run: |
          # Check for new index.ts files (new modules)
          NEW_MODULES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'packages/nexus-agents/src/**/index.ts' || true)

          UNDOCUMENTED=""
          for module_file in $NEW_MODULES; do
            # Extract module name from path
            MODULE=$(dirname "$module_file" | sed 's|packages/nexus-agents/src/||')

            # Check if module is documented in ARCHITECTURE.md
            if ! grep -q "$MODULE" ARCHITECTURE.md 2>/dev/null; then
              UNDOCUMENTED="$UNDOCUMENTED $MODULE"
            fi
          done

          if [ -n "$UNDOCUMENTED" ]; then
            echo "undocumented=$UNDOCUMENTED" >> $GITHUB_OUTPUT
            echo "has_undocumented=true" >> $GITHUB_OUTPUT
          else
            echo "has_undocumented=false" >> $GITHUB_OUTPUT
          fi

      - name: Report documentation status
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]') &&
          steps.changed.outputs.count > 0
        run: |
          echo "## Documentation Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Source Files Changed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changed.outputs.files }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.docs.outputs.has_docs }}" = "false" ]; then
            echo "### ⚠️ Warning: No Documentation Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Source files were changed but no documentation was updated." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Consider updating:**" >> $GITHUB_STEP_SUMMARY
            echo "- \`docs/ENTRYPOINTS.md\` - For new/changed CLI commands, MCP tools, or API endpoints" >> $GITHUB_STEP_SUMMARY
            echo "- \`ARCHITECTURE.md\` - For architectural changes or new modules" >> $GITHUB_STEP_SUMMARY
            echo "- \`CLAUDE.md\` - For new protocols or development patterns" >> $GITHUB_STEP_SUMMARY
            echo "- \`CHANGELOG.md\` - For user-facing changes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To skip this check, add \`[skip-docs]\` to your PR title or description." >> $GITHUB_STEP_SUMMARY

            # Warning annotation (not blocking per DevEx amendment)
            echo "::warning::No documentation updated for source changes. Consider updating relevant docs."
          else
            echo "### ✅ Documentation Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Documentation changes detected alongside source changes." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.modules.outputs.has_undocumented }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Warning: New Modules Not in ARCHITECTURE.md" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following new modules should be documented in ARCHITECTURE.md:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.modules.outputs.undocumented }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # Warning annotation (not blocking per DevEx amendment)
            echo "::warning::New modules detected that are not documented in ARCHITECTURE.md: ${{ steps.modules.outputs.undocumented }}"
          fi

      - name: Skip message
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]') &&
          steps.changed.outputs.count == 0
        run: |
          echo "## Documentation Check Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No source files changed (or only test/type files changed)." >> $GITHUB_STEP_SUMMARY

  # Job 5: Secrets Guardrails
  secrets-scan:
    name: Documentation Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gacts/gitleaks@c9a0338361dc45a01aa7ebaaa5330179f3c62873 # v1.3.2
        with:
          config-path: .gitleaks.toml

  # Job 6: Repository Index Check
  repo-index:
    name: Repository Index Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check repository index
        run: |
          if pnpm exec tsx scripts/generate-repo-index.ts --check; then
            echo "✅ Repository capability index is up to date"
          else
            echo "::error::Repository capability index is out of date"
            echo "Run 'pnpm exec tsx scripts/generate-repo-index.ts' and commit the changes"
            exit 1
          fi

  # Job 6b: Tool-Reference Drift (#3689) — the generated per-tool MCP reference
  # (docs/reference/tools/, from scripts/generate-tool-reference.ts, #3687) must
  # be current. Mirrors the repo-index/governance --check gates: regenerate in
  # memory and fail if the committed output differs.
  tool-reference-drift:
    name: Tool Reference Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Build nexus-memory (workspace dep)
        working-directory: packages/nexus-agents
        # The generator now imports the real tool modules to introspect their Zod
        # input schemas (#3688); tool-memory.ts transitively imports `nexus-memory`,
        # so its dist must be built before the generator runs (mirrors the TypeDoc job).
        run: pnpm --filter nexus-memory --fail-if-no-match build

      - name: Check generated tool reference
        run: |
          if pnpm exec tsx scripts/generate-tool-reference.ts --check; then
            echo "✅ Generated tool reference is up to date"
          else
            echo "::error::Generated tool reference is out of date"
            echo "Run 'pnpm docs:tools' and commit the changes"
            exit 1
          fi

  # Job 6c: Strategy-Reference Drift (#3838) — the generated strategy-manifest
  # reference (docs/reference/strategies/, from
  # scripts/generate-strategy-reference.ts) must be current. The force-strategy
  # docs are generated FROM the strategy-manifest registry (the single source of
  # truth the router reads), so they cannot drift. Mirrors the tool-reference
  # drift gate: regenerate in memory and fail if the committed output differs.
  strategy-reference-drift:
    name: Strategy Reference Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check generated strategy reference
        run: |
          if pnpm exec tsx scripts/generate-strategy-reference.ts --check; then
            echo "✅ Generated strategy reference is up to date"
          else
            echo "::error::Generated strategy reference is out of date"
            echo "Run 'pnpm docs:strategies' and commit the changes"
            exit 1
          fi

  # Job 8: DocOps Skill Synchronization
  docops-skill-sync:
    name: DocOps Skill Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Check DocOps skill synchronization
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          if pnpm exec tsx scripts/check-docops-skill.ts --verbose; then
            echo "✅ DocOps skill sync check passed"
          else
            echo "::error::DocOps pipeline changed without skill update"
            echo "Update skills/documentation-management/SKILL.md to reflect pipeline changes"
            exit 1
          fi

  # Job 8b: Registry-Coverage Gate (#2406)
  registry-coverage:
    name: Registry-Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Check registry-coverage manifest
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: pnpm exec tsx scripts/check-registry-coverage.ts --verbose

  # Job 8c2: MCP description-drift gate (#3528) — runtime registerTool description
  # must agree with the TOOL_DESCRIPTIONS doc-table source.
  mcp-description-drift:
    name: MCP Description Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Check MCP tool description drift
        run: pnpm exec tsx scripts/check-mcp-description-drift.ts --verbose

  # Job 8d: Orphan Detection (#2410) — blocking since #4583
  orphan-detection:
    name: Orphan Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Run orphan detection
        run: pnpm exec tsx scripts/check-orphans.ts --verbose

  # Job 9: Canonical Index Validation
  canonical-index:
    name: Canonical Index Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check all docs are indexed
        run: |
          if pnpm exec tsx scripts/check-docs-indexed.ts; then
            echo "✅ All documentation properly indexed in docs/README.md"
          else
            echo "::error::Unindexed documentation files found"
            echo "Add missing docs to docs/README.md (canonical index)"
            pnpm exec tsx scripts/check-docs-indexed.ts --fix
            exit 1
          fi

  # Job 9b: Harness Alignment Drift Gate (#2805 Phase 5)
  # Fails when any harness discovery file (.cursor/, .windsurf/, .aider.conf.yml,
  # .continue/, .clinerules/) exists without referencing AGENTS.md. Enforces the
  # option-B federation invariant: redirects, never duplication.
  harness-alignment:
    name: Harness Alignment Drift
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check harness configs redirect to AGENTS.md
        run: pnpm exec tsx scripts/check-harness-alignment.ts

  # Job 10: Markdown Linting
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Lint markdown files
        run: |
          if pnpm lint:md; then
            echo "✅ All markdown files pass linting"
          else
            echo "::error::Markdown linting errors found"
            echo "Run 'pnpm lint:md:fix' to auto-fix issues"
            exit 1
          fi

  # Job 10.5: Documentation Content Drift Detection
  docs-content-drift:
    name: Docs Content Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check documentation content drift
        run: |
          if pnpm exec tsx scripts/generate-docs-content.ts --check; then
            echo "✅ Documentation content matches source of truth"
          else
            echo "::error::Documentation content has drifted from source"
            echo "Run 'pnpm exec tsx scripts/generate-docs-content.ts' to see details"
            exit 1
          fi

      # Guard against re-introduction of paths removed in #1619 (llms.txt
      # pipeline). The removed files don't exist, so a reference to them in
      # any doc or workflow is almost certainly stale. Exceptions:
      #   - docs/ops/docops-spec.md explicitly documents the removal
      #   - skills/documentation-management/SKILL.md line 15 pipeline note
      #     (PIPELINE NOTE: "...removed in #1619")
      #   - docs/archive/ is frozen historical content
      - name: Guard against references to removed files (#2096)
        run: |
          set -e
          REMOVED_PATHS=(
            "scripts/generate-docs.ts"
            "scripts/generate-docs-full.ts"
            "docs/llms.txt"
            "docs/llms-full.txt"
          )
          any_failed=0
          for path in "${REMOVED_PATHS[@]}"; do
            # Escape periods for grep's BRE pattern
            pattern="${path//./\\.}"
            hits=$(grep -rn "$pattern" \
              --include='*.md' --include='*.yml' --include='*.yaml' \
              --include='*.json' --include='*.ts' \
              --exclude-dir=node_modules --exclude-dir=.git \
              --exclude-dir=dist --exclude-dir=.astro --exclude-dir=coverage \
              --exclude-dir=docs/archive \
              . 2>/dev/null \
              | grep -v 'docs/ops/docops-spec.md' \
              | grep -v 'skills/documentation-management/SKILL.md:.*PIPELINE NOTE' \
              | grep -v '.github/workflows/docs-check.yml' || true)
            if [ -n "$hits" ]; then
              echo "::error::Found stale reference to removed path \`$path\` (removed in #1619):"
              echo "$hits"
              any_failed=1
            fi
          done
          if [ "$any_failed" -ne 0 ]; then
            echo ""
            echo "These files were removed in #1619. Update the reference to point at the"
            echo "current replacement (\`scripts/generate-docs-content.ts\`, \`docs/README.md\`)"
            echo "or remove the mention if it no longer applies. See #2096 for context."
            exit 1
          fi
          echo "✅ No stale references to removed paths"

      # MCP tool count must agree across every file that claims to know it
      # (see #2106 for the failure mode — three files claimed 29/30/31). The
      # source of truth is the `tools: [...]` array in
      # `packages/nexus-agents/src/mcp/tools/index.ts`. Other callers mirror
      # it, and silent drift means marketplace metadata lies about what we ship.
      - name: Guard against MCP_TOOL_COUNT drift (#2107)
        run: |
          set -e
          # #3566: canonical tool-name list is the leaf TOOL_MANIFEST array.
          TOOLS_SRC=packages/nexus-agents/src/mcp/tools/tool-manifest.ts
          SITE_DATA=website/src/data/site-data.ts
          SERVER_JSON=packages/nexus-agents/server.json
          README=README.md

          # 1. Authoritative count: #3597 made TOOL_MANIFEST an object array, so
          #    each entry is a `    name: 'tool_name',` line. Count those between
          #    `TOOL_MANIFEST = [` and `] as const`. Fall back to the pre-#3597
          #    bare-string shape, then pre-#3566 REGISTERED_TOOL_NAMES / legacy
          #    `tools: [` for older checkouts.
          src_count=$(awk '/TOOL_MANIFEST\s*=\s*\[/,/\]\s*as const/' "$TOOLS_SRC" \
            | grep -cE "^\s+name: '[a-z_]+'," || true)
          if [ "$src_count" -eq 0 ]; then
            src_count=$(awk '/TOOL_MANIFEST\s*=\s*\[/,/\]\s*as const/' "$TOOLS_SRC" \
              | grep -cE "^\s+'[a-z_]+'," || true)
          fi
          if [ "$src_count" -eq 0 ]; then
            src_count=$(awk '/REGISTERED_TOOL_NAMES\s*=\s*\[/,/\]\s*as const/' "$TOOLS_SRC" \
              | grep -cE "^\s+'[a-z_]+'," || true)
          fi
          if [ "$src_count" -eq 0 ]; then
            src_count=$(awk '/tools: \[/,/\]/' "$TOOLS_SRC" \
              | grep -cE "^\s+'[a-z_]+'," || true)
          fi
          echo "Authoritative tool count (from $TOOLS_SRC): $src_count"

          # 2. MCP_TOOL_COUNT constant in site-data.ts
          site_count=$(grep -oE "MCP_TOOL_COUNT\s*=\s*[0-9]+" "$SITE_DATA" \
            | grep -oE "[0-9]+" | head -1)

          # 3. server.json tools array length (simple JSON-aware parse via jq)
          server_count=$(jq '.tools | length' "$SERVER_JSON")

          # 4. server.json description prose: "N MCP tools"
          server_desc_count=$(jq -r '.description' "$SERVER_JSON" \
            | grep -oE "[0-9]+ MCP tools" | grep -oE "^[0-9]+" | head -1)

          # 5. README.md prose: "N MCP tools" (may appear multiple times)
          readme_counts=$(grep -oE "[0-9]+ MCP tools" "$README" \
            | grep -oE "^[0-9]+" | sort -u)

          # 6. docs/**.md user-facing prose (#3052). Catches the docs site's
          #    own README + getting-started + distribution copy that goes to
          #    marketplace listings. Audit/research/archive docs are excluded
          #    because they often reference a historical tool count as a
          #    snapshot, not a current-day fact — updating those would be
          #    revisionist (e.g. archive/design-v2/* references "21 MCP tools"
          #    as the pre-#1303 baseline).
          docs_mentions=$(grep -rEn "[0-9]+ MCP tools" docs/ \
            --include="*.md" \
            --exclude-dir=research \
            --exclude-dir=archive \
            --exclude-dir=api \
            2>/dev/null || true)

          any_drift=0
          check() {
            local label="$1" actual="$2"
            if [ "$actual" != "$src_count" ]; then
              echo "::error::MCP tool count drift: $label reports '$actual' but source has $src_count"
              any_drift=1
            fi
          }
          check "site-data.ts MCP_TOOL_COUNT" "$site_count"
          check "server.json tools[]" "$server_count"
          check "server.json description prose" "$server_desc_count"
          # #5302: a `while read` over an empty string runs its body once with an
          # empty $n, the guard is false, and NO check happens — while the step
          # still prints "✅ MCP_TOOL_COUNT agrees everywhere". Rewording the
          # README from "47 MCP tools" to "47 tools" would silently retire this
          # leg. The README is expected to state the count, so finding none is
          # itself drift.
          if [ -z "$readme_counts" ]; then
            echo "::error::README.md states no 'N MCP tools' count."
            echo "This check cannot verify a count that is not there. Either restore"
            echo "the phrase or update this workflow to match the new wording."
            any_drift=1
          else
            while IFS= read -r n; do
              [ -n "$n" ] && check "README.md prose '$n MCP tools'" "$n"
            done <<< "$readme_counts"
          fi
          # Each match line is "<file>:<lineno>:<…N MCP tools…>" — extract N
          # per line and check it; if the same file mentions multiple counts
          # they each get their own error line so the file:line is reported.
          if [ -n "$docs_mentions" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              file_line=$(echo "$line" | cut -d: -f1-2)
              n=$(echo "$line" | grep -oE "[0-9]+ MCP tools" | grep -oE "^[0-9]+" | head -1)
              [ -n "$n" ] && check "$file_line ('$n MCP tools')" "$n"
            done <<< "$docs_mentions"
          fi

          if [ "$any_drift" -ne 0 ]; then
            echo ""
            echo "Update the drifted value(s) to match $TOOLS_SRC."
            echo "See #2107 for context."
            exit 1
          fi
          echo "✅ MCP_TOOL_COUNT agrees everywhere ($src_count)"

  # Job 10.6: Skills Index Freshness (#1828)
  skills-index-check:
    name: Skills Index Freshness
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check skills/index.yaml freshness
        run: |
          if ! pnpm exec tsx scripts/generate-skills-index.ts --check; then
            echo "::error::skills/index.yaml is stale"
            echo "Run: pnpm exec tsx scripts/generate-skills-index.ts"
            exit 1
          fi

  # Job 10.7: Agents Index Freshness + Gap Coverage (#1825 follow-up)
  agents-index-check:
    name: Agents Index Freshness
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check agents/index.yaml freshness + coverage
        run: |
          if ! pnpm exec tsx scripts/generate-agents-index.ts --check; then
            echo "::error::agents/index.yaml is stale or an expert is missing its agent file"
            echo "Run: pnpm exec tsx scripts/generate-agents-index.ts"
            exit 1
          fi

  # Job 11: Governance Registry Drift Detection
  governance-drift:
    name: Governance Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed so `inject-governance.ts` can read the
          # commit dates of canonical source files to compute the
          # deterministic version stamp (#2571).
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Check governance registries
        run: |
          if pnpm exec tsx scripts/inject-governance.ts check; then
            echo "✅ Governance registries are in sync"
          else
            echo "::error::Governance registries have drifted from source code"
            echo "Run 'pnpm exec tsx scripts/inject-governance.ts inject' and commit the changes"
            exit 1
          fi

      - name: Verify injection idempotency
        run: |
          pnpm exec tsx scripts/inject-governance.ts inject
          if git diff --exit-code CLAUDE.md; then
            echo "✅ CLAUDE.md governance sections are up to date"
          else
            echo "::error::CLAUDE.md governance sections are stale"
            echo "Run 'pnpm exec tsx scripts/inject-governance.ts inject' and commit the changes"
            git diff CLAUDE.md
            exit 1
          fi

  # Job 12: Claims Registry Drift (#3825, #3826) — blocking
  #
  # Sibling to governance-drift. `claims:check` loads governance/claims-registry.yaml,
  # validates it against the Zod schema, and verifies every claim against live source
  # (evidence path exists; counts match the source-of-truth enum/manifest; aspirational
  # claims still marked roadmap in their doc). Fails the build on any drift — an
  # unbacked or stale claim — keeping README/ARCHITECTURE honest. BLOCKING per #3826.
  #
  # #3880: `claims:check` now ALSO runs a reverse coverage scan (claims-coverage.ts).
  # It fails when README.md / ARCHITECTURE.md make a quantified capability claim
  # ("N MCP tools", "N built-in expert types", "N strategies") with no covering
  # registry entry — closing the author-controlled-allowlist gap (silent removal /
  # mask-by-addition). This is the #3826 deferred undeclared-claim detector, kept
  # high-precision via a closed set of sentinel regexes (low false positives).
  claims-check:
    name: Claims Registry Drift
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check claims registry
        run: |
          if pnpm claims:check; then
            echo "✅ All documented claims are backed by live evidence"
          else
            echo "::error::A documented claim is unbacked or stale"
            echo "Reconcile governance/claims-registry.yaml with current source (see #3824)"
            exit 1
          fi

  # Job 13: Spell Check (Warning Only)
  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking - reports warnings only
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Check spelling in documentation
        run: |
          # #5302: `pnpm spell | tee` takes tee's exit status, not cspell's, and
          # this shell has no `-o pipefail`. So a cspell CRASH produced a file
          # with no "Unknown word" in it and the step printed
          # "✅ No spelling issues found" — a clean result for a check that
          # never ran. The job is advisory (continue-on-error), so this was
          # never a merge-gate bypass; it was a false statement in the log.
          set -o pipefail
          spell_status=0
          pnpm spell 2>&1 | tee spell-results.txt || spell_status=$?

          ERRORS=$(grep -c "Unknown word" spell-results.txt || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::Found $ERRORS potential spelling issues"
            echo "Run 'pnpm spell' locally to see details"
            echo "Add valid terms to cspell.json words array"
          elif [ "$spell_status" -ne 0 ]; then
            # Non-zero with no findings means the tool itself failed. Reporting
            # this as a clean spell-check is the one outcome that must not happen.
            echo "::warning::cspell exited $spell_status without reporting findings —"
            echo "spelling was NOT checked. This is not a clean result."
          else
            echo "✅ No spelling issues found"
          fi

  # ==========================================================================
  # Aggregate verdict (#4809)
  # ==========================================================================
  docs-success:
    name: Docs Success
    # This workflow had twenty jobs and no aggregator, so none of them could
    # block a merge: branch protection requires named contexts, and there was
    # no single context expressing "the documentation gate passed". #4808
    # drifted docs/reference/tools/run.md, `Tool Reference Drift` went red, and
    # only a duplicate assertion inside the required `Script Tests` job stopped
    # the merge.
    #
    # NOT BLOCKING BY ITSELF. Adding "Docs Success" to branch protection's
    # required contexts is owner work, tracked in #4802. What this job does
    # today is collapse twenty scattered results into one honest verdict, and
    # scripts/ci-required-jobs.test.ts keeps its `needs` list complete so the
    # context is correct the moment protection starts requiring it.
    #
    # docs-coverage and spell-check are excluded deliberately: both carry
    # continue-on-error, so requiring them would be a gate that cannot fail.
    needs:
      - typedoc-check
      - schema-fanout
      - secrets-scan
      - repo-index
      - tool-reference-drift
      - strategy-reference-drift
      - docops-skill-sync
      - registry-coverage
      - mcp-description-drift
      - orphan-detection
      - canonical-index
      - harness-alignment
      - markdown-lint
      - docs-content-drift
      - skills-index-check
      - agents-index-check
      - governance-drift
      - claims-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check required jobs
        run: |
          # A skipped job counts as a pass: the push trigger is path-filtered, so
          # jobs legitimately skip on unrelated changes.
          if [[ "${{ needs.typedoc-check.result }}" != "success" && "${{ needs.typedoc-check.result }}" != "skipped" ]] || \
             [[ "${{ needs.schema-fanout.result }}" != "success" && "${{ needs.schema-fanout.result }}" != "skipped" ]] || \
             [[ "${{ needs.secrets-scan.result }}" != "success" && "${{ needs.secrets-scan.result }}" != "skipped" ]] || \
             [[ "${{ needs.repo-index.result }}" != "success" && "${{ needs.repo-index.result }}" != "skipped" ]] || \
             [[ "${{ needs.tool-reference-drift.result }}" != "success" && "${{ needs.tool-reference-drift.result }}" != "skipped" ]] || \
             [[ "${{ needs.strategy-reference-drift.result }}" != "success" && "${{ needs.strategy-reference-drift.result }}" != "skipped" ]] || \
             [[ "${{ needs.docops-skill-sync.result }}" != "success" && "${{ needs.docops-skill-sync.result }}" != "skipped" ]] || \
             [[ "${{ needs.registry-coverage.result }}" != "success" && "${{ needs.registry-coverage.result }}" != "skipped" ]] || \
             [[ "${{ needs.mcp-description-drift.result }}" != "success" && "${{ needs.mcp-description-drift.result }}" != "skipped" ]] || \
             [[ "${{ needs.orphan-detection.result }}" != "success" && "${{ needs.orphan-detection.result }}" != "skipped" ]] || \
             [[ "${{ needs.canonical-index.result }}" != "success" && "${{ needs.canonical-index.result }}" != "skipped" ]] || \
             [[ "${{ needs.harness-alignment.result }}" != "success" && "${{ needs.harness-alignment.result }}" != "skipped" ]] || \
             [[ "${{ needs.markdown-lint.result }}" != "success" && "${{ needs.markdown-lint.result }}" != "skipped" ]] || \
             [[ "${{ needs.docs-content-drift.result }}" != "success" && "${{ needs.docs-content-drift.result }}" != "skipped" ]] || \
             [[ "${{ needs.skills-index-check.result }}" != "success" && "${{ needs.skills-index-check.result }}" != "skipped" ]] || \
             [[ "${{ needs.agents-index-check.result }}" != "success" && "${{ needs.agents-index-check.result }}" != "skipped" ]] || \
             [[ "${{ needs.governance-drift.result }}" != "success" && "${{ needs.governance-drift.result }}" != "skipped" ]] || \
             [[ "${{ needs.claims-check.result }}" != "success" && "${{ needs.claims-check.result }}" != "skipped" ]]; then
            echo "::error::One or more documentation gates failed."
            exit 1
          fi
          echo "All documentation gates passed."
