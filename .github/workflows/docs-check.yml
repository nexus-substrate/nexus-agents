name: Documentation Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'packages/nexus-agents/src/**'
      - 'packages/nexus-agents/docs/**'
      - 'docs/**'
      - 'scripts/inject-governance.ts'
      - 'CLAUDE.md'
      - '.claude/skills/**'
      - '.github/workflows/docs-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: TypeDoc Drift Detection
  typedoc-check:
    name: TypeDoc Verification
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node

      - name: Generate TypeDoc
        run: pnpm --filter nexus-agents docs

      - name: Check TypeDoc drift
        run: |
          if git diff --exit-code packages/nexus-agents/docs/api/; then
            echo "✅ TypeDoc output is in sync"
          else
            echo "::error::TypeDoc output has drifted from committed version"
            echo "Run 'pnpm --filter nexus-agents docs' and commit the changes"
            exit 1
          fi

  # Job 2: Link Validation
  link-check:
    name: Link Validation
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node

      - name: Check markdown links
        run: |
          echo "Checking links in markdown files..."
          find docs -name '*.md' -not -path 'docs/api/*' | head -50 | while read file; do
            echo "Checking: $file"
            pnpm exec markdown-link-check "$file" --config .markdown-link-check.json || true
          done
          # Also check root markdown files
          for file in README.md ARCHITECTURE.md CLAUDE.md CODING_STANDARDS.md CHANGELOG.md; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              pnpm exec markdown-link-check "$file" --config .markdown-link-check.json || true
            fi
          done

  # Job 3: Documentation Coverage Check (non-blocking warning per DevEx amendment)
  docs-coverage:
    name: Documentation Coverage
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    continue-on-error: true

    # Skip if [skip-docs] is in PR title or body
    # Rate limited per escape hatch controls

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check escape hatch rate limit
        if: |
          contains(github.event.pull_request.title, '[skip-docs]') ||
          contains(github.event.pull_request.body, '[skip-docs]')
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "::warning::Escape hatch [skip-docs] used by $AUTHOR"

          # Check rate limit (2 per author per 7 days)
          if [ -f "docs/.audit/escape-hatch.log" ]; then
            RECENT=$(grep "| $AUTHOR |" docs/.audit/escape-hatch.log 2>/dev/null | \
                     tail -14 | wc -l || echo 0)
            if [ "$RECENT" -ge 2 ]; then
              echo "::error::Rate limit exceeded. $AUTHOR has used [skip-docs] $RECENT times recently (limit: 2 per 7 days)"
              exit 1
            fi
          fi

          # Log usage
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') | [skip-docs] | $AUTHOR | ${{ github.event.pull_request.head.sha }}" >> docs/.audit/escape-hatch.log

      - name: Skip if escape hatch used
        if: |
          contains(github.event.pull_request.title, '[skip-docs]') ||
          contains(github.event.pull_request.body, '[skip-docs]')
        run: |
          echo "## Documentation Check Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Escape hatch \`[skip-docs]\` detected. Documentation check bypassed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ This usage has been logged to \`docs/.audit/escape-hatch.log\`" >> $GITHUB_STEP_SUMMARY

      - name: Get changed source files
        id: changed
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]')
        run: |
          # Get source files changed in this PR
          CHANGED_SRC=$(git diff --name-only origin/main...HEAD -- 'packages/nexus-agents/src/**/*.ts' | grep -v '\.test\.ts$' | grep -v '\.spec\.ts$' | grep -v '/types/' || true)
          echo "Changed source files:"
          echo "$CHANGED_SRC"

          # Handle empty case to avoid GITHUB_OUTPUT format errors
          if [ -z "$CHANGED_SRC" ]; then
            echo "No source files changed"
            echo "count=0" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            COUNT=$(echo "$CHANGED_SRC" | grep -c . || echo 0)
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_SRC" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Check for documentation updates
        id: docs
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]') &&
          steps.changed.outputs.count > 0
        run: |
          # Check if any documentation was updated
          DOC_CHANGED=$(git diff --name-only origin/main...HEAD -- \
            'README.md' \
            'ARCHITECTURE.md' \
            'CLAUDE.md' \
            'CODING_STANDARDS.md' \
            'CHANGELOG.md' \
            'docs/**/*.md' \
            'docs/ENTRYPOINTS.md' || true)

          echo "Documentation files changed:"
          echo "$DOC_CHANGED"

          if [ -z "$DOC_CHANGED" ]; then
            echo "has_docs=false" >> $GITHUB_OUTPUT
          else
            echo "has_docs=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for new modules
        id: modules
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]') &&
          steps.changed.outputs.count > 0
        run: |
          # Check for new index.ts files (new modules)
          NEW_MODULES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'packages/nexus-agents/src/**/index.ts' || true)

          UNDOCUMENTED=""
          for module_file in $NEW_MODULES; do
            # Extract module name from path
            MODULE=$(dirname "$module_file" | sed 's|packages/nexus-agents/src/||')

            # Check if module is documented in ARCHITECTURE.md
            if ! grep -q "$MODULE" ARCHITECTURE.md 2>/dev/null; then
              UNDOCUMENTED="$UNDOCUMENTED $MODULE"
            fi
          done

          if [ -n "$UNDOCUMENTED" ]; then
            echo "undocumented=$UNDOCUMENTED" >> $GITHUB_OUTPUT
            echo "has_undocumented=true" >> $GITHUB_OUTPUT
          else
            echo "has_undocumented=false" >> $GITHUB_OUTPUT
          fi

      - name: Report documentation status
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]') &&
          steps.changed.outputs.count > 0
        run: |
          echo "## Documentation Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Source Files Changed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changed.outputs.files }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.docs.outputs.has_docs }}" = "false" ]; then
            echo "### ⚠️ Warning: No Documentation Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Source files were changed but no documentation was updated." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Consider updating:**" >> $GITHUB_STEP_SUMMARY
            echo "- \`docs/ENTRYPOINTS.md\` - For new/changed CLI commands, MCP tools, or API endpoints" >> $GITHUB_STEP_SUMMARY
            echo "- \`ARCHITECTURE.md\` - For architectural changes or new modules" >> $GITHUB_STEP_SUMMARY
            echo "- \`CLAUDE.md\` - For new protocols or development patterns" >> $GITHUB_STEP_SUMMARY
            echo "- \`CHANGELOG.md\` - For user-facing changes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To skip this check, add \`[skip-docs]\` to your PR title or description." >> $GITHUB_STEP_SUMMARY

            # Warning annotation (not blocking per DevEx amendment)
            echo "::warning::No documentation updated for source changes. Consider updating relevant docs."
          else
            echo "### ✅ Documentation Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Documentation changes detected alongside source changes." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.modules.outputs.has_undocumented }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Warning: New Modules Not in ARCHITECTURE.md" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following new modules should be documented in ARCHITECTURE.md:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.modules.outputs.undocumented }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # Warning annotation (not blocking per DevEx amendment)
            echo "::warning::New modules detected that are not documented in ARCHITECTURE.md: ${{ steps.modules.outputs.undocumented }}"
          fi

      - name: Skip message
        if: |
          !contains(github.event.pull_request.title, '[skip-docs]') &&
          !contains(github.event.pull_request.body, '[skip-docs]') &&
          steps.changed.outputs.count == 0
        run: |
          echo "## Documentation Check Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No source files changed (or only test/type files changed)." >> $GITHUB_STEP_SUMMARY

  # Job 4: LLMs.txt Generation + Frontmatter Check
  llms-txt-check:
    name: LLMs.txt & Frontmatter Verification
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node

      - name: Check llms.txt generation and frontmatter
        run: |
          npx tsx scripts/generate-docs.ts --check
          if [ $? -eq 0 ]; then
            echo "✅ llms.txt files and frontmatter are valid"
          else
            echo "::error::llms.txt or frontmatter validation failed"
            echo "Run 'npx tsx scripts/generate-docs.ts' and commit the changes"
            exit 1
          fi

  # Job 5: Secrets Guardrails
  secrets-scan:
    name: Documentation Secrets Scan
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gacts/gitleaks@9d471d3bda7ee95b6fa416fdfe7e87cf393554d5 # v1.3.1
        with:
          config-path: .gitleaks.toml

  # Job 6: Repository Index Check
  repo-index:
    name: Repository Index Verification
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node

      - name: Check repository index
        run: |
          npx tsx scripts/generate-repo-index.ts --check
          if [ $? -eq 0 ]; then
            echo "✅ Repository capability index is up to date"
          else
            echo "::error::Repository capability index is out of date"
            echo "Run 'npx tsx scripts/generate-repo-index.ts' and commit the changes"
            exit 1
          fi

  # Job 8: DocOps Skill Synchronization
  docops-skill-sync:
    name: DocOps Skill Sync
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Check DocOps skill synchronization
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          npx tsx scripts/check-docops-skill.ts --verbose
          if [ $? -eq 0 ]; then
            echo "✅ DocOps skill sync check passed"
          else
            echo "::error::DocOps pipeline changed without skill update"
            echo "Update .claude/skills/documentation-management.md to reflect pipeline changes"
            exit 1
          fi

  # Job 9: Canonical Index Validation
  canonical-index:
    name: Canonical Index Check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node

      - name: Check all docs are indexed
        run: |
          npx tsx scripts/check-docs-indexed.ts
          if [ $? -eq 0 ]; then
            echo "✅ All documentation properly indexed in docs/README.md"
          else
            echo "::error::Unindexed documentation files found"
            echo "Add missing docs to docs/README.md (canonical index)"
            npx tsx scripts/check-docs-indexed.ts --fix
            exit 1
          fi

  # Job 10: Markdown Linting
  markdown-lint:
    name: Markdown Lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node

      - name: Lint markdown files
        run: |
          pnpm lint:md
          if [ $? -eq 0 ]; then
            echo "✅ All markdown files pass linting"
          else
            echo "::error::Markdown linting errors found"
            echo "Run 'pnpm lint:md:fix' to auto-fix issues"
            exit 1
          fi

  # Job 11: Governance Registry Drift Detection
  governance-drift:
    name: Governance Drift Check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node

      - name: Check governance registries
        run: |
          npx tsx scripts/inject-governance.ts check
          if [ $? -eq 0 ]; then
            echo "✅ Governance registries are in sync"
          else
            echo "::error::Governance registries have drifted from source code"
            echo "Run 'npx tsx scripts/inject-governance.ts inject' and commit the changes"
            exit 1
          fi

      - name: Verify injection idempotency
        run: |
          npx tsx scripts/inject-governance.ts inject
          if git diff --exit-code CLAUDE.md; then
            echo "✅ CLAUDE.md governance sections are up to date"
          else
            echo "::error::CLAUDE.md governance sections are stale"
            echo "Run 'npx tsx scripts/inject-governance.ts inject' and commit the changes"
            git diff CLAUDE.md
            exit 1
          fi

  # Job 13: Spell Check (Warning Only)
  spell-check:
    name: Spell Check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # Non-blocking - reports warnings only
    continue-on-error: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node

      - name: Check spelling in documentation
        run: |
          pnpm spell 2>&1 | tee spell-results.txt
          ERRORS=$(grep -c "Unknown word" spell-results.txt || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::Found $ERRORS potential spelling issues"
            echo "Run 'pnpm spell' locally to see details"
            echo "Add valid terms to cspell.json words array"
          else
            echo "✅ No spelling issues found"
          fi
