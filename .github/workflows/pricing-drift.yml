name: Pricing Drift Check

on:
  schedule:
    - cron: '23 8 * * 1' # Weekly Monday ~8:23am UTC (off-minute per CLAUDE.md)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check model pricing drift
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Check pricing drift against litellm
        id: drift
        run: |
          OUTPUT=$(pnpm check:pricing-drift 2>&1)
          echo "$OUTPUT"
          # Read the script's explicit verdict, not the prose. Scraping
          # "N field" out of the report meant a fetch failure — which prints no
          # report at all — fell through to `|| echo 0` and rendered as clean
          # pricing (#4927). The default is now `skipped`, so an absent verdict
          # is reported as absent.
          STATUS=$(echo "$OUTPUT" | grep -oP 'PRICING_DRIFT_STATUS=\K\S+' | tail -1 || echo "skipped")
          COUNT=$(echo "$OUTPUT" | grep -oP 'PRICING_DRIFT_COUNT=\K\d+' | tail -1 || echo "0")
          echo "drift_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "drift_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" > drift-report.txt

      - name: Note a loud skip (catalog fetch failure — NOT "no drift")
        if: steps.drift.outputs.drift_status == 'skipped'
        run: |
          echo "::warning::Pricing-drift check SKIPPED — the litellm catalog fetch failed or the script errored. Not treated as 'no drift'; re-run when the catalog is reachable."

      - name: Note drift below the issue threshold
        if: steps.drift.outputs.drift_status == 'drift' && steps.drift.outputs.drift_count <= 5
        run: |
          echo "::warning::Pricing drift in ${{ steps.drift.outputs.drift_count }} field(s) — below the 5-field issue threshold, so no issue was filed. Real drift, reported rather than dropped."

      - name: Create issue if significant drift found
        if: steps.drift.outputs.drift_status == 'drift' && steps.drift.outputs.drift_count > 5
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.txt', 'utf-8');
            const count = '${{ steps.drift.outputs.drift_count }}';

            // Check for existing open issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tech-debt,discovered',
              per_page: 100,
            });
            const hasIssue = existing.data.some(i =>
              i.title.includes('pricing drift')
            );
            if (hasIssue) {
              console.log('Pricing drift issue already open, skipping');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(model-registry): review + update pricing drift (${count} fields)`,
              labels: ['tech-debt', 'discovered'],
              body: [
                '**Found during:** weekly pricing drift check',
                `**Severity:** medium — stale pricing affects cost-aware routing`,
                '',
                '```',
                report.slice(0, 3000),
                '```',
                '',
                'Review and update `packages/nexus-agents/src/config/model-capabilities.ts`.',
              ].join('\n'),
            });
