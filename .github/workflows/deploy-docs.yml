# Deploy Documentation Website to GitHub Pages
#
# This workflow builds and deploys the Astro Starlight documentation website
# to GitHub Pages whenever changes are pushed to the main branch.
#
# Triggers:
# - Push to main branch (changes in website/ or docs/)
# - Manual trigger via workflow_dispatch
#
# (Source: Issue #327 - Documentation website)

name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CLAUDE.md'
      - 'CODING_STANDARDS.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

# Required permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment status
        run: |
          echo "Documentation deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "::notice title=Documentation Deployed::View at ${{ steps.deployment.outputs.page_url }}"
