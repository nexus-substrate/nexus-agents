name: Claude Code Assistant

on:
  # Automatic PR review on open/sync
  pull_request:
    types: [opened, synchronize, ready_for_review]
  # Interactive mode: respond to @claude mentions
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Respond to review submissions
  pull_request_review:
    types: [submitted]

# Only run one Claude response at a time per context
concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Automatic code review on PR open/sync
  auto-review:
    name: Claude Auto Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}

            Please review this pull request for the nexus-agents project with focus on:

            1. **Code Quality**
               - TypeScript best practices and type safety
               - Result<T,E> pattern usage for error handling
               - Function and file size limits (50 lines / 400 lines)

            2. **Security**
               - No secrets or credentials in code
               - Input validation at boundaries (Zod)
               - Path traversal prevention
               - No user-provided RegExp (ReDoS)

            3. **MCP Protocol Compliance**
               - Tool definitions with proper Zod schemas
               - Structured content responses
               - Error handling with isError flag

            4. **Testing**
               - Adequate test coverage for changes
               - Proper mocking patterns

            5. **Documentation**
               - Clear, technical documentation style
               - No marketing fluff or exaggeration

            Reference: CLAUDE.md and CODING_STANDARDS.md in the repository root.

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level summary feedback.
            Use `mcp__github_inline_comment__create_inline_comment` for specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"

      - name: Review summary
        if: always()
        run: |
          echo "### Claude Code Review Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review posted to PR #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY

  # Interactive mode: respond to @claude mentions in comments
  interactive:
    name: Claude Interactive Response
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review_comment' ||
       github.event_name == 'pull_request_review') &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Interactive Response
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          # Uses default @claude trigger phrase
          # Claude has full context of the PR/issue
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh issue comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(pnpm:*),Bash(git:*)"
