name: Claude Code Assistant

# DISABLED: Automatic PR review triggers removed to reduce API costs.
# CLI-based review workflow now enforced via verify-review.yml
# Use: pnpm review <PR#> to review PRs with local CLI tools.
#
# (Source: Issue #182, 5-0 consensus vote for CLI-based PR review)

on:
  # Manual trigger only - use when CLI review is unavailable
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
  # Interactive mode: respond to @claude mentions (kept for ad-hoc questions)
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Manual code review via workflow_dispatch
  manual-review:
    name: Claude Manual Review
    runs-on: ubuntu-latest
    # Separate concurrency group for manual review
    concurrency:
      group: claude-manual-review-${{ inputs.pr_number }}
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@64c7a0ef71df67b14cb4471f4d9c8565c61042bf # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Please fetch the PR details using: gh pr view ${{ inputs.pr_number }}

            Please review this pull request for the nexus-agents project with focus on:

            1. **Code Quality**
               - TypeScript best practices and type safety
               - Result<T,E> pattern usage for error handling
               - Function and file size limits (50 lines / 400 lines)

            2. **Security**
               - No secrets or credentials in code
               - Input validation at boundaries (Zod)
               - Path traversal prevention
               - No user-provided RegExp (ReDoS)

            3. **MCP Protocol Compliance**
               - Tool definitions with proper Zod schemas
               - Structured content responses
               - Error handling with isError flag

            4. **Testing**
               - Adequate test coverage for changes
               - Proper mocking patterns

            5. **Documentation**
               - Clear, technical documentation style
               - No marketing fluff or exaggeration

            Reference: CLAUDE.md and CODING_STANDARDS.md in the repository root.

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level summary feedback.
            Use `mcp__github_inline_comment__create_inline_comment` for specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"

      - name: Review summary
        if: always()
        run: |
          echo "### Claude Code Review Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review posted to PR #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY

  # Interactive mode: respond to @claude mentions in comments
  interactive:
    name: Claude Interactive Response
    runs-on: ubuntu-latest
    # Separate concurrency group for interactive responses
    concurrency:
      group: claude-interactive-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    # Only run for human comments, not bot comments
    if: |
      (github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review_comment' ||
       github.event_name == 'pull_request_review') &&
      !contains(github.actor, '[bot]') &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'claude[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Claude Interactive Response
        uses: anthropics/claude-code-action@64c7a0ef71df67b14cb4471f4d9c8565c61042bf # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          # Uses default @claude trigger phrase
          # Claude has full context of the PR/issue
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh issue comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(pnpm:*),Bash(git:*)"
