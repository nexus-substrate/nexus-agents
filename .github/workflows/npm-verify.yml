name: Verify NPM Install

# Catches packaging regressions BEFORE publish (#1841 was the canary): packs
# the local source as if for npm publish, installs the tarball in a clean
# Docker container, and runs a 6-phase smoke test (binary on PATH, --version,
# --help core commands, doctor, MCP stdio handshake with tools/list).
#
# Triggers:
#   - PRs touching package.json, src/, or the smoke-test infra
#   - Pushes to main
#   - Weekly cron (catches drift in the published version against current source)
#   - Manual dispatch

on:
  pull_request:
    paths:
      - 'packages/nexus-agents/package.json'
      - 'packages/nexus-agents/src/**'
      - 'scripts/verify-npm-install.sh'
      - 'scripts/check-install-scripts.ts'
      - 'scripts/install-script-allowlist.json'
      - 'Dockerfile.npm-verify'
      - '.github/workflows/npm-verify.yml'
  push:
    branches: [main]
  schedule:
    # Sundays 10:00 UTC — weekly canary against published @latest
    - cron: '0 10 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version or tarball path (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  verify-from-source:
    name: Verify pre-publish tarball
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Build + pack nexus-agents
        run: |
          pnpm install --frozen-lockfile
          # `nexus-memory` is a workspace dep of `nexus-agents` (#2766 Phase 5+).
          # Build it first so its dist/index.d.ts exists when tsup resolves
          # `import { ... } from 'nexus-memory'` in nexus-agents.
          pnpm --filter nexus-memory --fail-if-no-match build
          pnpm --filter nexus-agents --fail-if-no-match build
          cd packages/nexus-agents
          npm pack --pack-destination "${{ runner.temp }}"
          ls "${{ runner.temp }}"/*.tgz

      - name: Build verification image
        run: docker build -t nexus-verify -f Dockerfile.npm-verify .

      - name: Run smoke test against pre-publish tarball
        run: |
          TARBALL=$(ls "${{ runner.temp }}"/nexus-agents-*.tgz | head -1)
          # Keep the pre-publish tarball on the #5427 ignore-scripts path; the
          # five-mode matrix below verifies packages only after publication.
          docker run --rm -e NEXUS_VERIFY_INSTALL_MODE=ignore-scripts \
            -v "${TARBALL}:/pkg.tgz:ro" nexus-verify \
            bash /home/verifier/verify.sh /pkg.tgz

      # #5427. Measures what runs on a USER's machine at install time, so it
      # installs the packed tarball with npm rather than reading the workspace:
      # `pnpm.overrides` is repo-local and unpublished, and pnpm resolves
      # differently, so the workspace tree carries protobufjs@8.8.0 (no
      # postinstall) where a user gets protobufjs@7.6.6 (one postinstall). The
      # workspace would report three install scripts where a user runs four.
      #
      # No --omit=optional: optionalDependencies install by default, so they are
      # part of what a user actually executes. --ignore-scripts so the audit does
      # not run the scripts it is auditing.
      - name: Install-script ratchet against the packed tarball
        run: |
          TARBALL=$(ls "${{ runner.temp }}"/nexus-agents-*.tgz | head -1)
          npm install --prefix "${{ runner.temp }}/ratchet" --ignore-scripts "$TARBALL"
          pnpm exec tsx scripts/check-install-scripts.ts "${{ runner.temp }}/ratchet/node_modules"

  verify-published-latest:
    name: Verify published @latest (${{ matrix.install_mode }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        install_mode: [ignore-scripts, default, npm12, update, pnpm]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build verification image
        run: docker build -t nexus-verify -f Dockerfile.npm-verify .

      - name: Run smoke test
        run: |
          docker run --rm \
            -e NEXUS_VERIFY_INSTALL_MODE=${{ matrix.install_mode }} \
            nexus-verify bash /home/verifier/verify.sh \
            "${{ github.event.inputs.version || 'latest' }}"
