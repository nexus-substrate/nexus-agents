name: Release Stall Check

# Detects a stalled release: unconsumed changesets on `main` with no open
# "Version Packages" PR (#4500).
#
# Deliberately NOT a required PR check. Merging to `main` is the only path that
# has ever recovered this state, so a merge-blocking detector would deadlock its
# own remedy. Decided by a 3-voter panel on #4500, unanimous on that exclusion.
#
# Deliberately does NOT re-dispatch `release.yml`. Re-running the failed run has
# never recovered it, so an automatic retry against a flaking API would be a
# retry storm with no demonstrated payoff. This reports; a human decides.
#
# The issue — not this run's colour — is the output that matters. A red
# scheduled run would reproduce the exact "reported but nobody consumes it"
# failure the detector exists to fix.

on:
  schedule:
    # Every 6h. The failure is accumulative and reversible, so detection lag
    # costs little; historical stalls persisted for days.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: release-stall-check
  cancel-in-progress: false

jobs:
  check:
    name: Release Stall Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed only to file/update the tracking issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: ./.github/actions/setup-node

      - name: Look for an open Version Packages PR
        id: version-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --state open --json title \
            --jq '[.[] | select(.title | startswith("chore(release): version packages"))] | length')
          echo "has_open=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Assess release stall
        id: assess
        continue-on-error: true
        env:
          HAS_OPEN_VERSION_PR: ${{ steps.version-pr.outputs.has_open }}
        run: pnpm exec tsx scripts/check-release-stuck.ts

      - name: File or update the tracking issue
        if: steps.assess.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'ops(release): release pipeline is stalled — changesets on main with no version PR'
        run: |
          set -euo pipefail
          # The body was rendered by the assess step into release-stall-body.md.
          #
          # Dedupe WITHOUT the search index (#5729). `gh issue list --search`
          # reads GitHub's search API, which is eventually consistent: on
          # 2026-09-05 three consecutive runs read it as empty while an issue
          # with this exact title sat open, and filed #5599 and #5659 as
          # duplicates of #5553. Plain `gh issue list` reads the repository
          # issue connection and is strongly consistent.
          #
          # `--state all` because the body tells the reader it is safe to close
          # the report once the stall clears, and promises the detector reopens
          # it if the condition recurs. A `--state open` lookup cannot keep that
          # promise. Bounded at 100 issues, newest first: a report older than the
          # last 100 issues is missed and a fresh one filed, which is the
          # behaviour before this change, not a new gap.
          match=$(gh issue list --state all --limit 100 --json number,title,state \
            --jq "[.[] | select(.title == \"$TITLE\")] | first // empty")

          if [ -z "$match" ]; then
            echo "Filing a new stall issue"
            gh issue create --title "$TITLE" --body-file release-stall-body.md
            exit 0
          fi

          number=$(printf '%s' "$match" | jq -r '.number')
          state=$(printf '%s' "$match" | jq -r '.state')
          if [ "$state" = "CLOSED" ]; then
            echo "Reopening closed stall issue #$number"
            gh issue reopen "$number"
          fi
          echo "Updating stall issue #$number"
          gh issue edit "$number" --body-file release-stall-body.md

      - name: Fail the run when stalled
        if: steps.assess.outcome == 'failure'
        run: |
          echo "::error::Release pipeline is stalled — see the tracking issue."
          exit 1

      # A second, independent question on the same schedule (#4648): did main's
      # head get its push-triggered runs at all? On 2026-08-23 a merge produced
      # ZERO — no CI, no Release — while its neighbours got 7-9 each. The
      # release half of that is already covered by the assess step above, but
      # nothing noticed that main had never been CI'd: the commit is not marked
      # failing, it is unmarked, so main looks green.
      #
      # `always()` because the stall step above exits 1 and would otherwise skip
      # this. No tracking issue: unlike a stall, a dropped event is transient and
      # clears on the next push, so a red scheduled run is the proportionate
      # alarm and duplicating the issue-filing block would not earn its keep.
      - name: Check main's head has push-triggered runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm exec tsx scripts/check-missing-push-runs.ts
