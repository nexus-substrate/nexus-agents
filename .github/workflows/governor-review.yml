# Governor-path pr_review audit gate (#3831, Epic B — governance of the governor)
#
# WARN-FIRST. Asserts that a PR touching the GOVERNOR PATHS (the
# governance-of-the-governor entries in /CODEOWNERS) carries a recorded,
# SHA-BOUND, tamper-evident pr_review audit record (governance/pr-review-records.jsonl).
#
# SPLIT FAIL-MODE — encoded in the script's exit code, NOT continue-on-error, so
# the two paths stay distinct:
#   - chain/set INTEGRITY broken (tampered ledger) => script exits 1 => job FAILS
#     (fail-closed, condition 2). This is the path that must be able to block.
#   - matching sha-bound record ABSENT => script prints a ::warning:: and exits 0
#     => job SUCCEEDS but surfaces the annotation (warn-first, condition 2).
#
# This job is intentionally NOT added to branch protection as a required check in
# this stage, so even the (rare) integrity failure does not hard-block a human
# merge until the fail-closed FLIP follow-on. Flipping absence to a block and
# making this required are tracked follow-ons.
#
# The `paths:` filter restricts the trigger to the governor path set. It is kept
# in lockstep with the governance-of-the-governor section of /CODEOWNERS (the
# single source the gate script itself parses); if those CODEOWNERS entries
# change, update this filter to match.
#
# A third job (#6174) asks GitHub's OWN parser whether /CODEOWNERS is valid at
# the sha under review. It lives here rather than in a sibling workflow so the
# gate is itself governor-owned: a CODEOWNERS validity check an agent could
# quietly delete without ratification is not a gate.
#
# The ratification jobs also read the committed VOTE ledger
# (governance/vote-records.jsonl, #5130 step 2 / #5779) and REQUIRE it (#5131,
# since 2026-09-14): a panel record bound to `{pr, headSha}`, approved at
# supermajority or unanimous, under errorPolicy absolute_quorum, on a whole
# panel, in a ledger that is append-only against the base. Every other ledger
# verdict — including `no-record` over the empty ledger and `unmeasured` when
# the ledger or the PR number cannot be read — is a ::error:: and exit 1. The
# label/approval verdict is still required alongside it; both must hold. The
# warn-first posture above applies to the pr_review AUDIT gate only.

name: Governor Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'packages/nexus-agents/src/audit/**'
      - 'packages/nexus-agents/src/governance/**'
      - 'scripts/inject-governance.ts'
      - 'governance/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'
      - 'docs/CODEOWNERS'
      - '.github/workflows/governor-review.yml'
      - 'scripts/check-governor-review.ts'
      - 'scripts/check-governor-ratification.ts'
      - 'scripts/governor-ledger-evidence.ts'
      - 'scripts/check-codeowners-errors.ts'
      - 'scripts/governance-stamp-exemption.ts'
      - 'scripts/governor-section.ts'
      - '.rules/**'
      - 'packages/nexus-agents/src/consensus/decision/**'
      - 'packages/nexus-agents/src/cli/voter-roles.ts'
  push:
    branches: [main]
    paths:
      - 'packages/nexus-agents/src/audit/**'
      - 'packages/nexus-agents/src/governance/**'
      - 'scripts/inject-governance.ts'
      - 'governance/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'
      - 'docs/CODEOWNERS'
      - '.github/workflows/governor-review.yml'
      - 'scripts/check-governor-review.ts'
      - 'scripts/check-governor-ratification.ts'
      - 'scripts/governor-ledger-evidence.ts'
      - 'scripts/check-codeowners-errors.ts'
      - 'scripts/governance-stamp-exemption.ts'
      - 'scripts/governor-section.ts'
      - '.rules/**'
      - 'packages/nexus-agents/src/consensus/decision/**'
      - 'packages/nexus-agents/src/cli/voter-roles.ts'

permissions:
  contents: read

jobs:
  governor-review:
    name: Governor-path pr_review audit gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-node

      - name: Compute changed files (base..head)
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}" || true)
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::could not compute merge-base of origin/${BASE_REF} and ${HEAD_SHA}"
            exit 1
          fi
          FILES=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          {
            echo "base=${BASE_SHA}"
            echo 'files<<FILES_EOF'
            echo "${FILES}"
            echo 'FILES_EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Run governor-review gate (warn-first; integrity fail-closed)
        env:
          # The gate needs BOTH base and head sha: sha-binding (condition 1) AND
          # the Option-C diff-binding recompute `git diff base..head` (#3831).
          # Without PR_BASE_SHA, resolvePrContext.baseSha is undefined and the
          # diff-binding never runs, so the gate cannot match any record (#4227).
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ steps.changed.outputs.base }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        # No continue-on-error: the script encodes warn (exit 0) vs fail-closed
        # integrity break (exit 1) in its exit code. A non-zero exit here is a
        # tampered ledger and SHOULD surface as a job failure.
        run: npx tsx scripts/check-governor-review.ts

  # ---------------------------------------------------------------------------
  # RATIFICATION gate (#4635).
  #
  # Distinct from the audit gate above, which asks whether the change was
  # REVIEWED. This asks whether the owner RATIFIED it — the requirement
  # CODEOWNERS and CLAUDE.md both state and nothing enforced until now.
  # ---------------------------------------------------------------------------
  governor-ratification:
    name: Governor-path ratification gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-node

      - name: Collect ratification evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # pipefail: a failed `gh api` below must fail the step, not yield an
          # empty APPROVALS/LABELS the gate reads as "nobody approved" (#5685).
          # LABEL_ACTOR keeps its tolerant `|| echo ''` — empty is its documented
          # indeterminate, and the trailing `||` still catches a failure there.
          set -o pipefail
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}" || true)
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::could not compute merge-base of origin/${BASE_REF} and ${HEAD_SHA}"
            exit 1
          fi
          FILES=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          APPROVALS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --paginate --jq '.[] | select(.state == "APPROVED") | .user.login' | sort -u | tr '\n' ' ')
          LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.labels[].name' | tr '\n' ',')
          # #4690: WHO applied the ratification label, not merely that it is
          # present. Most recent `labeled` event wins (a label can be removed
          # and re-applied). Empty when the timeline has no such event — the
          # gate treats that as indeterminate, never as ratified.
          LABEL_ACTOR=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
            --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "owner-ratified")] | last | .actor.login // empty' \
            2>/dev/null | tail -n1 || echo '')
          # WHEN the label was applied, from the same event. A label is not
          # dismissed when new commits arrive, but an approval IS
          # (`dismiss_stale_reviews` on main), so without this the label route
          # was the laxer of the two ratification paths.
          LABEL_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
            --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "owner-ratified")] | last | .created_at // empty' \
            2>/dev/null | tail -n1 || echo '')
          # SERVER-assigned, not the commit's own date. Author/committer dates
          # live in the commit object and are set by the client, so
          # `GIT_COMMITTER_DATE` backdates them freely — a commit stamped before
          # the label would read as "the label is newer, therefore current".
          # The earliest workflow run for the sha is when GitHub first saw the
          # push, and the pusher cannot forge it.
          HEAD_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq '[.workflow_runs[].created_at] | sort | first // empty' 2>/dev/null || echo '')
          # #5130 step 2: the committed vote ledger binds a ratification to
          # `{pr, headSha}`. The caller appends the record in a ledger-only
          # commit ON TOP of the head the panel saw, so the gate accepts
          # `head^` as bound only when `head` touches exactly the ledger file.
          # Both values are computed from the checkout (fetch-depth: 0); a
          # root commit has no parent and yields empty strings, which the gate
          # reads as "only head is accepted".
          HEAD_PARENT_SHA=$(git rev-parse --verify --quiet "${HEAD_SHA}^" || echo '')
          if [ -n "${HEAD_PARENT_SHA}" ]; then
            HEAD_COMMIT_FILES=$(git diff --name-only "${HEAD_PARENT_SHA}" "${HEAD_SHA}")
          else
            HEAD_COMMIT_FILES=""
          fi
          # #6213: the ledger AS OF THE MERGE-BASE, so the gate can require the
          # head ledger to be the base plus appended lines (a PR that deletes
          # or rewrites a recorded line is `ledger-rewritten`). Written to a
          # file, not an output: a 100-record ledger exceeds the single-string
          # env limit. Absent at base → an EMPTY file (a measured, empty base);
          # present but unreadable → `git show` fails this step under -e.
          LEDGER_BASE_SHA="${BASE_SHA}"
          BASE_LEDGER_PATH="${RUNNER_TEMP}/base-vote-records.jsonl"
          # The commit must exist: an unknown sha would otherwise read as
          # "no ledger at base" and the append-only check would pass over
          # an empty base. Fails the step under -e.
          git cat-file -e "${LEDGER_BASE_SHA}^{commit}"
          if git cat-file -e "${LEDGER_BASE_SHA}:governance/vote-records.jsonl" 2>/dev/null; then
            git show "${LEDGER_BASE_SHA}:governance/vote-records.jsonl" > "${BASE_LEDGER_PATH}"
          else
            : > "${BASE_LEDGER_PATH}"
          fi
          {
            echo 'files<<FILES_EOF'
            echo "${FILES}"
            echo 'FILES_EOF'
            echo "approvals=${APPROVALS}"
            echo "labels=${LABELS}"
            echo "label_actor=${LABEL_ACTOR}"
            echo "label_time=${LABEL_TIME}"
            echo "head_time=${HEAD_TIME}"
            echo "base=${BASE_SHA}"
            echo "head_parent=${HEAD_PARENT_SHA}"
            echo 'head_commit_files<<FILES_EOF'
            echo "${HEAD_COMMIT_FILES}"
            echo 'FILES_EOF'
            echo "base_ledger_path=${BASE_LEDGER_PATH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run ratification gate
        env:
          CHANGED_FILES: ${{ steps.evidence.outputs.files }}
          APPROVALS: ${{ steps.evidence.outputs.approvals }}
          PR_LABELS: ${{ steps.evidence.outputs.labels }}
          RATIFICATION_LABEL_ACTOR: ${{ steps.evidence.outputs.label_actor }}
          RATIFICATION_LABEL_TIME: ${{ steps.evidence.outputs.label_time }}
          HEAD_OBSERVED_AT: ${{ steps.evidence.outputs.head_time }}
          # #5130 step 2 / #5779: the committed-ledger evidence line. The gate
          # looks up `governance/vote-records.jsonl` for a record with
          # `ratifiesPr.pr == PR_NUMBER` bound to PR_HEAD_SHA (or its parent
          # for a ledger-only tip). #5131: that verdict is PART OF the exit
          # code — only `ratified` passes, alongside the label/approval
          # verdict; `no-record` (the empty ledger included), every other
          # kind, and `unmeasured` are ::error:: and exit 1. A governor-path
          # PR is red until the orchestrator appends its ratifying record.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_PARENT_SHA: ${{ steps.evidence.outputs.head_parent }}
          HEAD_COMMIT_FILES: ${{ steps.evidence.outputs.head_commit_files }}
          # #6213: the ledger at the merge-base; the gate requires the head
          # ledger to be this plus appended lines (`ledger-rewritten` otherwise).
          RATIFICATION_BASE_LEDGER_PATH: ${{ steps.evidence.outputs.base_ledger_path }}
          # #5944: lets the gate read CLAUDE.md / AGENTS.md as of base and
          # exempt a diff whose only change is inside a generated span. Absent
          # or malformed, the exemption is simply never granted — fail-closed.
          #
          # #6029: this read `steps.changed.outputs.base`, but `id: changed` is
          # in the SIBLING `governor-review` job and step outputs are JOB-SCOPED,
          # so it resolved to the empty string on every run and the exemption
          # never fired. The merge-base is already computed in THIS job's
          # `evidence` step; it simply was not emitted.
          #
          # The merge-base, not `pull_request.base.sha`: the base-branch TIP
          # would fold in whatever else landed on main since the branch
          # diverged, so an unrelated PR touching a governed file could revoke
          # this PR's exemption.
          PR_BASE_SHA: ${{ steps.evidence.outputs.base }}
        run: npx tsx scripts/check-governor-ratification.ts

  # ---------------------------------------------------------------------------
  # BACKSTOP: the same question, asked after the merge.
  #
  # `gh pr merge --admin` bypasses required status checks, so the pre-merge job
  # above cannot actually stop the merge it is meant to stop — which is exactly
  # how a48aa881d8 landed. This job runs on push to main and turns an unratified
  # governor-path merge into a red X on main that nobody can bypass, because by
  # then there is nothing left to bypass. Since #5131 "unratified" includes a
  # merge whose landed ledger carries no ratifying record for the PR.
  # ---------------------------------------------------------------------------
  governor-ratification-backstop:
    name: Governor-path ratification backstop (post-merge)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Collect ratification evidence for the merged PR
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          # #6213: the tip of main BEFORE this push. A multi-commit push could
          # rewrite the ledger in one commit and append in the next, and
          # `SHA~1` would compare only the last hop.
          BEFORE: ${{ github.event.before }}
        run: |
          # See the pre-merge job: a failed `gh api` must fail the step rather
          # than vote "no approvals" (#5685).
          set -o pipefail
          FILES=$(git diff --name-only "${SHA}~1" "${SHA}")
          # #6029: the same before/after pair FILES is derived from, so the
          # exemption reads exactly the commit that landed. Without this the
          # backstop had NO base at all, and fixing only the pre-merge job would
          # have made a stamp-only PR pass pre-merge then fail here — a
          # self-inflicted red main on the very PRs the exemption waves through.
          BASE_SHA=$(git rev-parse "${SHA}~1")
          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '.[0].number // empty')
          if [ -z "${PR_NUMBER}" ]; then
            # A direct push to main touching governor paths is never ratified
            # by construction — there is no PR to carry the evidence.
            APPROVALS=""
            LABELS=""
            LABEL_ACTOR=""
            LABEL_TIME=""
            HEAD_TIME=""
          else
            APPROVALS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --paginate --jq '.[] | select(.state == "APPROVED") | .user.login' | sort -u | tr '\n' ' ')
            LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.labels[].name' | tr '\n' ',')
            # Must mirror the pre-merge job: the gate step below consumes
            # `label_actor`, and without a producer here every label-ratified
            # governor PR lands as `indeterminate` and reddens main.
            LABEL_ACTOR=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --jq '[.[] | select(.event == "labeled" and .label.name == "owner-ratified")] | last | .actor.login // empty' \
              2>/dev/null | tail -n1 || echo '')
            LABEL_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --jq '[.[] | select(.event == "labeled" and .label.name == "owner-ratified")] | last | .created_at // empty' \
              2>/dev/null | tail -n1 || echo '')
            # The PR's OWN head, not ${SHA}. ${SHA} is the squash commit, created
            # after the label by construction, so comparing against it would
            # report every label-ratified PR as stale and redden main for the
            # benign population this gate exists to let through.
            PR_HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.sha // empty')
            if [ -n "${PR_HEAD_SHA}" ]; then
              # See the pre-merge job: server-assigned run time, never the
              # client-settable commit date.
              HEAD_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PR_HEAD_SHA}&per_page=100" \
                --jq '[.workflow_runs[].created_at] | sort | first // empty' 2>/dev/null || echo '')
            else
              HEAD_TIME=""
            fi
          fi
          # #6213: the ledger AS OF THE TIP BEFORE THIS PUSH (`github.event.before`),
          # so the append-only check spans the whole push, not the last commit.
          # A null `before` (the first push of a branch) has no such tip; then
          # `SHA~1` is the only base there is, and the annotation says so.
          # Written to a file, not an output: a 100-record ledger exceeds the
          # single-string env limit. Absent at base → an EMPTY file (a measured,
          # empty base); present but unreadable → `git show` fails this step under -e.
          if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            LEDGER_BASE_SHA="${BEFORE}"
          else
            LEDGER_BASE_SHA="${BASE_SHA}"
            echo "::notice::[governor-ledger] github.event.before is the null sha (first push of this ref): the append-only base is ${SHA}~1, the last commit only"
          fi
          BASE_LEDGER_PATH="${RUNNER_TEMP}/base-vote-records.jsonl"
          # The commit must exist: an unknown sha would otherwise read as
          # "no ledger at base" and the append-only check would pass over
          # an empty base. Fails the step under -e.
          git cat-file -e "${LEDGER_BASE_SHA}^{commit}"
          if git cat-file -e "${LEDGER_BASE_SHA}:governance/vote-records.jsonl" 2>/dev/null; then
            git show "${LEDGER_BASE_SHA}:governance/vote-records.jsonl" > "${BASE_LEDGER_PATH}"
          else
            : > "${BASE_LEDGER_PATH}"
          fi
          {
            echo 'files<<FILES_EOF'
            echo "${FILES}"
            echo 'FILES_EOF'
            echo "approvals=${APPROVALS}"
            echo "labels=${LABELS}"
            echo "label_actor=${LABEL_ACTOR}"
            echo "label_time=${LABEL_TIME}"
            echo "head_time=${HEAD_TIME}"
            echo "base=${BASE_SHA}"
            echo "pr_number=${PR_NUMBER}"
            echo "base_ledger_path=${BASE_LEDGER_PATH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run ratification gate against what actually landed
        env:
          CHANGED_FILES: ${{ steps.evidence.outputs.files }}
          APPROVALS: ${{ steps.evidence.outputs.approvals }}
          PR_LABELS: ${{ steps.evidence.outputs.labels }}
          RATIFICATION_LABEL_ACTOR: ${{ steps.evidence.outputs.label_actor }}
          RATIFICATION_LABEL_TIME: ${{ steps.evidence.outputs.label_time }}
          HEAD_OBSERVED_AT: ${{ steps.evidence.outputs.head_time }}
          # #5130 step 2: the ledger evidence line, keyed on the PR NUMBER
          # ONLY. ${SHA} is the squash commit, which no panel saw, so the sha
          # binding is not checked here and the annotation says so. No
          # PR_HEAD_SHA on purpose. A direct push has no PR number, and the
          # gate reports the ledger as unmeasured rather than as "no record".
          # #5131: the same flip as the pre-merge job — a merged governor-path
          # PR with no bound, approved, whole, supermajority, absolute_quorum
          # record in the landed ledger is exit 1, and so is `unmeasured` (the
          # direct-push case). A red backstop is the durable signal: the
          # pre-merge job can be admin-bypassed, this cannot.
          PR_NUMBER: ${{ steps.evidence.outputs.pr_number }}
          # #6213: the ledger at `github.event.before` (`${SHA}~1` only when
          # `before` is the null sha); what landed must be that plus appended
          # lines, the same rule the pre-merge job applies.
          RATIFICATION_BASE_LEDGER_PATH: ${{ steps.evidence.outputs.base_ledger_path }}
          # #6029: the backstop set NO base at all, so its exemption was
          # unreachable by a second mechanism. Both jobs must grant the same
          # exemption or a stamp-only PR turns main red after merging green.
          PR_BASE_SHA: ${{ steps.evidence.outputs.base }}
        run: npx tsx scripts/check-governor-ratification.ts

  # ---------------------------------------------------------------------------
  # CODEOWNERS parses under GitHub's own parser (#6174).
  #
  # Both gates above parse /CODEOWNERS with OUR parser (`scripts/governor-section.ts`).
  # Nothing verified that GitHub reads the same file the same way, and a pattern
  # GitHub rejects is a governor entry that exists for our gates and not for
  # GitHub's review requests. `GET /repos/{owner}/{repo}/codeowners/errors?ref=`
  # returns every line GitHub could not parse (line, column, kind, suggestion).
  # The script fails on a non-empty `errors` array AND on any payload without an
  # `errors` array (a 404 body has none) — an unmeasured file is not a clean one.
  #
  # Runs on both events. The workflow-level `paths:` already names CODEOWNERS,
  # so every PR that edits it and every push to main that lands such an edit
  # reaches this job; the other governor paths reach it too, which is a cheap
  # superset (one API call). Match SEMANTICS are not verified — see the script
  # header and #6174 for why that half is not measurable here.
  # ---------------------------------------------------------------------------
  codeowners-errors:
    name: CODEOWNERS parses under GitHub's parser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR head for pull_request; the pushed sha for push (the default).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-node

      - name: Ask GitHub to parse CODEOWNERS at the sha under review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GITHUB_REPOSITORY and GITHUB_API_URL come from the runner environment.
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        # The script's exit code is the verdict: 0 only for `{ errors: [] }`.
        run: pnpm exec tsx scripts/check-codeowners-errors.ts --ref "${REF}"
