# Governor-path pr_review audit gate (#3831, Epic B — governance of the governor)
#
# WARN-FIRST. Asserts that a PR touching the GOVERNOR PATHS (the
# governance-of-the-governor entries in /CODEOWNERS) carries a recorded,
# SHA-BOUND, tamper-evident pr_review audit record (governance/pr-review-records.jsonl).
#
# SPLIT FAIL-MODE — encoded in the script's exit code, NOT continue-on-error, so
# the two paths stay distinct:
#   - chain/set INTEGRITY broken (tampered ledger) => script exits 1 => job FAILS
#     (fail-closed, condition 2). This is the path that must be able to block.
#   - matching sha-bound record ABSENT => script prints a ::warning:: and exits 0
#     => job SUCCEEDS but surfaces the annotation (warn-first, condition 2).
#
# The pr_review AUDIT job is intentionally NOT a branch-protection required
# check in this stage, so even the (rare) integrity failure does not hard-block
# a human merge until the fail-closed FLIP follow-on. The RATIFICATION job
# below is the one branch protection is meant to require (#4802) — see the
# next paragraph for what makes that possible.
#
# NO `paths:` FILTER (#4802 part 1). Branch protection can only require a
# status context that appears on EVERY pull request; a path-filtered job never
# reports on a PR outside its paths, so as a required context it would sit
# `expected` forever on an ordinary PR. The workflow therefore runs on every
# pull_request and every push to main. The governor-path verdict is computed
# INSIDE the run from the one parse of /CODEOWNERS (`scripts/governor-section.ts`):
#   - `governor-ratification` runs on every PR. It computes the changed-file
#     list and runs the detector BEFORE any GitHub API call. The required-jobs
#     check then measures CI wiring on every PR; an unreadable protection API
#     is reported as unmeasured without overriding measured tree results.
#     On an ordinary PR the evidence and gate steps are skipped and a final
#     step reports `not-applicable` → exit 0 (~60 s, of which ~35 s is the full-history
#     checkout and ~5 s the injector spawn, #6250), so an API outage cannot
#     block a PR the gate has nothing to say about (#6260). On a governor PR
#     it fails closed without a bound record. Its job name —
#     `Governor-path ratification gate` — is the context branch protection
#     requires; renaming it un-requires the gate.
#   - `governor-review` and `codeowners-errors` do NOT run on an ordinary PR.
#     They read the `governor_touched` output the ratification jobs compute
#     (`scripts/governor-paths-touched.ts`, the same parser and matcher the
#     gates use) and are skipped when it is not `true`. Per-job reasons sit on
#     the jobs. A skipped job is a legitimate state for a job that is not a
#     required context; the ratification gate is never skipped on a PR.
# The `paths:` blocks this replaces were a hand-maintained second copy of the
# governor set, kept in lockstep by a test (#5997). Nothing is copied now.
#
# A third job (#6174) asks GitHub's OWN parser whether /CODEOWNERS is valid at
# the sha under review. It lives here rather than in a sibling workflow so the
# gate is itself governor-owned: a CODEOWNERS validity check an agent could
# quietly delete without ratification is not a gate.
#
# The ratification jobs also read the committed VOTE ledger
# (governance/vote-records.jsonl, #5130 step 2 / #5779) and REQUIRE it (#5131,
# since 2026-09-14): a panel record bound to `{pr, headSha}`, approved at
# supermajority or unanimous, under errorPolicy absolute_quorum, on a whole
# panel, in a ledger that is append-only against the base. Every other ledger
# verdict — including `no-record` over the empty ledger and `unmeasured` when
# the ledger or the PR number cannot be read — is a ::error:: and exit 1. The
# label/approval verdict is still required alongside it; both must hold. The
# warn-first posture above applies to the pr_review AUDIT gate only.

name: Governor Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Gated on the ratification job's detector output rather than a `paths:`
  # filter (#4802 part 1). Why gated and not always-on: this job is warn-first
  # and not a required context, and on an ordinary PR its full-history checkout
  # (~35 s, measured) plus install (~13 s) buys a verdict of "no governor paths
  # touched — nothing to assert" that the ratification job already computed.
  # Cost of the gating: the job now starts after the ratification job (~60 s)
  # on a governor PR instead of in parallel with it.
  #
  # `!cancelled()` rather than the implicit `success()`: the ratification job
  # FAILS on an unratified governor PR, and this job must still run then —
  # it reports the other half of the evidence. A failed job's outputs are
  # still delivered to a dependent that runs under `!cancelled()`.
  governor-review:
    name: Governor-path pr_review audit gate
    needs: governor-ratification
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.governor-ratification.outputs.governor_touched == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # #6377: the same two-checkout layout as the ratification gate — the PR
      # head is DATA under `head`, this job's scripts, toolchain and policy
      # come from the base ref under `gate`. No `./` action from the head.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout base gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: gate
          fetch-depth: 1

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          package_json_file: gate/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: gate/pnpm-lock.yaml

      - name: Install gate dependencies
        run: pnpm install --frozen-lockfile
        working-directory: gate

      - name: Compute changed files (base..head)
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA=$(git -C head merge-base "origin/${BASE_REF}" "${HEAD_SHA}" || true)
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::could not compute merge-base of origin/${BASE_REF} and ${HEAD_SHA}"
            exit 1
          fi
          FILES=$(git -C head diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          {
            echo "base=${BASE_SHA}"
            echo 'files<<FILES_EOF'
            echo "${FILES}"
            echo 'FILES_EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Run governor-review gate (warn-first; integrity fail-closed)
        working-directory: gate
        env:
          # The gate needs BOTH base and head sha: sha-binding (condition 1) AND
          # the Option-C diff-binding recompute `git diff base..head` (#3831).
          # Without PR_BASE_SHA, resolvePrContext.baseSha is undefined and the
          # diff-binding never runs, so the gate cannot match any record (#4227).
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ steps.changed.outputs.base }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        # No continue-on-error: the script encodes warn (exit 0) vs fail-closed
        # integrity break (exit 1) in its exit code. A non-zero exit here is a
        # tampered ledger and SHOULD surface as a job failure.
        run: pnpm exec tsx scripts/governor-gate.ts pr-review-audit --target "${GITHUB_WORKSPACE}/head"

  # ---------------------------------------------------------------------------
  # RATIFICATION gate (#4635).
  #
  # Distinct from the audit gate above, which asks whether the change was
  # REVIEWED. This asks whether the owner RATIFIED it — the requirement
  # CODEOWNERS and CLAUDE.md both state and nothing enforced until now.
  #
  # Runs on EVERY pull request (#4802 part 1): this job's name is the status
  # context branch protection requires, and a required context must be
  # reported on every PR or the PR can never merge. On a PR that touches no
  # governor path the job reports `not-applicable` and exits 0. Do not add a
  # `paths:` filter, a `needs:`, or a narrower `if:` here.
  #
  # TWO-CHECKOUT TRUST BOUNDARY (#6369, option D): the gate judges by main's
  # rules: base-ref scripts, base-ref toolchain, head as data; a gate change
  # goes live after it merges. This job references only the stable dispatcher
  # governor-gate.ts; per-check additions/renames are wired inside it on main.
  # Ledger evolution is reader-first, writer-second: main must accept every
  # format the head carries. This change makes no reader-incompatible ledger
  # change, and an unreadable format has no bypass.
  # ROLLOUT: merge after #6373 supplies the dispatcher on main. Sibling
  # head/gate checkouts leave workspace-root configuration absent.
  # package_json_file selects gate/package.json. Explicit node-version/cache
  # skip automatic version-file/package.json discovery; no registry-url means
  # no auth-file setup. cache-dependency-path hashes only gate's lockfile.
  # Residual: pnpm setup still probes workspace-root .npmrc; setup-node runs
  # pnpm store discovery there. Neither lookup descends into sibling head.
  # Verified inputs and config reads at the exact action pins:
  # https://github.com/pnpm/action-setup/blob/b307475762933b98ed359c036b0e51f26b63b74b/action.yml
  # https://github.com/pnpm/action-setup/blob/b307475762933b98ed359c036b0e51f26b63b74b/src/install-pnpm/run.ts
  # https://github.com/actions/setup-node/blob/820762786026740c76f36085b0efc47a31fe5020/action.yml
  # https://github.com/actions/setup-node/blob/820762786026740c76f36085b0efc47a31fe5020/src/main.ts
  # https://github.com/actions/setup-node/blob/820762786026740c76f36085b0efc47a31fe5020/src/cache-utils.ts
  # https://github.com/actions/setup-node/blob/820762786026740c76f36085b0efc47a31fe5020/src/cache-restore.ts
  # Re-verified for v7.0.0 (#6479): against v6.2.0 (6044e13) these four files
  # change only ESM import extensions, two new cache outputs, an await, and the
  # problem-matcher path (inside the action dir). None of the reads above moves.
  #
  # STEP ORDER (#6260 panel, scope steward): the detector runs BEFORE any
  # GitHub API call, and the evidence and gate steps are gated on its output.
  # The first cut collected evidence first, so once this context is required a
  # transient `gh api` failure would have blocked an ORDINARY PR — one that
  # touches nothing this gate governs. An ordinary PR performs one `git diff`,
  # one CODEOWNERS parse, and the required-jobs check (#6343); ratification
  # evidence is fetched only when there is a governor path to ratify. The
  # required-jobs check exits 2 when protection is unreadable and local checks
  # pass; the step warns. Missing local producers still fail with exit 1.
  # The final step names the not-touched case
  # so the job's success is a stated verdict, never a job with nothing left to run.
  # ---------------------------------------------------------------------------
  governor-ratification:
    name: Governor-path ratification gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Read by `governor-review` and `codeowners-errors` in place of the
      # `paths:` filter. `true` / `false`; empty when the detector step did
      # not run to completion, which the dependents treat as not-true.
      governor_touched: ${{ steps.touched.outputs.governor_touched }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout base gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: gate
          fetch-depth: 1

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          package_json_file: gate/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: gate/pnpm-lock.yaml

      - name: Install gate dependencies
        run: pnpm install --frozen-lockfile
        working-directory: gate

      - name: Compute changed files (base..head)
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA=$(git -C head merge-base "origin/${BASE_REF}" "${HEAD_SHA}" || true)
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::could not compute merge-base of origin/${BASE_REF} and ${HEAD_SHA}"
            exit 1
          fi
          FILES=$(git -C head diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          {
            echo "base=${BASE_SHA}"
            echo 'files<<FILES_EOF'
            echo "${FILES}"
            echo 'FILES_EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Which governor paths does this PR touch?
        id: touched
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        # The script prints exactly `true` or `false` to stdout, or nothing and
        # exit 1 when the set could not be measured (no file list, unparseable
        # governor section). The `run:` body — not the script — writes the
        # output line, so the #4698 wiring test can see the producer. Under the
        # runner's `bash -e`, a failing substitution fails the assignment and
        # the step: a failed detector fails this job and leaves the dependents'
        # condition empty, never `false`. Same parser and matcher as the gate
        # below; this is the `paths:` filter's replacement, not a second copy
        # of the set (#4802 part 1).
        working-directory: gate
        run: |
          TOUCHED=$(pnpm exec tsx scripts/governor-gate.ts touched --target "${GITHUB_WORKSPACE}/head")
          echo "governor_touched=${TOUCHED}" >> "${GITHUB_OUTPUT}"

      - name: Check governor-owned required jobs (#6343)
        id: required-jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: gate
        run: |
          status=0
          pnpm exec tsx scripts/governor-gate.ts required-jobs --target "${GITHUB_WORKSPACE}/head" || status=$?
          if [ "$status" = 2 ]; then
            echo "::warning::required jobs unmeasured"
          else
            exit "$status"
          fi

      - name: Collect ratification evidence
        id: evidence
        # Gated on the detector: an ordinary PR never fetches ratification
        # evidence, so an evidence API outage cannot block an ordinary PR.
        if: steps.touched.outputs.governor_touched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ steps.changed.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # #6301 item 4: the heads this PR had before this one. `before` is
          # the head a `synchronize` event replaced (empty on every other
          # event type — `labeled` included, and the label always follows the
          # final push, so `before` alone would never reach the run that
          # counts); the PR's own force-push timeline supplies the rest.
          BEFORE: ${{ github.event.before }}
        working-directory: gate
        run: |
          # pipefail: a failed `gh api` below must fail the step, not yield an
          # empty APPROVALS/LABELS the gate reads as "nobody approved" (#5685).
          # LABEL_ACTOR keeps its tolerant `|| echo ''` — empty is its documented
          # indeterminate, and the trailing `||` still catches a failure there.
          # LABELS joins inside `--jq` so it has no pipe to mask (#5731);
          # APPROVALS keeps the streaming filter + shell join because gh applies
          # `--jq` PER PAGE under `--paginate`, and `--slurp` is unverified here.
          set -o pipefail
          APPROVALS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --paginate --jq '.[] | select(.state == "APPROVED") | .user.login' | sort -u | tr '\n' ' ')
          LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.labels[].name] | join(",")')
          # #4690: WHO applied the ratification label, not merely that it is
          # present. Most recent `labeled` event wins (a label can be removed
          # and re-applied). Empty when the timeline has no such event — the
          # gate treats that as indeterminate, never as ratified.
          LABEL_ACTOR=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
            --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "owner-ratified")] | last | .actor.login // empty' \
            2>/dev/null | tail -n1 || echo '')
          # WHEN the label was applied, from the same event. A label is not
          # dismissed when new commits arrive, but an approval IS
          # (`dismiss_stale_reviews` on main), so without this the label route
          # was the laxer of the two ratification paths.
          LABEL_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
            --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "owner-ratified")] | last | .created_at // empty' \
            2>/dev/null | tail -n1 || echo '')
          # SERVER-assigned, not the commit's own date. Author/committer dates
          # live in the commit object and are set by the client, so
          # `GIT_COMMITTER_DATE` backdates them freely — a commit stamped before
          # the label would read as "the label is newer, therefore current".
          # The earliest workflow run for the sha is when GitHub first saw the
          # push, and the pusher cannot forge it.
          HEAD_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq '[.workflow_runs[].created_at] | sort | first // empty' 2>/dev/null || echo '')
          # #6301 item 4: the heads this PR had, for the moved-head rule's
          # `prior-head` relation. SERVER-side, like HEAD_TIME, and keyed on
          # the PR NUMBER: the PR's own `HeadRefForcePushedEvent` timeline
          # items carry the replaced (`beforeCommit`) and replacing
          # (`afterCommit`) tips of every force-push to THIS PR's head ref.
          # Only a force-push orphans a head (a plain push keeps it an
          # ancestor, which condition 1 accepts on its own), so the set is
          # complete by construction. NOT the workflow-run list keyed on the
          # branch name: a fork PR named like a base-repo branch inherited
          # that branch's heads (the #6301 panel 1 contrarian's hole), and
          # `workflow_runs[].pull_requests` is emptied once a PR merges
          # (measured on #6252: every run `[]`), which would have reddened
          # the backstop on every rebased governor PR. Measured on #6252
          # after merge: the set lists its rebased-away ratified head
          # `fca64e9ea8`. `github.event.before` is folded in: exact, free,
          # and this PR's own payload. A failed query fails the step under
          # pipefail rather than yielding an empty set the gate would read
          # as "no rebase was ever ratified"; a null `beforeCommit` yields
          # nothing, which fails closed at the gate.
          PRIOR_HEADS=$(gh api graphql --paginate \
            -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" -F pr="${PR_NUMBER}" \
            -f query='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
                timelineItems(first: 100, after: $endCursor, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) {
                  pageInfo { hasNextPage endCursor }
                  nodes { ... on HeadRefForcePushedEvent { beforeCommit { oid } afterCommit { oid } } } } } } }' \
            --jq '.data.repository.pullRequest.timelineItems.nodes[] | (.beforeCommit.oid // empty), (.afterCommit.oid // empty)')
          PRIOR_HEADS=$(printf '%s\n%s\n' "${PRIOR_HEADS}" "${BEFORE}" | grep -E '^[0-9a-f]{40}$' | grep -v "^${HEAD_SHA}$" | sort -u || true)
          # #5130 step 2: the committed vote ledger binds a ratification to
          # `{pr, headSha}`. The caller appends the record in a ledger-only
          # commit ON TOP of the head the panel saw, so the gate accepts
          # `head^` as bound only when `head` touches exactly the ledger file.
          # Both values are computed from the checkout (fetch-depth: 0); a
          # root commit has no parent and yields empty strings, which the gate
          # reads as "only head is accepted".
          HEAD_PARENT_SHA=$(git -C "${GITHUB_WORKSPACE}/head" rev-parse --verify --quiet "${HEAD_SHA}^" || echo '')
          if [ -n "${HEAD_PARENT_SHA}" ]; then
            HEAD_COMMIT_FILES=$(git -C "${GITHUB_WORKSPACE}/head" diff --name-only "${HEAD_PARENT_SHA}" "${HEAD_SHA}")
          else
            HEAD_COMMIT_FILES=""
          fi
          # #6213: the ledger AS OF THE MERGE-BASE (BASE_SHA, from the
          # `changed` step), so the gate can require the head ledger to be the
          # base plus appended lines (a PR that deletes or rewrites a recorded
          # line is `ledger-rewritten`). Written to a file, not an output: a
          # 100-record ledger exceeds the single-string env limit. Absent at
          # base → an EMPTY file (a measured, empty base); present but
          # unreadable → `git show` fails this step under -e.
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::the merge-base from the changed-files step is empty; the ledger base cannot be read"
            exit 1
          fi
          LEDGER_BASE_SHA="${BASE_SHA}"
          BASE_LEDGER_PATH="${RUNNER_TEMP}/base-vote-records.jsonl"
          # The commit must exist: an unknown sha would otherwise read as
          # "no ledger at base" and the append-only check would pass over
          # an empty base. Fails the step under -e.
          git -C "${GITHUB_WORKSPACE}/head" cat-file -e "${LEDGER_BASE_SHA}^{commit}"
          if git -C "${GITHUB_WORKSPACE}/head" cat-file -e "${LEDGER_BASE_SHA}:governance/vote-records.jsonl" 2>/dev/null; then
            git -C "${GITHUB_WORKSPACE}/head" show "${LEDGER_BASE_SHA}:governance/vote-records.jsonl" > "${BASE_LEDGER_PATH}"
          else
            : > "${BASE_LEDGER_PATH}"
          fi
          {
            echo "approvals=${APPROVALS}"
            echo "labels=${LABELS}"
            echo "label_actor=${LABEL_ACTOR}"
            echo "label_time=${LABEL_TIME}"
            echo "head_time=${HEAD_TIME}"
            echo "head_parent=${HEAD_PARENT_SHA}"
            echo 'head_commit_files<<FILES_EOF'
            echo "${HEAD_COMMIT_FILES}"
            echo 'FILES_EOF'
            echo 'prior_heads<<FILES_EOF'
            echo "${PRIOR_HEADS}"
            echo 'FILES_EOF'
            echo "base_ledger_path=${BASE_LEDGER_PATH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run ratification gate
        # Same gate as the detector: runs only for a governor-path PR. The
        # not-touched verdict is the final step's.
        if: steps.touched.outputs.governor_touched == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          APPROVALS: ${{ steps.evidence.outputs.approvals }}
          PR_LABELS: ${{ steps.evidence.outputs.labels }}
          RATIFICATION_LABEL_ACTOR: ${{ steps.evidence.outputs.label_actor }}
          RATIFICATION_LABEL_TIME: ${{ steps.evidence.outputs.label_time }}
          HEAD_OBSERVED_AT: ${{ steps.evidence.outputs.head_time }}
          # #5130 step 2 / #5779: the committed-ledger evidence line. The gate
          # looks up `governance/vote-records.jsonl` for a record with
          # `ratifiesPr.pr == PR_NUMBER` bound to PR_HEAD_SHA (or its parent
          # for a ledger-only tip). #5131: that verdict is PART OF the exit
          # code — only `ratified` passes, alongside the label/approval
          # verdict; `no-record` (the empty ledger included), every other
          # kind, and `unmeasured` are ::error:: and exit 1. A governor-path
          # PR is red until the orchestrator appends its ratifying record.
          # #6256: a record bound to an EARLIER head A of this PR is
          # `ratified-rebased` when A is an ancestor of this head or one of
          # PR_PRIOR_HEADS (#6301 item 4 — the gate fetches a prior head
          # from origin by sha when a rebase orphaned it, and never any
          # other sha), A carries a non-ledger change, this head's TREE
          # equals `git merge-tree --write-tree <merge-base(head, PR_BASE_SHA)> A`
          # with the ledger excluded (#6301 panel 1: a conflict, or any
          # differing path, is `sha-mismatch` naming it), and A's ledger is
          # a subsequence of this head's. The probe runs over this checkout
          # (fetch-depth: 0, credentials persisted) with PR_BASE_SHA below as
          # the PR base.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_PARENT_SHA: ${{ steps.evidence.outputs.head_parent }}
          HEAD_COMMIT_FILES: ${{ steps.evidence.outputs.head_commit_files }}
          PR_PRIOR_HEADS: ${{ steps.evidence.outputs.prior_heads }}
          # #6213: the ledger at the merge-base; the gate requires the head
          # ledger to be this plus appended lines (`ledger-rewritten` otherwise).
          RATIFICATION_BASE_LEDGER_PATH: ${{ steps.evidence.outputs.base_ledger_path }}
          # #5944: lets the gate read CLAUDE.md / AGENTS.md as of base and
          # exempt a diff whose only change is inside a generated span. Absent
          # or malformed, the exemption is simply never granted — fail-closed.
          #
          # #6029: this once read `steps.changed.outputs.base` when `id: changed`
          # lived only in the SIBLING `governor-review` job; step outputs are
          # JOB-SCOPED, so it resolved to the empty string on every run and
          # the exemption never fired. THIS job now has its own `changed`
          # step (#6260), and the #4698 wiring test would report a cross-job
          # reference.
          #
          # The merge-base, not `pull_request.base.sha`: the base-branch TIP
          # would fold in whatever else landed on main since the branch
          # diverged, so an unrelated PR touching a governed file could revoke
          # this PR's exemption.
          PR_BASE_SHA: ${{ steps.changed.outputs.base }}
        working-directory: gate
        run: pnpm exec tsx scripts/governor-gate.ts ratification --target "${GITHUB_WORKSPACE}/head"

      - name: Verdict when no governor path is touched
        # `always()` so this step is reached even if the detector failed, and
        # then the verdict is NAMED rather than left to a skipped-steps job
        # summary. `false` is the measured empty case: `not-applicable`, exit
        # 0 (the same verdict and exit the gate script itself renders for an
        # empty touched set). Anything else here means the detector did not
        # report — the job is already failing, and this line says why.
        if: ${{ always() && steps.touched.outputs.governor_touched != 'true' }}
        env:
          TOUCHED: ${{ steps.touched.outputs.governor_touched }}
        working-directory: gate
        run: |
          if [ "${TOUCHED}" = "false" ]; then
            echo "not-applicable: this PR touches no governance-of-the-governor path — ratification not required."
            exit 0
          fi
          echo "::error::[governor-ratification] unmeasured: the governor-path detector reported '${TOUCHED}', not true or false; the gate cannot tell whether ratification is required."
          exit 1

  # ---------------------------------------------------------------------------
  # BACKSTOP: the same question, asked after the merge.
  #
  # `gh pr merge --admin` bypasses required status checks, so the pre-merge job
  # above cannot actually stop the merge it is meant to stop — which is exactly
  # how a48aa881d8 landed. This job runs on push to main and turns an unratified
  # governor-path merge into a red X on main that nobody can bypass, because by
  # then there is nothing left to bypass. Since #5131 "unratified" includes a
  # merge whose landed ledger carries no ratifying record for the PR.
  # ---------------------------------------------------------------------------
  governor-ratification-backstop:
    name: Governor-path ratification backstop (post-merge)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The push-event twin of the pre-merge job's output, read by
      # `codeowners-errors` so it still runs when a governor change LANDS.
      governor_touched: ${{ steps.touched.outputs.governor_touched }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Collect ratification evidence for the merged PR
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          # #6213: the tip of main BEFORE this push. A multi-commit push could
          # rewrite the ledger in one commit and append in the next, and
          # `SHA~1` would compare only the last hop.
          BEFORE: ${{ github.event.before }}
        run: |
          # See the pre-merge job: a failed `gh api` must fail the step rather
          # than vote "no approvals" (#5685).
          set -o pipefail
          FILES=$(git diff --name-only "${SHA}~1" "${SHA}")
          # #6029: the same before/after pair FILES is derived from, so the
          # exemption reads exactly the commit that landed. Without this the
          # backstop had NO base at all, and fixing only the pre-merge job would
          # have made a stamp-only PR pass pre-merge then fail here — a
          # self-inflicted red main on the very PRs the exemption waves through.
          BASE_SHA=$(git rev-parse "${SHA}~1")
          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '.[0].number // empty')
          if [ -z "${PR_NUMBER}" ]; then
            # A direct push to main touching governor paths is never ratified
            # by construction — there is no PR to carry the evidence.
            APPROVALS=""
            LABELS=""
            LABEL_ACTOR=""
            LABEL_TIME=""
            HEAD_TIME=""
            PR_HEAD_SHA=""
            PR_HEAD_PARENT_SHA=""
            PR_HEAD_COMMIT_FILES=""
            PR_PRIOR_HEADS=""
          else
            APPROVALS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --paginate --jq '.[] | select(.state == "APPROVED") | .user.login' | sort -u | tr '\n' ' ')
            LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.labels[].name] | join(",")')
            # Must mirror the pre-merge job: the gate step below consumes
            # `label_actor`, and without a producer here every label-ratified
            # governor PR lands as `indeterminate` and reddens main.
            LABEL_ACTOR=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --jq '[.[] | select(.event == "labeled" and .label.name == "owner-ratified")] | last | .actor.login // empty' \
              2>/dev/null | tail -n1 || echo '')
            LABEL_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --jq '[.[] | select(.event == "labeled" and .label.name == "owner-ratified")] | last | .created_at // empty' \
              2>/dev/null | tail -n1 || echo '')
            # The PR's OWN head, not ${SHA}. ${SHA} is the squash commit, created
            # after the label by construction, so comparing against it would
            # report every label-ratified PR as stale and redden main for the
            # benign population this gate exists to let through.
            PR_HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.sha // empty')
            # #6301 item 4: the same prior-head set the pre-merge job derives,
            # from the same source — the merged PR's own force-push timeline,
            # keyed on its NUMBER. A push event has no `pull_request` payload
            # and its `before` is main's old tip, not a PR head, so nothing
            # is folded in here. The timeline survives the merge (measured on
            # #6252 after it landed), which the workflow-run list does not:
            # its `pull_requests` empties on close. The two jobs must accept
            # the same rebased record or a PR passes pre-merge and reddens
            # main here.
            PR_PRIOR_HEADS=$(gh api graphql --paginate \
              -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" -F pr="${PR_NUMBER}" \
              -f query='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
                  timelineItems(first: 100, after: $endCursor, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) {
                    pageInfo { hasNextPage endCursor }
                    nodes { ... on HeadRefForcePushedEvent { beforeCommit { oid } afterCommit { oid } } } } } } }' \
              --jq '.data.repository.pullRequest.timelineItems.nodes[] | (.beforeCommit.oid // empty), (.afterCommit.oid // empty)')
            PR_PRIOR_HEADS=$(printf '%s\n' "${PR_PRIOR_HEADS}" | grep -E '^[0-9a-f]{40}$' | grep -v "^${PR_HEAD_SHA}$" | sort -u || true)
            if [ -n "${PR_HEAD_SHA}" ]; then
              # See the pre-merge job: server-assigned run time, never the
              # client-settable commit date.
              HEAD_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PR_HEAD_SHA}&per_page=100" \
                --jq '[.workflow_runs[].created_at] | sort | first // empty' 2>/dev/null || echo '')
              # #6249: the ledger binding is checked against THIS head — the
              # PR's final pre-squash head — not the PR number alone. Keying
              # on the number accepted a record bound to sha1 for a PR whose
              # final head was sha2 (pushed past a red pre-merge gate and
              # admin-merged), and the backstop exited 0. The pre-squash
              # commits are reachable from `refs/pull/N/head`; fetch it so
              # the head's parent and file list resolve for the ledger-only
              # tip rule. If the commit still cannot be found, only the head
              # sha itself is accepted (a ledger-only tip then reads as
              # sha-mismatch — fail-closed, and the notice says why).
              git fetch --quiet origin "refs/pull/${PR_NUMBER}/head" || true
              if git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
                PR_HEAD_PARENT_SHA=$(git rev-parse --verify --quiet "${PR_HEAD_SHA}^" || echo '')
                if [ -n "${PR_HEAD_PARENT_SHA}" ]; then
                  PR_HEAD_COMMIT_FILES=$(git diff --name-only "${PR_HEAD_PARENT_SHA}" "${PR_HEAD_SHA}")
                else
                  PR_HEAD_COMMIT_FILES=""
                fi
              else
                echo "::notice::[governor-ledger] PR #${PR_NUMBER} head ${PR_HEAD_SHA} is not reachable after fetching refs/pull/${PR_NUMBER}/head; only that sha is accepted as bound (head^ cannot be resolved)"
                PR_HEAD_PARENT_SHA=""
                PR_HEAD_COMMIT_FILES=""
              fi
            else
              # No head: the gate reads an absent PR_HEAD_SHA as unmeasured
              # and exits 1 — a binding that cannot be checked is not a pass.
              HEAD_TIME=""
              PR_HEAD_PARENT_SHA=""
              PR_HEAD_COMMIT_FILES=""
            fi
          fi
          # #6213: the ledger AS OF THE TIP BEFORE THIS PUSH (`github.event.before`),
          # so the append-only check spans the whole push, not the last commit.
          # A null `before` (the first push of a branch) has no such tip; then
          # `SHA~1` is the only base there is, and the annotation says so.
          # Written to a file, not an output: a 100-record ledger exceeds the
          # single-string env limit. Absent at base → an EMPTY file (a measured,
          # empty base); present but unreadable → `git show` fails this step under -e.
          if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            LEDGER_BASE_SHA="${BEFORE}"
          else
            LEDGER_BASE_SHA="${BASE_SHA}"
            echo "::notice::[governor-ledger] github.event.before is the null sha (first push of this ref): the append-only base is ${SHA}~1, the last commit only"
          fi
          BASE_LEDGER_PATH="${RUNNER_TEMP}/base-vote-records.jsonl"
          # The commit must exist: an unknown sha would otherwise read as
          # "no ledger at base" and the append-only check would pass over
          # an empty base. Fails the step under -e.
          git cat-file -e "${LEDGER_BASE_SHA}^{commit}"
          if git cat-file -e "${LEDGER_BASE_SHA}:governance/vote-records.jsonl" 2>/dev/null; then
            git show "${LEDGER_BASE_SHA}:governance/vote-records.jsonl" > "${BASE_LEDGER_PATH}"
          else
            : > "${BASE_LEDGER_PATH}"
          fi
          {
            echo 'files<<FILES_EOF'
            echo "${FILES}"
            echo 'FILES_EOF'
            echo "approvals=${APPROVALS}"
            echo "labels=${LABELS}"
            echo "label_actor=${LABEL_ACTOR}"
            echo "label_time=${LABEL_TIME}"
            echo "head_time=${HEAD_TIME}"
            echo "base=${BASE_SHA}"
            echo "pr_number=${PR_NUMBER}"
            echo "pr_head=${PR_HEAD_SHA}"
            echo "pr_head_parent=${PR_HEAD_PARENT_SHA}"
            echo 'pr_head_commit_files<<FILES_EOF'
            echo "${PR_HEAD_COMMIT_FILES}"
            echo 'FILES_EOF'
            echo 'pr_prior_heads<<FILES_EOF'
            echo "${PR_PRIOR_HEADS}"
            echo 'FILES_EOF'
            echo "base_ledger_path=${BASE_LEDGER_PATH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Which governor paths did this push touch?
        id: touched
        env:
          CHANGED_FILES: ${{ steps.evidence.outputs.files }}
        # See the pre-merge job's twin step. Over the push's own file list, so
        # the CODEOWNERS parse runs on the sha that landed a governor change.
        # The backstop keeps evidence-first: after a merge there is no
        # ordinary-PR path to protect from an API outage, and a red backstop
        # on an unmeasured governor merge is the durable signal it exists for.
        run: |
          TOUCHED=$(pnpm exec tsx scripts/governor-paths-touched.ts)
          echo "governor_touched=${TOUCHED}" >> "${GITHUB_OUTPUT}"

      - name: Run ratification gate against what actually landed
        env:
          CHANGED_FILES: ${{ steps.evidence.outputs.files }}
          APPROVALS: ${{ steps.evidence.outputs.approvals }}
          PR_LABELS: ${{ steps.evidence.outputs.labels }}
          RATIFICATION_LABEL_ACTOR: ${{ steps.evidence.outputs.label_actor }}
          RATIFICATION_LABEL_TIME: ${{ steps.evidence.outputs.label_time }}
          HEAD_OBSERVED_AT: ${{ steps.evidence.outputs.head_time }}
          # #5130 step 2: the ledger evidence line. ${SHA} is the squash
          # commit, which no panel saw, so the binding is checked against the
          # merged PR's FINAL pre-squash head (#6249) — the same head the
          # pre-merge job checked, resolved from `pulls/{n}` and fetched via
          # `refs/pull/{n}/head`. A direct push has no PR number, and a PR
          # whose head cannot be resolved has no PR_HEAD_SHA; the gate reports
          # both as unmeasured rather than as "no record".
          # #5131: the same flip as the pre-merge job — a merged governor-path
          # PR with no bound, approved, whole, supermajority, absolute_quorum
          # record in the landed ledger is exit 1, and so is `unmeasured`.
          # A red backstop is the durable signal: the pre-merge job can be
          # admin-bypassed, this cannot.
          # #6256: the same moved-head rule as the pre-merge job, against the
          # pre-squash head: PR_BASE_SHA is `${SHA}~1` (main before the
          # squash), so the head's merge-base with it is the newest main
          # commit the head incorporates (the base the ratified sha is
          # replayed onto), and each probed sha's merge-base with it is that
          # sha's own fork point. A ratified sha a rebase orphaned is
          # accepted as an ancestor of any prior head in PR_PRIOR_HEADS
          # (#6364); prior heads are fetched from origin by sha if absent.
          PR_NUMBER: ${{ steps.evidence.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.evidence.outputs.pr_head }}
          PR_HEAD_PARENT_SHA: ${{ steps.evidence.outputs.pr_head_parent }}
          HEAD_COMMIT_FILES: ${{ steps.evidence.outputs.pr_head_commit_files }}
          PR_PRIOR_HEADS: ${{ steps.evidence.outputs.pr_prior_heads }}
          # #6213: the ledger at `github.event.before` (`${SHA}~1` only when
          # `before` is the null sha); what landed must be that plus appended
          # lines, the same rule the pre-merge job applies.
          RATIFICATION_BASE_LEDGER_PATH: ${{ steps.evidence.outputs.base_ledger_path }}
          # #6029: the backstop set NO base at all, so its exemption was
          # unreachable by a second mechanism. Both jobs must grant the same
          # exemption or a stamp-only PR turns main red after merging green.
          PR_BASE_SHA: ${{ steps.evidence.outputs.base }}
        run: pnpm exec tsx scripts/check-governor-ratification.ts

  # ---------------------------------------------------------------------------
  # CODEOWNERS parses under GitHub's own parser (#6174).
  #
  # Both gates above parse /CODEOWNERS with OUR parser (`scripts/governor-section.ts`).
  # Nothing verified that GitHub reads the same file the same way, and a pattern
  # GitHub rejects is a governor entry that exists for our gates and not for
  # GitHub's review requests. `GET /repos/{owner}/{repo}/codeowners/errors?ref=`
  # returns every line GitHub could not parse (line, column, kind, suggestion).
  # The script fails on a non-empty `errors` array AND on any payload without an
  # `errors` array (a 404 body has none) — an unmeasured file is not a clean one.
  #
  # Runs on both events, gated on the `governor_touched` output of whichever
  # ratification job ran (#4802 part 1; the pre-merge job on pull_request, the
  # backstop on push — the other is skipped and its output is empty). Why
  # gated rather than always-on: the job is cheap (~18 s measured, shallow
  # checkout), but on an ordinary PR CODEOWNERS is byte-identical to main's,
  # so the answer is main's answer, and a check whose input cannot differ from
  # the last one is a redundant context, not a measurement. Every PR that edits
  # CODEOWNERS or creates a shadow copy touches a governor path, so it still
  # reaches this job, and the other governor paths reach it too — a cheap
  # superset (one API call). Match SEMANTICS are not verified — see the script
  # header and #6174 for why that half is not measurable here.
  # ---------------------------------------------------------------------------
  codeowners-errors:
    name: CODEOWNERS parses under GitHub's parser
    needs: [governor-ratification, governor-ratification-backstop]
    if: ${{ !cancelled() && (needs.governor-ratification.outputs.governor_touched == 'true' || needs.governor-ratification-backstop.outputs.governor_touched == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      # #6377: two-checkout layout. The tree under review is DATA under `head`
      # (the shadow-CODEOWNERS probe only asks whether files exist there); the
      # script and toolchain come from the base ref under `gate`
      # (`github.base_ref` on a PR; the pushed ref itself after a merge).
      - name: Checkout tree under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR head for pull_request; the pushed sha for push (the default).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          fetch-depth: 1

      - name: Checkout base gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref || github.ref }}
          path: gate
          fetch-depth: 1

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          package_json_file: gate/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: gate/pnpm-lock.yaml

      - name: Install gate dependencies
        run: pnpm install --frozen-lockfile
        working-directory: gate

      - name: Ask GitHub to parse CODEOWNERS at the sha under review
        working-directory: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GITHUB_REPOSITORY and GITHUB_API_URL come from the runner environment.
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        # The script's exit code is the verdict: 0 only for `{ errors: [] }`.
        run: pnpm exec tsx scripts/governor-gate.ts codeowners-errors --target "${GITHUB_WORKSPACE}/head" --ref "${REF}"
