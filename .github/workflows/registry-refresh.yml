name: Registry Refresh

# Weekly regeneration of packages/nexus-agents/src/config/model-registry.generated.json
# from models.dev + LiteLLM. When the diff is non-trivial, opens a PR with a
# summary in the body. Bounded-diff guardrail labels `needs-human-review` on
# anything that trips the deletion-rate or cost-spike thresholds defined in
# scripts/check-registry-diff.ts (epic #2174 / issue #2180).

on:
  schedule:
    # Sundays 04:17 UTC (off-minute per CLAUDE.md convention).
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Print diff only, do not open a PR'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Top-level: read-only by default. Write scopes are granted only to the
# refresh job that needs them for `peter-evans/create-pull-request`
# (Scorecard TokenPermissions / OpenSSF SLSA-1 hardening).
permissions: read-all

jobs:
  refresh:
    name: Regenerate bundled registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # Post a visible verification status on the PR head (#4424). PRs opened
      # with GITHUB_TOKEN do not trigger pull_request workflows, so without
      # this the PR shows NO checks and reads as verified when it is not.
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node

      - name: Snapshot current registry
        id: snapshot
        run: |
          cp packages/nexus-agents/src/config/model-registry.generated.json /tmp/old-registry.json

      - name: Regenerate registry from upstream
        run: pnpm build:registry

      - name: Compute diff + guardrail verdict
        id: diff
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/check-registry-diff.ts \
            /tmp/old-registry.json \
            packages/nexus-agents/src/config/model-registry.generated.json \
            --json > /tmp/diff-report.json
          # Parse the verdict from the FILE, not a stdin pipe. The prior
          # `echo "$OUTPUT" | pnpm exec tsx -e 'process.stdin.on("data", ...)'` parsed only
          # the FIRST stdin chunk; the report JSON for a ~1k-entry registry spans
          # multiple chunks, so JSON.parse got a truncated prefix -> "Unexpected end
          # of JSON input" and this step failed on every scheduled run. Reading the
          # already-written file in one shot removes the chunk-boundary hazard and
          # collapses four fragile re-parses into one.
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("/tmp/diff-report.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `requires_review=${r.verdict.requiresHumanReview}\n` +
              `total_added=${r.summary.added.length}\n` +
              `total_removed=${r.summary.removed.length}\n` +
              `total_changed=${r.summary.changed.length}\n`);
          '
          pnpm exec tsx scripts/check-registry-diff.ts \
            /tmp/old-registry.json \
            packages/nexus-agents/src/config/model-registry.generated.json \
            > /tmp/diff-report.md

      - name: Check if file actually changed
        id: changed
        run: |
          if git diff --quiet packages/nexus-agents/src/config/model-registry.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The PR is opened whether or not verification passed, so that the head
      # commit can carry a status that says which. A failed verification used to
      # kill the job here, before any PR existed, so the branch carried NO status
      # at all — the "absent is indistinguishable from verified" state of #4424
      # (#4927 finding 8). The job still ends red on a failure (last step).
      - name: Verify refreshed data before opening a PR
        id: verify
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        run: bash scripts/verify-refresh.sh

      - name: Open PR with refreshed registry
        id: cpr
        if: steps.changed.outputs.changed == 'true' && inputs['dry-run'] != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/registry-refresh
          delete-branch: true
          commit-message: |
            chore(registry): weekly refresh of model-registry.generated.json

            Added: ${{ steps.diff.outputs.total_added }}, Removed: ${{ steps.diff.outputs.total_removed }}, Changed: ${{ steps.diff.outputs.total_changed }}.
          title: 'chore(registry): weekly refresh of model-registry.generated.json'
          body-path: /tmp/diff-report.md
          labels: |
            architecture
            capabilities-matrix
            automated

      - name: Publish verification status onto the PR head
        if: always() && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          # Records the verify step's ACTUAL outcome on the commit the PR points
          # at. This used to be a hardcoded `state=success` that could only run
          # after a pass, so the status could only ever say pass (#4927 finding
          # 8). Anything other than success/failure means verification did not
          # run, which is reported as `error`, never as passed.
          case "$VERIFY_OUTCOME" in
            success) state=success; description='typecheck + registry-coverage + config tests passed' ;;
            failure) state=failure; description='verify-refresh.sh failed — see the run log before merging' ;;
            *)       state=error;   description="verification did not run (step outcome: ${VERIFY_OUTCOME:-none})" ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=refresh/verify \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Label PR needs-human-review when guardrails trip
        if: steps.changed.outputs.changed == 'true' && steps.diff.outputs.requires_review == 'true' && inputs['dry-run'] != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:automated/registry-refresh`,
              state: 'open',
            });
            const pr = prs[0];
            if (pr === undefined) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['needs-human-review'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                '⚠ Bounded-diff guardrail tripped — see the PR body for the reasons.',
                '',
                'Do not auto-merge this PR. A human must review the model deletions / cost',
                'bumps before landing. Thresholds are defined in `scripts/check-registry-diff.ts`',
                '(5% deletion rate, 10× cost ratio) per epic #2174.',
              ].join('\n'),
            });

      - name: Print diff summary
        if: always()
        run: cat /tmp/diff-report.md || echo '(no diff report)'

      - name: Fail the job when verification failed
        if: always() && steps.verify.outcome == 'failure'
        run: |
          echo "::error::verify-refresh.sh failed; the PR (if opened) carries a failing refresh/verify status. See the verify step's log."
          exit 1
