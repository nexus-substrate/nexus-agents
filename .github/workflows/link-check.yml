# Link Checker Workflow
#
# Validates all links in documentation and markdown files using lychee.
# Runs on push to main and weekly schedule.
#
# (Source: User request for automated link validation)

name: Link Check

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.mdx'
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/link-check.yml'
      - 'lychee.toml'
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'
      - 'website/**'
      - 'docs/**'
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-cache-${{ github.sha }}
          restore-keys: |
            lychee-cache-

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --cache
            --max-cache-age 1d
            .
          fail: true
          output: ./lychee-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lychee report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-report
          path: ./lychee-report.md
          retention-days: 7

      - name: Comment on PR with broken links
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./lychee-report.md', 'utf8');

            // Truncate if too long
            const maxLength = 60000;
            const truncatedReport = report.length > maxLength
              ? report.substring(0, maxLength) + '\n\n... (truncated)'
              : report;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔗 Link Check Report\n\nBroken links were found:\n\n\`\`\`\n${truncatedReport}\n\`\`\`\n\nPlease fix these links before merging.`
            });

  docs-site-check:
    name: Check Docs Site Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Check internal links in built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --base website/dist
            --include-verbatim
            'website/dist/**/*.html'
          fail: true
          output: ./docs-site-report.md

      - name: Upload docs site report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-site-report
          path: ./docs-site-report.md
          retention-days: 7
