# Link Checker Workflow
#
# Validates all links in documentation and markdown files using lychee.
# Runs on push to main and weekly schedule.
#
# (Source: User request for automated link validation)

name: Link Check

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - '.github/workflows/link-check.yml'
      - 'lychee.toml'
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions: read-all
jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # #3778 (Rule-of-Two CI leg): skip on auto-remediation bot-branch PRs — the
    # plan doc is markdown (matches the path filter) and this job carries
    # GITHUB_TOKEN; keep secrets off untrusted-signal-derived branch content.
    # push/schedule/dispatch are unaffected (no untrusted PR head ref).
    if: |
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.head.ref, 'auto-remediation/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .lycheecache
          key: lychee-cache-${{ github.sha }}
          restore-keys: |
            lychee-cache-

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config lychee.toml
            --cache
            --max-cache-age 1d
            .
          fail: true
          output: ./lychee-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lychee report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lychee-report
          path: ./lychee-report.md
          retention-days: 7

      # Distinguish "links are broken" from "the checker could not run" (#5742).
      # lychee writes the report only once it has results; a non-zero exit
      # BEFORE that (network, config, rate limit — exit 35 was seen on an
      # unchanged tree that passed four minutes earlier) leaves no file. The
      # step used to read it unguarded and die on ENOENT, so the one artifact
      # that says what went wrong was replaced by a Node stack trace.
      - name: Report the link-check outcome
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = './lychee-report.md';

            if (!fs.existsSync(path)) {
              // Nothing was measured. Say that, rather than letting a red
              // "Check Links" read as a broken link.
              core.warning(
                'lychee exited non-zero without writing a report — the link set was NOT measured. ' +
                  'This is a checker failure, not a broken link. Re-run the job.'
              );
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body:
                  '## 🔗 Link check did not run\n\n' +
                  'lychee exited non-zero **before producing a report**, so the link set was not ' +
                  'measured. This is a failure of the checker, not evidence of a broken link — ' +
                  're-run the job. See the step log for the exit code.'
              });
              return;
            }

            const report = fs.readFileSync(path, 'utf8');

            // Truncate if too long
            const maxLength = 60000;
            const truncatedReport = report.length > maxLength
              ? report.substring(0, maxLength) + '\n\n... (truncated)'
              : report;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔗 Link Check Report\n\nBroken links were found:\n\n\`\`\`\n${truncatedReport}\n\`\`\`\n\nPlease fix these links before merging.`
            });
