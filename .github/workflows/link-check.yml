# Link Checker Workflow
#
# Validates all links in documentation and markdown files using lychee.
# Runs on push to main and weekly schedule.
#
# (Source: User request for automated link validation)

name: Link Check

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - '.github/workflows/link-check.yml'
      - 'lychee.toml'
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Restore lychee cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: .lycheecache
          key: lychee-cache-${{ github.sha }}
          restore-keys: |
            lychee-cache-

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: >-
            --config lychee.toml
            --cache
            --max-cache-age 1d
            .
          fail: true
          output: ./lychee-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lychee report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: lychee-report
          path: ./lychee-report.md
          retention-days: 7

      - name: Comment on PR with broken links
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./lychee-report.md', 'utf8');

            // Truncate if too long
            const maxLength = 60000;
            const truncatedReport = report.length > maxLength
              ? report.substring(0, maxLength) + '\n\n... (truncated)'
              : report;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔗 Link Check Report\n\nBroken links were found:\n\n\`\`\`\n${truncatedReport}\n\`\`\`\n\nPlease fix these links before merging.`
            });
