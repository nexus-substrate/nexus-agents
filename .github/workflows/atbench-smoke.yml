name: ATBench Smoke

# Smoke-test the atbench CLI command end-to-end against the in-repo
# fixture. Uses the stub scorer (no LLM, no HF network) so this
# stays fast and offline. (#1981)

on:
  pull_request:
    paths:
      - 'packages/nexus-agents/src/benchmarks/atbench/**'
      - 'packages/nexus-agents/src/cli/atbench-command.ts'
      - 'test-fixtures/atbench-smoke.jsonl'
      - '.github/workflows/atbench-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: atbench fixture smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node

      - name: Build
        run: pnpm --filter nexus-agents build

      - name: Run atbench info
        run: |
          node packages/nexus-agents/dist/cli.js atbench info
        continue-on-error: false

      - name: Run atbench smoke (stub oracle, fixture)
        run: |
          set -euo pipefail
          out=$(node packages/nexus-agents/dist/cli.js atbench run \
            --variant=claw \
            --fixture=test-fixtures/atbench-smoke.jsonl \
            --verbose 2>&1)
          echo "$out"

          # Stub scorer is a perfect oracle, so all 5 fixture trajectories
          # should pass. Guard against regressions in the runner / scorer
          # contract by asserting "5/5 passed".
          if ! echo "$out" | grep -q "5/5"; then
            echo "::error::atbench smoke did not report 5/5 passed"
            exit 1
          fi

          # Sanity check: precision/recall/F1 should be 1.000 for a
          # perfect oracle (all correct).
          if ! echo "$out" | grep -q "F1:.*1.000"; then
            echo "::error::expected F1=1.000 from stub oracle"
            exit 1
          fi
