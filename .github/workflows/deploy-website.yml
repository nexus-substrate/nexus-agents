name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      # The API reference is generated at build time (#4449) and MUST exist
      # before astro runs: the Astro glob loader turns a missing docs/api into
      # an empty `api` collection, so the site deploys successfully with the
      # entire /api section missing (#4507). turbo resolves the generator's own
      # prerequisite (nexus-agents#docs:api:md dependsOn nexus-memory#build).
      #
      # website/ is its own pnpm root since #6986 — outside the product
      # workspace and its lockfile — so turbo no longer sees it. The ordering
      # that used to live in turbo.json as nexus-agents-website#build is these
      # two steps, in this order.
      - name: Generate the API reference
        run: npx turbo run docs:api:md --filter=nexus-agents

      - name: Install website dependencies (own lockfile)
        run: pnpm --dir website install --frozen-lockfile

      - name: Build website
        run: pnpm --dir website build

      # The failure mode this guards is silent: a missing collection is not a
      # build error, so without this the site publishes minus its API
      # reference and nothing reports it.
      - name: Verify the API reference was generated
        run: |
          pages=$(find website/dist/api -name index.html 2>/dev/null | wc -l)
          echo "Built $pages /api/ pages."
          if [ "$pages" -eq 0 ]; then
            echo "::error::No /api/ pages in the build output — the published API reference would 404."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  # BLOCKING as of #5687 step 3. This job spent months unable to fail: it ran
  # lychee with `fail: false` while `deploy` listed it in `needs`, so the checks
  # list showed a link gate in front of every publish that could not stop one.
  #
  # Getting here took measuring, not just flipping the flag. Against the real
  # published artifact:
  #   6798 errors  the reported count, of which 4810 were a root-mapping
  #                artifact — lychee resolved `/nexus-agents/x` against a site
  #                root with no `nexus-agents/` directory (fixed in step 2)
  #   1988 errors  what was actually broken once the mapping was right
  #     69 errors  after the API route, the dead sidebar entries and the
  #                research-index link were fixed (#5750)
  #     12 errors  after hyphens stopped being folded out of docs slugs
  #      0 errors  run 34035103758
  #
  # A link that breaks now fails this job and blocks the publish, which is what
  # the checks list claimed all along.
  link-check:
    name: Check Links
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: .

      # Extract UNDER the published base path. The site is served at
      # `/nexus-agents/`, so its absolute links are `/nexus-agents/...`;
      # `--root-dir site` resolves those against `site/`, which only matches
      # the on-disk layout when the artifact sits in `site/nexus-agents`.
      - name: Extract artifact under the published base path
        run: mkdir -p site/nexus-agents && tar -xf artifact.tar -C site/nexus-agents

      - name: Link check with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --index-files index.html
            --root-dir site
            --exclude-path 'site/nexus-agents/_astro'
            --exclude '\.md$'
            --exclude '\.md#'
            --exclude '\.\./\.\.'
            --exclude 'src/'
            --exclude 'packages/'
            'site/nexus-agents/**/*.html'
          fail: true

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, link-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
