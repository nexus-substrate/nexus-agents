name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      # Must go through turbo from the repo root, NOT `pnpm build` inside
      # website/. The API reference is generated at build time (#4449), and the
      # ordering lives in turbo.json: nexus-agents-website#build dependsOn
      # nexus-agents#docs:api:md dependsOn nexus-memory#build. Running astro
      # directly bypasses that graph, so docs/api never exists and the Astro
      # glob loader silently yields an empty `api` collection — the site
      # deploys successfully with the entire /api section missing (#4507).
      - name: Build website
        run: npx turbo run build --filter=nexus-agents-website

      # The failure mode this guards is silent: a missing collection is not a
      # build error, so without this the site publishes minus its API
      # reference and nothing reports it.
      - name: Verify the API reference was generated
        run: |
          pages=$(find website/dist/api -name index.html 2>/dev/null | wc -l)
          echo "Built $pages /api/ pages."
          if [ "$pages" -eq 0 ]; then
            echo "::error::No /api/ pages in the build output — the published API reference would 404."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  # Advisory only (#5687). lychee resolves the Pages base path (`/nexus-agents/…`)
  # against `--root-dir site` and reports ~6.8k "file not found" per run, so the
  # count is a measurement artifact, not broken links. Until the root mapping is
  # fixed and the real error count is known, this job is a report: `deploy` does
  # not wait on it and its name says so. Re-enable per #5687 step 2.
  link-report:
    name: Link report (advisory, #5687)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: .

      - name: Extract artifact
        run: mkdir -p site && tar -xf artifact.tar -C site

      - name: Link check with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --offline
            --root-dir site
            --exclude-path 'site/_astro'
            --exclude '\.md$'
            --exclude '\.md#'
            --exclude '\.\./\.\.'
            --exclude 'src/'
            --exclude 'packages/'
            'site/**/*.html'
          fail: false

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
