name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Validate conventional commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  changeset-check:
    name: Changeset Presence
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      # A PR that changes shippable source must add a changeset — changeset
      # debt is the root cause of the release-race incidents (see
      # docs/ops/release-changeset-race.md).
      - name: Check changeset presence
        run: pnpm exec tsx scripts/check-changeset.ts ${{ github.event.pull_request.base.sha }}

  producer-consumer-check:
    name: Producer/Consumer Check
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      # Every NEW .ts file added under packages/nexus-agents/src/ must have
      # at least one non-test, non-barrel import elsewhere in src/. Catches
      # the producer-without-consumer dead-code shape (#3024) that drove
      # the 2026-05-24 YAGNI audit sweep (~5,250 LOC deleted across 7
      # issues). Opt-out: `// @export-no-consumer-yet — see #<issue>`.
      - name: Check producer-without-consumer (#3024)
        run: pnpm exec tsx scripts/check-new-unused-exports.ts ${{ github.event.pull_request.base.sha }}

      - name: Public API surface
        # #4749: a name grep cannot answer a reachability question. Three type
        # changes shipped mis-versioned before this existed (#4736, #4740,
        # #4744). The gate reports what moved; a human decides the semver level.
        run: pnpm exec tsx scripts/check-api-surface.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # 20, not 10. This job was already at 10 before #5396, so the 5 -> 10 sweep
    # did not touch it — and it is now hitting that cap. Measured on the run
    # that died (job 100926656068), which reached exactly 10m00s with four
    # steps still unrun, missing by roughly ten seconds:
    #
    #   setup-node             0m12s     <- 2% of the job, not the ~90% the
    #   Run lint               2m10s        install-bound gates are
    #   Run architectural lint 6m51s     <- the dominant cost
    #   9 gate scripts         1-3s each
    #
    # The case for 20 rather than 11 or 12 is VARIANCE, not that one outlier:
    # three runs inside one hour took 4m51s, 6m57s, and >10m04s. A cap set just
    # above the worst observed run converts normal variance into an
    # intermittently red PR — and a timed-out job reports as CANCELLED,
    # indistinguishable from a concurrency supersede, so the natural response
    # is to re-run rather than investigate (#5396). Runaway-guard, not an SLA.
    #
    # If `architectural lint` keeps growing, the fix is that step, not this cap.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      # #5411: gate against reintroducing registry-resolved tsx. The check
      # lives in a script because its own error message contains the string it
      # searches for, so an inline version matched its own definition and
      # failed on a clean tree. Cheap and first, so a regression fails in
      # seconds rather than after the whole-repo eslint.
      - name: No undeclared tsx invocations (#5411)
        run: bash scripts/check-npx-tsx.sh

      - name: Run lint
        run: pnpm lint

      # #4483: `pnpm lint` is `turbo lint`, which only reaches each workspace's
      # own `eslint src/`. The repo-root `scripts/` tree — governance
      # generators, drift gates, the release helper — was outside every lint
      # scope and had accumulated 7 deprecated-API errors nothing reported.
      - name: Run lint (repo scripts)
        run: pnpm lint:scripts

      # #4558: `pnpm typecheck` is `turbo typecheck`, which fans out to each
      # workspace's own tsc. `scripts/` is not a workspace, so nothing
      # typechecked the tree that holds the governance gates — 14 errors had
      # accumulated, including two genuine API drifts. Same gap #4483 found
      # for lint.
      - name: Type check (repo scripts)
        run: pnpm typecheck:scripts

      # #4490: `lint:arch` has existed since #570 and exits non-zero on error,
      # but was wired into no workflow and no hook, so nothing ever ran it. It
      # had drifted red (5 false-positive Test Hygiene errors, 4 false-positive
      # hardcoded-credential errors) — an unrun gate rots exactly like unrun
      # code. Errors block; the 397 advisory warnings do not.
      - name: Run architectural lint
        run: pnpm lint:arch

      # #4562: a check script no workflow invokes is indistinguishable from no
      # gate, except that its existence implies coverage. check-schema-fanout
      # sat unwired for three months while two documents said it ran in CI
      # (#4553); an audit then found six more, including one whose own header
      # calls it "the CI half of the authority-ladder enforcement layer".
      # This gate asserts its own reachability first.
      - name: Check every gate script is reachable from CI
        run: pnpm exec tsx scripts/check-script-wiring.ts

      # The six gates that audit found unwired (#4562). All pass today —
      # verified before wiring, because an unrun gate rots (lint:arch had
      # drifted red with nine false positives by the time #4490 found it).
      - name: Authority-tier declaration gate (#3841)
        run: pnpm exec tsx scripts/check-authority-tier-drift.ts

      - name: Strategy-manifest drift gate (#3837)
        run: pnpm exec tsx scripts/check-strategy-manifest-drift.ts

      - name: Memory-contract drift gate (#2766)
        run: pnpm exec tsx scripts/check-memory-contract.ts

      - name: Catalogue drift sweep (#4417)
        run: pnpm exec tsx scripts/check-catalogue-drift.ts

      # #5142: docs/ENTRYPOINTS.md is named canonical for CLI entry points and
      # drifted — 20 commands documented against 52 registered, plus two rows
      # naming implementation modules as if they were commands. Nothing compared
      # the two lists. Baseline-aware: existing gaps are recorded debt, a NEW
      # undocumented command or a phantom row fails.
      - name: CLI docs drift (#5142)
        run: pnpm exec tsx scripts/check-cli-docs-drift.ts

      # #5142: config/env-schema.ts reports an unrecognized NEXUS_* var as a
      # typo. 33 vars that production code READS were never registered, so a
      # correctly-spelled variable (verified: NEXUS_VOTER_MODEL_ARCHITECT,
      # NEXUS_MCP_DEPTH) was reported as the user's mistake. The #4722 test
      # guards only documented->registered; this guards read-in-code->registered.
      - name: Env-schema coverage (#5142)
        run: pnpm exec tsx scripts/check-env-schema-coverage.ts

      # #5123 (epic #5121): one canonical implementation per OPERATION. The old
      # canonical table listed SYMBOLS, which is how it blessed both sides of
      # adapter acquisition — two entries for one question. Cleaning up eleven
      # cost paths is worth little if a twelfth lands next week; this gate found
      # exactly that (#5186) on its first run. Alternates are tracked by
      # PRESENCE, never counts, so two unrelated PRs cannot conflict over them.
      - name: Concern registry (#5123)
        run: pnpm exec tsx scripts/check-concern-registry.ts

      - name: Tool-description distinctness (#2650)
        run: pnpm exec tsx scripts/check-tool-distinctness.ts

      - name: Tool-output consistency (#2653)
        run: pnpm exec tsx scripts/check-tool-output-consistency.ts

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Run typecheck
        run: pnpm typecheck

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Build
        run: pnpm build

      # Runtime data assets are copied by tsup's `onSuccess`, not bundled, so a
      # missing copy ships a package whose loaders silently fall back to empty.
      # `models-dev-snapshot.json` was never in the copy list, and every
      # installed copy enumerated zero models for claude/codex/gemini (#5083).
      # `pnpm build` already runs this; the explicit step names the failure
      # instead of burying it in tsup output.
      - name: Verify runtime assets reached dist
        run: pnpm exec tsx scripts/check-dist-assets.ts

      - name: Upload build output
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-dist
          path: packages/nexus-agents/dist/
          retention-days: 1

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      # Epic #2872: catch tests that accidentally leak artifacts into the
      # working tree. Allow the legitimate outputs (coverage/, dist/, generated
      # docs) — fail on the sprawl-pattern paths from the audit. Issue #2878.
      - name: Working-tree clean check (epic #2872)
        if: always()
        run: |
          set -u
          # #5302: this used to be one pipeline ending in `|| true`, with
          # `git status` under `2>/dev/null`. The pipeline's status is grep's,
          # not git's, and `|| true` erased even that — so a git failure
          # (dubious ownership, permissions) produced an empty `leaks` and the
          # step reported "working tree clean" having measured nothing.
          # Capture git separately so its failure is a failure.
          if ! status=$(git status --porcelain --untracked-files=all); then
            echo "::error::git status failed; the working tree was never inspected."
            echo "This step cannot report a clean tree without reading one."
            exit 1
          fi

          # grep exits 1 on no-match, which is the healthy case here, so `|| true`
          # is correct on THIS pipeline — the exit code being discarded is grep's
          # "found nothing", not git's "could not look".
          leaks=$(printf '%s\n' "$status" \
            | awk '{print $2}' \
            | grep -E '^(runs/|logs/|\.nexus-pipeline/|\.nexus-agents/|governance/|predictions\.jsonl$|coverage\.json$|\.test-)' \
            || true)
          if [ -n "$leaks" ]; then
            echo "::error::Tests left sprawl artifacts in the working tree:"
            echo "$leaks" | sed 's/^/  - /'
            echo ""
            echo "Per epic #2872, runtime artifacts must land under getNexusDataDir(),"
            echo "and test temp dirs must use os.tmpdir() + mkdtempSync() with cleanup."
            echo "See packages/nexus-agents/src/cli/init-portable.test.ts for the pattern."
            echo ""
            echo "A governance/ entry means a test wrote to a TRACKED, hash-chained"
            echo "audit file (#4415). Those records chain cleanly, so a fabricated one"
            echo "is indistinguishable from a real verdict — pass an explicit repoPath"
            echo "to a throwaway repo instead."
            exit 1
          fi
          echo "✓ Working tree clean after tests"

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        # #3614: don't expose CODECOV_TOKEN to auto-remediation bot branches
        # (secret-less CI for the auto-PR path). Prefix kept in sync with
        # AUTO_REMEDIATION_BRANCH_PREFIX in src/mcp/tools/auto-remediation-branch.ts.
        if: >-
          github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' &&
          !startsWith(github.head_ref, 'auto-remediation/')
        with:
          files: ./packages/nexus-agents/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The repo-root scripts/ tests (generators + drift gates) are NOT collected
  # by the package suite above (its vitest config only globs packages/.../src),
  # so they ran only locally and gave zero CI protection (#3952). This job runs
  # them via the root vitest.config.ts.
  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      # generate-tool-reference.test.ts transitively imports tool schemas that
      # reach `nexus-memory`; build it first (mirrors docs-check.yml).
      - name: Build nexus-memory (workspace dep)
        run: pnpm --filter nexus-memory --fail-if-no-match build

      - name: Run script tests
        run: pnpm test:scripts

  fitness-audit:
    name: Fitness Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: build-dist
          path: packages/nexus-agents/dist/

      - name: Run fitness audit
        id: fitness
        uses: ./.github/actions/fitness-gate
        with:
          threshold: '70'
          warn-threshold: '90'

      - name: Upload fitness report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fitness-report-${{ matrix.os }}
          path: ${{ steps.fitness.outputs.report-path }}

  # Epic #2887 / #2895: end-to-end verification of the directory contract
  # from epic #2872. Unit tests mock the filesystem; this exercises the
  # real resolver against two scratch repos in containers — one with a
  # writable homedir, one with a read-only homedir (the sandbox case).
  consolidation-test:
    name: Consolidation E2E
    runs-on: ubuntu-latest
    # #5396: 20, not the 10 the install-bound gates get. This job is not
    # setup-node plus a seconds-long check — it runs a full `pnpm build` and
    # then two `docker compose` container runs. It burned 8m12s against its
    # 8-minute cap on PR #5397 and was killed, reported as CANCELLED with no
    # failing step. A runaway-guard, not an SLA: 20 leaves real headroom for a
    # cold Docker layer cache while still catching a hung container.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      # dist/cli.js is TypeScript-compiled (not bundled) — it imports from
      # node_modules at runtime, so both the build AND the installed deps
      # must be present in the read-only repo mount. Full `pnpm build`
      # (not --filter nexus-agents) so the nexus-memory workspace dep is
      # built first — a filtered build fails with "Could not resolve
      # nexus-memory".
      - name: Build workspace
        run: pnpm build

      - name: Run consolidation test (normal homedir)
        run: docker compose -f docker-compose.consolidation-test.yml run --rm consolidation-normal

      - name: Run consolidation test (read-only homedir / sandbox)
        run: docker compose -f docker-compose.consolidation-test.yml run --rm consolidation-sandbox

  model-string-drift:
    name: Model String Drift Check
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      # Blocking mode (#2199 Child 4). Drift findings fail the build.
      #
      # Rollback to advisory: set the env var below to '1' (or any non-'0' value).
      #   env:
      #     NEXUS_DRIFT_ADVISORY: '1'
      # The drift script defaults to advisory; the explicit '0' below is what
      # makes this job blocking.
      - name: Run model-string drift check (blocking)
        env:
          NEXUS_DRIFT_ADVISORY: '0'
        run: |
          set +e
          OUTPUT=$(pnpm --silent check:model-drift 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo "## Model String Drift Check"
            echo ""
            echo '```'
            echo "$OUTPUT"
            echo '```'
            echo ""
            if [ $STATUS -ne 0 ] || echo "$OUTPUT" | grep -q "violation(s) found"; then
              echo "⚠ Drift detected. Migrate to \`config/model-capabilities.ts\` or"
              echo "add a structured allowlist entry referencing #2200."
            else
              echo "✓ No new drift. Allowlisted sites tracked in scripts/model-string-drift-allowlist.ts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      # Advisory today (#4790). Approved to become required by consensus_vote
      # 6-1, gated on the exception ledger landing first (#4794): `pnpm audit`
      # answers to the npm advisory database, so requiring it with no reviewed
      # escape path means a third-party publication can redden every open PR,
      # and the recovery becomes admin-bypassing a required check.
      #
      # Suppressions go in package.json > pnpm.auditConfig, and EVERY id there
      # needs a warrant in .github/audit-exceptions.json — owner, tracking
      # issue, expiry — enforced by scripts/audit-exceptions.test.ts.
      - name: Run security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # Gate for branch protection - requires all checks to pass.
  # Cargo Audit / Cargo Deny jobs were removed: this is a Node.js
  # project, the jobs were guarded on a non-existent crates/iso-parser/
  # path (copy-paste from a Rust project) and skipped on every run.
  ci-success:
    name: CI Success
    needs:
      [
        commitlint,
        changeset-check,
        lint,
        typecheck,
        build,
        test,
        fitness-audit,
        consolidation-test,
        producer-consumer-check,
        script-tests,
        model-string-drift,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check required jobs
        run: |
          # commitlint, changeset-check and producer-consumer-check are skipped on
          # push (not a PR) — treat skipped as success.
          #
          # #4784: producer-consumer-check was absent from this list, so the
          # #3024 wiring gate and the #4757 API-surface gate could both go red
          # while the PR stayed mergeable. Branch protection requires only
          # "CI Success", so a gate not wired in here cannot fail by construction.
          if [[ "${{ needs.commitlint.result }}" != "success" && "${{ needs.commitlint.result }}" != "skipped" ]] || \
             [[ "${{ needs.changeset-check.result }}" != "success" && "${{ needs.changeset-check.result }}" != "skipped" ]] || \
             [[ "${{ needs.producer-consumer-check.result }}" != "success" && "${{ needs.producer-consumer-check.result }}" != "skipped" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.consolidation-test.result }}" != "success" ]] || \
             [[ "${{ needs.fitness-audit.result }}" != "success" ]] || \
             [[ "${{ needs.script-tests.result }}" != "success" ]] || \
             [[ "${{ needs.model-string-drift.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required checks passed!"
