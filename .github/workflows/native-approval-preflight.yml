name: Native approval eligibility preflight

# The default path measures protection read access only. Canary dispatch is a
# separate, explicit opt-in job with its own narrowly scoped write token.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Owner-authored fixed canary PR'
        required: true
        type: string
      head_sha:
        description: 'Exact 40-character canary commit SHA'
        required: true
        type: string
      base_sha:
        description: 'Exact trusted main SHA used as its direct parent'
        required: true
        type: string
      dispatch_canary:
        description: 'Explicitly dispatch the one-shot eligibility canary after preflight'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: native-approval-eligibility-preflight-v1
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'nexus-substrate/nexus-agents' &&
      github.repository_id == '1127393912' &&
      github.actor_id == '14303249' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Require readable protection and write a non-authorizing receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PREFLIGHT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PREFLIGHT_ACTIONS_PERMISSIONS_FILE: ${{ runner.temp }}/native-canary-actions-permissions.json
          CANARY_PR: ${{ inputs.pr_number }}
          CANARY_HEAD_SHA: ${{ inputs.head_sha }}
          CANARY_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'nexus-substrate/nexus-agents' ]]
          [[ "$GITHUB_ACTOR_ID" == '14303249' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
          [[ "$CANARY_PR" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$CANARY_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANARY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREFLIGHT_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

          query='query { repository(owner:"nexus-substrate",name:"nexus-agents") {
            defaultBranchRef { name target { oid } branchProtectionRule {
              pattern requiresApprovingReviews requiredApprovingReviewCount dismissesStaleReviews
              requiresCodeOwnerReviews requireLastPushApproval requiresStrictStatusChecks requiresStatusChecks
              allowsForcePushes allowsDeletions requiredStatusChecks { context app { databaseId } }
            } } } }'
          response=$(mktemp "${RUNNER_TEMP}/native-canary-protection.XXXXXX")
          rules=$(mktemp "${RUNNER_TEMP}/native-canary-rules.XXXXXX")
          trap 'rm -f "$response" "$rules"' EXIT
          timeout -k 2s 20s gh api graphql -f query="$query" > "$response"
          timeout -k 2s 20s gh api repos/nexus-substrate/nexus-agents/rules/branches/main > "$rules"
          jq -e '
            def id: type == "number" and . == floor and . > 0 and . <= 9007199254740991;
            def sha: type == "string" and test("^[0-9a-f]{40}$");
            def rule:
              . as $r | type == "object" and .pattern == "main" and
              .requiresApprovingReviews == true and .requiresStatusChecks == true and
              (.requiredApprovingReviewCount | type == "number" and . == floor and . >= 0) and
              all(["dismissesStaleReviews", "requiresCodeOwnerReviews", "requireLastPushApproval",
                "requiresStrictStatusChecks", "allowsForcePushes", "allowsDeletions"][];
                ($r[.] | type == "boolean")) and
              (.requiredStatusChecks | type == "array" and length <= 1000 and
                (if length == 0 then true else all(.[];
                  (.context | type == "string" and length > 0) and (.app.databaseId | id)) end));
            type == "object" and (has("errors") | not) and
            (.data.repository.defaultBranchRef | .name == "main" and
              (.target.oid | sha) and (.branchProtectionRule | rule))
          ' "$response" >/dev/null
          jq -e 'type == "array" and length == 0' "$rules" >/dev/null
          observed_main=$(jq -er '.data.repository.defaultBranchRef.target.oid' "$response")
          [[ "$observed_main" == "$CANARY_BASE_SHA" ]]

          actions_permissions_status=unmeasured
          actions_may_approve=null
          actions_permissions_sha=''
          if timeout -k 2s 20s gh api repos/nexus-substrate/nexus-agents/actions/permissions/workflow \
            > "$PREFLIGHT_ACTIONS_PERMISSIONS_FILE"; then
            if jq -e 'type == "object" and (.can_approve_pull_request_reviews | type == "boolean")' \
              "$PREFLIGHT_ACTIONS_PERMISSIONS_FILE" >/dev/null; then
              actions_permissions_status=readable
              actions_may_approve=$(jq -r '.can_approve_pull_request_reviews' \
                "$PREFLIGHT_ACTIONS_PERMISSIONS_FILE")
              actions_permissions_sha=$(sha256sum "$PREFLIGHT_ACTIONS_PERMISSIONS_FILE" | cut -d ' ' -f 1)
            fi
          fi

          runs=$(curl --disable --fail --silent --show-error --max-time 20 \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/nexus-substrate/nexus-agents/actions/workflows/native-approval-canary.yml/runs?branch=main&per_page=100')
          jq -e '
            .total_count == (.workflow_runs | length) and .total_count <= 100 and
            all(.workflow_runs[]; (.actor.id | type == "number" and . == floor and . > 0)) and
            ([.workflow_runs[] | select(.actor.id == 14303249 or .actor.id == 41898282)] | length == 0)
          ' <<< "$runs" >/dev/null

          query_sha=$(printf '%s' "$query" | sha256sum | cut -d ' ' -f 1)
          response_sha=$(sha256sum "$response" | cut -d ' ' -f 1)
          receipt=$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" --arg workflowSha "$PREFLIGHT_WORKFLOW_SHA" \
            --arg main "$observed_main" --arg head "$CANARY_HEAD_SHA" --arg base "$CANARY_BASE_SHA" \
            --arg querySha "$query_sha" --arg responseSha "$response_sha" \
            --arg actionsPermissionsStatus "$actions_permissions_status" \
            --arg actionsPermissionsSha "$actions_permissions_sha" \
            --argjson actor 14303249 --argjson repoId 1127393912 --argjson runId "$GITHUB_RUN_ID" \
            --argjson pr "$CANARY_PR" --argjson actionsMayApprove "$actions_may_approve" \
          '{status:"READABLE",complete:true,canaryDispatchAuthorized:false,repository:$repository,repositoryId:$repoId,
              actorId:$actor,event:"workflow_dispatch",ref:"refs/heads/main",
              workflowPath:".github/workflows/native-approval-preflight.yml",
              workflowSha:$workflowSha,runId:$runId,runAttempt:1,observedMainSha:$main,
              prNumber:$pr,headSha:$head,baseSha:$base,querySha256:$querySha,responseSha256:$responseSha,
              actionsApprovalSetting:(if $actionsPermissionsStatus == "readable" then
                {status:"readable",canApprovePullRequests:$actionsMayApprove,responseSha256:$actionsPermissionsSha}
              else {status:"unmeasured",reason:"api-read-unavailable"} end) }')
          mkdir -p "${RUNNER_TEMP}/native-canary-preflight"
          printf '%s\n' "$receipt" > "${RUNNER_TEMP}/native-canary-preflight/receipt.json"
          printf '### Native approval protection preflight\n\nREADABLE; no canary dispatch was attempted.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the exact preflight receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-approval-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/native-canary-preflight/receipt.json
          if-no-files-found: error
          retention-days: 30
  dispatch-canary:
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.dispatch_canary == true &&
      github.repository == 'nexus-substrate/nexus-agents' &&
      github.repository_id == '1127393912' && github.actor_id == '14303249' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Create a distinct canary-dispatch receipt from the measured preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          PREFLIGHT_RUN_ID: ${{ github.run_id }}
          PREFLIGHT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANARY_PR: ${{ inputs.pr_number }}
          CANARY_HEAD_SHA: ${{ inputs.head_sha }}
          CANARY_BASE_SHA: ${{ inputs.base_sha }}
          RECEIPT_DIR: ${{ runner.temp }}/native-canary-dispatch
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$PREFLIGHT_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANARY_PR" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$CANARY_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANARY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RECEIPT_DIR/input"
          gh run download "$PREFLIGHT_RUN_ID" --repo nexus-substrate/nexus-agents \
            --name "native-approval-preflight-$PREFLIGHT_RUN_ID" \
            --dir "$RECEIPT_DIR/input"
          jq -e --argjson run "$PREFLIGHT_RUN_ID" --argjson pr "$CANARY_PR" \
            --arg head "$CANARY_HEAD_SHA" --arg base "$CANARY_BASE_SHA" \
            --arg workflow "$PREFLIGHT_WORKFLOW_SHA" '
            type == "object" and .status == "READABLE" and .complete == true and
            .canaryDispatchAuthorized == false and
            .repository == "nexus-substrate/nexus-agents" and .repositoryId == 1127393912 and
            .actorId == 14303249 and .event == "workflow_dispatch" and .ref == "refs/heads/main" and
            .workflowPath == ".github/workflows/native-approval-preflight.yml" and
            .workflowSha == $workflow and .runId == $run and .runAttempt == 1 and
            .prNumber == $pr and .headSha == $head and .baseSha == $base and
            .observedMainSha == $base and
            (.querySha256 | type == "string" and test("^[0-9a-f]{64}$")) and
            (.responseSha256 | type == "string" and test("^[0-9a-f]{64}$")) and
            (.actionsApprovalSetting | type == "object" and
              (if .status == "readable" then
                (.canApprovePullRequests | type == "boolean") and
                (.responseSha256 | type == "string" and test("^[0-9a-f]{64}$"))
              elif .status == "unmeasured" then .reason == "api-read-unavailable"
              else false end))
          ' "$RECEIPT_DIR/input/receipt.json" >/dev/null
          jq '.status = "CANARY_DISPATCH_AUTHORIZED" | .canaryDispatchAuthorized = true' \
            "$RECEIPT_DIR/input/receipt.json" > "$RECEIPT_DIR/receipt.json"
      - name: Retain the explicit canary-dispatch receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-approval-dispatch-${{ github.run_id }}
          path: ${{ runner.temp }}/native-canary-dispatch/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Dispatch the one-shot canary after the authorized receipt is retained
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          CANARY_PR: ${{ inputs.pr_number }}
          CANARY_HEAD_SHA: ${{ inputs.head_sha }}
          CANARY_BASE_SHA: ${{ inputs.base_sha }}
          PREFLIGHT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api repos/nexus-substrate/nexus-agents/actions/workflows/native-approval-canary.yml/dispatches \
            --method POST -f ref=main \
            -f "inputs[pr_number]=$CANARY_PR" \
            -f "inputs[head_sha]=$CANARY_HEAD_SHA" \
            -f "inputs[base_sha]=$CANARY_BASE_SHA" \
            -f "inputs[preflight_run_id]=$PREFLIGHT_RUN_ID"
