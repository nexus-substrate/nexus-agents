name: Parameter Capability Drift Check

# Reconciles the hand-curated model-parameter capability map
# (KNOWN_PARAMETER_INCOMPATIBILITIES + ModelCapability.unsupportedParameters) against
# the provider's machine-readable `supported_parameters` (#4121, epic #4066). On
# drift it opens ONE issue for a human to vet — it NEVER auto-edits the curated map.
# Modeled on pricing-drift.yml. A provider fetch failure is a LOUD skip, not a
# false "no drift".

on:
  schedule:
    - cron: '37 8 * * 1' # Weekly Monday ~8:37am UTC (off-minute; distinct from pricing-drift 8:23)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check model parameter-capability drift
    runs-on: ubuntu-latest
    # #5396: 10, not 5. These gates are ~90% `setup-node`; the check itself runs
    # in seconds (`check:model-drift` is 17s over 1443 files). Three distinct
    # jobs blew a 5-minute budget in one session, each reported as CANCELLED —
    # indistinguishable from a concurrency cancel, so the natural response was
    # to retry rather than investigate. 10 matches the house default and still
    # catches a genuinely hung check.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Reconcile curated param map against provider supported_parameters
        id: drift
        run: |
          # The script's exit code carries no signal by contract (it always
          # exits 0), so capture it only to catch the one thing that CAN make
          # it non-zero: tsx failing to load the script at all. That path
          # prints no verdict and must read as unmeasured, not as clean.
          set +e
          OUTPUT=$(pnpm check:parameter-drift 2>&1)
          SCRIPT_EXIT=$?
          set -e
          echo "$OUTPUT"
          # The default is applied with `${VAR:-default}`, NOT `|| echo`. In
          # `grep … | tail -1 || echo skipped` the `||` sees tail's status, and
          # tail exits 0 on empty input — so the fallback never fired and an
          # absent verdict became `drift_status=` (empty), which matched no step
          # below and left the run green. Executed and confirmed before this
          # rewrite (#6237; same construct as pricing-drift, #4927 finding 1).
          STATUS=$(echo "$OUTPUT" | grep -oP 'PARAM_DRIFT_STATUS=\K\S+' | tail -1)
          COUNT=$(echo "$OUTPUT" | grep -oP 'PARAM_DRIFT_COUNT=\K\d+' | tail -1)
          if [ "$SCRIPT_EXIT" -ne 0 ]; then
            echo "::warning::check:parameter-drift exited $SCRIPT_EXIT — its verdict, if any, is discarded"
            STATUS=skipped
          fi
          STATUS="${STATUS:-skipped}"
          COUNT="${COUNT:-0}"
          echo "drift_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "drift_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" > parameter-drift-report.txt

      # A skip is its own outcome and it is RED. A ::warning:: on a green run
      # was still a green weekly run, and a green run is what a human reading
      # the Actions list takes for "parameters checked, no drift". The error
      # text says UNMEASURED so the red is not misread as drift either.
      - name: Fail loudly on a skip (provider fetch failure — NOT "no drift")
        if: steps.drift.outputs.drift_status == 'skipped'
        run: |
          echo "::error::Parameter drift UNMEASURED — the OpenRouter catalog fetch failed or came back empty, no registry model joined it, or the script errored. This is not 'no drift'; re-run when the provider is reachable."
          exit 1

      - name: Create issue if parameter drift found
        if: steps.drift.outputs.drift_status == 'drift'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('parameter-drift-report.txt', 'utf-8');
            const count = '${{ steps.drift.outputs.drift_count }}';

            // Dedup by a stable title fragment across open discovered-drift issues.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tech-debt,discovered',
              per_page: 100,
            });
            const hasIssue = existing.data.some(i =>
              i.title.includes('parameter-capability drift')
            );
            if (hasIssue) {
              console.log('Parameter-capability drift issue already open, skipping');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(model-registry): review parameter-capability drift (${count} pairs)`,
              labels: ['tech-debt', 'discovered'],
              body: [
                '**Found during:** weekly parameter-capability drift check (#4121, epic #4066)',
                '**Severity:** medium — a stale param map risks a silent 400 (wrongly-forwarded param) or a lost tuning knob (wrongly-stripped param).',
                '',
                'The curated map is **hand-vetted** — this check does NOT auto-edit it. A human must confirm each pair below and reconcile `KNOWN_PARAMETER_INCOMPATIBILITIES` / the model’s `unsupportedParameters`.',
                '',
                '```',
                report.slice(0, 3000),
                '```',
                '',
                'Reconcile in `packages/nexus-agents/src/config/model-parameter-support.ts` and `src/config/in-tree-data.ts`.',
              ].join('\n'),
            });

  # #6625 layer 3: new and retired models. Same weekly cadence and the same
  # OpenRouter catalog as the parameter check above, so it lives here rather
  # than in a new scheduled workflow. REPORT-ONLY by default: the JSON report
  # is uploaded as an artifact, and nothing is filed unless the repo variable
  # MODEL_DRIFT_FILE_ISSUES is 'true'. It never edits the registry or routing;
  # promotion of a new model is owner-approved.
  model-drift:
    name: Report new and retired models
    runs-on: ubuntu-latest
    # The build dominates; the report itself is a handful of list calls.
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.report.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Build nexus-agents
        run: pnpm build

      - name: Run the model-drift report
        id: report
        working-directory: packages/nexus-agents
        # An unset secret arrives empty, and the command reports that source as
        # `unmeasured` with the reason. OpenRouter needs no key.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: |
          REPORT="$GITHUB_WORKSPACE/model-drift-report.json"
          # The command exits non-zero only for an unmeasured report, so the
          # exit code is captured, not fatal. The verdict comes from the JSON;
          # a missing or unreadable report is unmeasured, never "no drift".
          set +e
          node dist/cli.js model-drift --json > "$REPORT"
          CLI_EXIT=$?
          set -e
          VERDICT=$(jq -r '.verdict // empty' "$REPORT" 2>/dev/null)
          VERDICT="${VERDICT:-unmeasured}"
          if [ "$CLI_EXIT" -ne 0 ] && [ "$VERDICT" != "unmeasured" ]; then
            echo "::warning::model-drift exited $CLI_EXIT with verdict '$VERDICT'; treating as unmeasured"
            VERDICT=unmeasured
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          {
            echo "### Model drift: \`$VERDICT\`"
            echo ""
            jq -r '.coverage[]? | "- \(.source): \(.status) \(.reason // "\(.modelCount) models")"' "$REPORT" 2>/dev/null || true
            echo ""
            echo "- New models: $(jq -r '.newModels | length' "$REPORT" 2>/dev/null || echo unknown)"
            echo "- Possibly retired: $(jq -r '.possiblyRetired | length' "$REPORT" 2>/dev/null || echo unknown)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-drift-report
          path: model-drift-report.json
          if-no-files-found: warn
          retention-days: 30

      # Red, and it says UNMEASURED, so it is read neither as drift nor as clean.
      - name: Fail loudly when no source was measured
        if: steps.report.outputs.verdict == 'unmeasured'
        run: |
          echo "::error::Model drift UNMEASURED — no discovery source could be asked (no credentials, or every probe failed). This is not 'up to date'."
          exit 1

  # Opt-in filing. It re-runs the command with --file-issue WITHOUT the vendor
  # API secrets (Rule of Two: this job reads untrusted catalog data and can
  # write issues, so it holds no model credentials); OpenRouter needs none.
  # The command deduplicates by model id and files at most 5 issues per run.
  model-drift-file-issues:
    name: File new-model issues (opt-in)
    needs: model-drift
    if: vars.MODEL_DRIFT_FILE_ISSUES == 'true' && needs.model-drift.outputs.verdict == 'drift'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Build nexus-agents
        run: pnpm build

      - name: File issues for new models
        working-directory: packages/nexus-agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: node dist/cli.js model-drift --file-issue
