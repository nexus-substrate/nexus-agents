name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel a release mid-flight

jobs:
  # Automated release via changesets (runs on push to main)
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: ./.github/actions/setup-node
        with:
          fetch-depth: '0'
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: pnpm changeset:version
          publish: pnpm release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        with:
          script: |
            const packages = JSON.parse(process.env.PUBLISHED_PACKAGES);
            for (const pkg of packages) {
              const tag = `${pkg.name}@${pkg.version}`;
              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: tag,
                  generate_release_notes: true,
                });
                console.log(`Created release: ${tag}`);
              } catch (err) {
                if (err.status === 422) {
                  console.log(`Release ${tag} already exists — skipping`);
                } else {
                  throw err;
                }
              }
            }

  # Manual publish (runs on workflow_dispatch)
  manual-publish:
    name: Manual Publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ./.github/actions/setup-node
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Fitness audit gate
        run: |
          cd packages/nexus-agents
          node dist/cli.js fitness-audit --format=json > fitness-report.json
          SCORE=$(jq '.score' fitness-report.json)
          echo "Fitness Score: $SCORE/100"

          if [ "$SCORE" -lt 90 ]; then
            echo "::error::Fitness score $SCORE is below release threshold of 90"
            exit 1
          fi

          echo "::notice::Fitness audit passed with score $SCORE/100"

      - name: Publish packages (dry run)
        if: ${{ inputs.dry_run == true }}
        run: pnpm -r publish --access public --no-git-checks --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish packages
        if: ${{ inputs.dry_run != true }}
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
