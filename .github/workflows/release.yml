name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel a release mid-flight
jobs:
  # Automated release via changesets (runs on push to main)
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node
        with:
          # Node 24 LTS ships with npm 11.x, which natively supports OIDC
          # trusted publishing. Node 22 LTS ships npm 10.9.x which silently
          # emits `E404 'not in this registry'` on OIDC publishes — diagnosed
          # via nexus-eval-atbench v0.1.0–0.1.3 attempts (#2524). The CI
          # composite default is 22; the publish path overrides to 24.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Bidirectional skew detection. The `Detect publish-race version skew`
      # step below recovers the package.json-AHEAD-of-npm direction (a
      # missed publish). This step catches the INVERSE — npm AHEAD of
      # package.json — which the 2026-05-14 incident showed can happen when
      # a publish lands but its "Version Packages" PR is never merged, or
      # when a manual publish runs from a non-main ref. That state cannot be
      # auto-recovered (it means a stale version PR needs merging), so fail
      # loudly here rather than let the release machinery drift further.
      - name: Detect npm-ahead version skew
        shell: bash
        run: |
          set -euo pipefail
          local_version=$(jq -r '.version' packages/nexus-agents/package.json)
          published_version=$(npm view nexus-agents version 2>/dev/null || echo "0.0.0")
          larger=$(printf '%s\n%s\n' "$local_version" "$published_version" | sort -V | tail -1)
          if [ "$published_version" != "$local_version" ] && [ "$larger" = "$published_version" ]; then
            echo "::error::npm-ahead version skew: npm latest is $published_version but" \
              "packages/nexus-agents/package.json is $local_version. A 'Version Packages'" \
              "PR is likely unmerged, or a publish ran from a non-main ref. See" \
              "docs/ops/release-changeset-race.md — merge the open version PR to reconcile."
            exit 1
          fi
          echo "Version sync OK (package.json=$local_version, npm=$published_version)."

      - name: Build
        run: pnpm build

      # #5429. Generated from the PACKABLE TARBALL, before publish, never from
      # this workspace.
      #
      # It used to run `cdxgen -t pnpm --no-recurse` at the repo root, which
      # resolves the root pnpm-lock.yaml. That lockfile covers website/ and
      # every workspace package, and `pnpm.overrides` — repo-local and
      # unpublished — changes transitive versions here and for nobody else. The
      # result was uploaded to the release tag and attested. Measured:
      #
      #   root pnpm lockfile : 1231 components, incl. sharp-darwin-arm64,
      #                        sharp-libvips-linux-ppc64, dict-csharp, dict-fsharp
      #                        and protobufjs 8.8.0
      #   packed tarball     :  184 components, 0 dev/website components,
      #                        and protobufjs 7.6.6 — what users actually run
      #
      # A scanner reading the old SBOM for an advisory against protobufjs 7.6.x
      # found nothing, for a release whose users run 7.6.6.
      #
      # BEFORE publish, deliberately. The panel's dissenting voter was right
      # that anything derived from the PUBLISHED tarball runs after the package
      # is already public, so such a check cannot fail the release — it can only
      # complain afterwards — and it inherits registry propagation lag as
      # flakiness. Packing locally avoids both: `npm pack` + `npm install`
      # reproduces the consumer's dependency graph exactly (verified: 184
      # components and protobufjs 7.6.6 either way), with no registry round
      # trip. The tarball's DIGEST differs from the published one, which is why
      # nothing here is used as an attestation subject — but an SBOM describes
      # the dependency graph, not the bytes.
      - name: Generate CycloneDX SBOM from the packable tarball
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/sbom"
          rm -rf "$SCRATCH" && mkdir -p "$SCRATCH/pack" "$SCRATCH/tree"

          (cd packages/nexus-agents && npm pack --pack-destination "$SCRATCH/pack")
          TARBALL=$(ls "$SCRATCH"/pack/*.tgz | head -1)
          echo "Packed: $(basename "$TARBALL")"

          # --ignore-scripts so generating a bill of materials does not execute
          # the install scripts it is describing (see scripts/install-script-allowlist.json).
          # No --omit=optional: optionalDependencies install by default, so they
          # are part of what a consumer receives.
          npm install --prefix "$SCRATCH/tree" --ignore-scripts "$TARBALL"

          npx -y @cyclonedx/cdxgen@12.3.1 \
            -t npm \
            --spec-version 1.6 \
            -o sbom.cdx.json \
            -p "$SCRATCH/tree" \
            --no-recurse

          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length > 0)' \
            sbom.cdx.json > /dev/null
          echo "SBOM generated: $(jq '.components | length' sbom.cdx.json) components"

      # The gate that would have caught #5429, and the reason the step above
      # runs before publish: it can still refuse.
      #
      # The discriminator is NOT "the SBOM names a root devDependency" — that
      # was the first attempt and it failed on a correct SBOM, because
      # `typescript`, `zod`, `yaml`, `ts-morph` and `tslib` are legitimately
      # BOTH root devDependencies and runtime dependencies of the package.
      # Subtracting the installed graph leaves only names that cannot reach a
      # consumer by any route (eslint, husky, prettier, turbo, vitest, cspell,
      # …), and those are the evidence.
      - name: Verify the SBOM describes the package, not the workspace
        shell: bash
        run: |
          set -euo pipefail
          TREE="${RUNNER_TEMP}/sbom/tree"

          find "$TREE/node_modules" -name package.json \
            -not -path "*/node_modules/*/node_modules/*/node_modules/*" \
            -exec jq -r '.name // empty' {} + 2>/dev/null | sort -u > "${RUNNER_TEMP}/installed.txt"
          jq -r '.devDependencies | keys[]' package.json | sort -u > "${RUNNER_TEMP}/devdeps.txt"
          comm -23 "${RUNNER_TEMP}/devdeps.txt" "${RUNNER_TEMP}/installed.txt" \
            > "${RUNNER_TEMP}/workspace-only.txt"
          jq -r '.components[].name' sbom.cdx.json | sort -u > "${RUNNER_TEMP}/components.txt"

          # Guard the guard, first: with no workspace-only names to look for,
          # the check below would find nothing and pass on any input.
          if [[ ! -s "${RUNNER_TEMP}/workspace-only.txt" ]]; then
            echo "::error::no workspace-only package names could be derived, so the" \
              "leak check cannot fail — that makes it not a check (#5429)."
            exit 1
          fi

          LEAKED=$(comm -12 "${RUNNER_TEMP}/workspace-only.txt" "${RUNNER_TEMP}/components.txt" || true)
          if [[ -n "$LEAKED" ]]; then
            echo "::error::SBOM names packages that cannot reach a consumer, so it" \
              "describes the workspace and not the published package (#5429):"
            printf '  %s\n' $LEAKED
            exit 1
          fi

          COUNT=$(jq '.components | length' sbom.cdx.json)
          if [[ "$COUNT" -lt 50 ]]; then
            echo "::error::SBOM has only ${COUNT} components — too few to be the real graph (#5429)."
            exit 1
          fi
          for required in zod semver openai; do
            if ! grep -qx "$required" "${RUNNER_TEMP}/components.txt"; then
              echo "::error::SBOM is missing the runtime dependency '${required}' (#5429)."
              exit 1
            fi
          done
          echo "SBOM check OK: ${COUNT} components, no workspace-only packages, runtime deps present."

      - name: Create Release Pull Request or Publish
        id: changesets
        # v2 pairs with Changesets CLI v3 (#4473). The two MUST move together:
        # action v2 + CLI v2 fails outright ("Changesets CLI v2 is not
        # supported"), and action v1 + CLI v3 is equally unsupported. If you
        # change one, change the other.
        #
        # Input names below are the v2 spellings. v1 used `version`, `publish`,
        # `title`, `commit`; v2 renamed all four, and passing the old names is
        # NOT an error — the action warns "Unexpected input(s)" and silently
        # ignores them, so the release would run with no version script, no
        # publish script, and default PR text. That silent-ignore is why the
        # #4469 regression was invisible until release time.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm release
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth: npm trusted publishing via OIDC. NPM_TOKEN is no longer
          # used — the workflow's `id-token: write` permission produces an
          # OIDC token that npm trusts via the per-package trusted-publisher
          # configuration on npmjs.com (Settings → Trusted Publishers).
          # Configured for: nexus-agents, nexus-memory.
          # NPM_CONFIG_PROVENANCE: true is kept so npm publish auto-signs
          # the artifact with Sigstore — the same OIDC token covers both
          # auth and provenance.
          NPM_CONFIG_PROVENANCE: true

      - name: Detect publish-race version skew (#2382)
        id: fallback-publish
        # The changesets/action enters one of two modes:
        # 1. publish — when no pending changesets exist on main → runs `pnpm release`.
        # 2. PR-update — when changesets exist → updates the release PR.
        #
        # If a release PR is merged while OTHER PRs added new changesets to main
        # in the meantime, the post-merge run finds those new changesets, enters
        # PR mode, and never publishes the just-bumped version. Result: package.json
        # gets ahead of npm, and the next release skips the missed minor entirely
        # (e.g. 2.64.0 → 2.67.0 on 2026-05-04, missing 2.65.0 and 2.66.0).
        #
        # This step detects the skew and force-publishes when:
        #   - changesets/action did NOT publish this run (in PR mode)
        #   - AND local package.json version > npm latest version
        #   - AND no .changeset/*.md files remain on the current commit
        #     (i.e. the version commit landed cleanly; only stragglers from the
        #     just-merged release PR are gone, but new ones haven't appeared)
        #
        # The third condition prevents publishing partial state when changesets
        # are still pending; in that case the next merge will close the loop.
        #
        # CRITICAL (#2696, 2026-05-14; corrected #4487, 2026-08-23): in PR-update
        # mode the changesets/action bumps package.json and consumes .changeset/*.md
        # WITHOUT COMMITTING. Reading either from the working tree sees the NEXT
        # version already bumped and the changesets already gone — making this step
        # force-publish an unreleased version on every changeset-bearing feature
        # merge, with no git tag and no GitHub Release (2.68.0–2.76.0 published
        # this way).
        #
        # The original guard was `git checkout "$GITHUB_SHA"`, which worked under
        # changesets/action v1 because v1 checked out `changeset-release/main`
        # locally, so the checkout was a real branch switch that restored main's
        # files. v2.0.0 (#692) pushes release commits via the GitHub API and never
        # checks that branch out: HEAD is ALREADY on main at $GITHUB_SHA with the
        # bump uncommitted, so `git checkout <sha-at-HEAD>` is a bare detach that
        # PRESERVES modified files. The guard kept running, kept logging correctly,
        # and did nothing — 17 of 17 runs on 2026-08-23 force-published an unmerged
        # version, and every release tag landed one commit early (#4624).
        #
        # Two independent fixes, because they protect different things:
        #   * the DECISION reads the commit object (`git show`/`git ls-tree`), so no
        #     tree state any future action version leaves behind can fool it;
        #   * the PUBLISH gets `--force`, so `pnpm release` ships the commit's
        #     content rather than an uncommitted bump the decision never approved.
        if: steps.changesets.outputs.published != 'true'
        shell: bash
        env:
          # OIDC trusted publishing — same auth path as the changesets/action
          # step above. `id-token: write` at the job level provides the token;
          # npm validates via the trusted-publisher config on npmjs.com.
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `--force` is load-bearing (#4487): HEAD is already at $GITHUB_SHA with
          # the action's uncommitted bump in the tree, so a plain checkout is a
          # no-op that leaves those files in place. This restores the commit's
          # content for the `pnpm release` further down.
          git checkout --quiet --force "$GITHUB_SHA"

          # Read the DECISION inputs from the commit object, not the tree. Even
          # with --force above, deriving the verdict from an immutable artifact is
          # what stops a future action version from silently voiding this guard
          # again the way v2 did.
          local_version=$(git show "$GITHUB_SHA:packages/nexus-agents/package.json" | jq -r '.version')
          published_version=$(npm view nexus-agents version 2>/dev/null || echo "0.0.0")

          # Use sort -V to pick the larger of the two versions.
          larger=$(printf '%s\n%s\n' "$local_version" "$published_version" | sort -V | tail -1)
          if [ "$larger" != "$local_version" ] || [ "$local_version" = "$published_version" ]; then
            echo "Versions in sync ($local_version == $published_version) or local is behind. No fallback publish needed."
            exit 0
          fi

          # Count NON-EMPTY changesets, matching changesets/action's own
          # `hasNonEmptyChangesets` predicate via the same @changesets/read
          # library (#4646). Counting FILES here was a real hole: an empty
          # changeset (`pnpm changeset --empty`, which CLAUDE.md prescribes) is
          # one file and zero releases, so the action published nothing AND
          # opened no PR, while this step stood down waiting for a release-PR
          # merge that was never going to happen. Both green, release stalled.
          pending_changesets=$(pnpm exec tsx scripts/count-pending-changesets.ts "$GITHUB_SHA")
          if [ "$pending_changesets" -gt 0 ]; then
            echo "::warning::package.json is at $local_version but npm has $published_version, AND $pending_changesets non-empty changeset(s) are still pending, so changesets/action will open a version PR. That merge closes the loop. Not force-publishing."
            exit 0
          fi

          echo "::warning::Detected publish-race version skew. package.json=$local_version, npm=$published_version, no pending changesets. Force-publishing $local_version from main ($GITHUB_SHA)."
          pnpm release

          # `changeset publish` (inside `pnpm release`) creates the git tag
          # LOCALLY but does not push it, and the GitHub Release is normally the
          # changesets/action's job — which this fallback bypasses. Without the
          # next block the tag + Release + SBOM trail is silently lost (#2696:
          # 2.68.0–2.76.0 reached npm with no git tag and no GitHub Release).
          TAG="nexus-agents@$local_version"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git push origin "refs/tags/$TAG" || echo "::warning::tag $TAG already on origin"
          else
            echo "::warning::changeset publish did not create tag $TAG — creating it now"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          # Assert the tag points at a commit that actually holds this version
          # (#4624). Before #4487 the fallback fired on feature merges and tagged
          # $GITHUB_SHA, whose package.json was the PREVIOUS version — 14 of 14
          # tags checked were off by one, and nothing noticed for weeks. Now that
          # the decision reads the commit object, a legitimate firing means
          # $GITHUB_SHA genuinely holds $local_version, so this assertion should
          # never fire; it exists so that if that stops being true, a release
          # fails loudly instead of quietly mislabelling its own provenance.
          tagged_version=$(git show "$TAG:packages/nexus-agents/package.json" | jq -r '.version')
          if [ "$tagged_version" != "$local_version" ]; then
            echo "::error::Tag $TAG points at a commit whose package.json is $tagged_version, not $local_version (#4624)."
            exit 1
          fi
          # Release notes = this version's section of the changesets CHANGELOG.
          notes=$(awk -v v="## $local_version" '
            $0 == v { f = 1; next } /^## / { f = 0 } f' packages/nexus-agents/CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists — leaving it."
          else
            gh release create "$TAG" --title "$TAG" \
              --notes "${notes:-Release $local_version. (CHANGELOG section not found — see packages/nexus-agents/CHANGELOG.md.)}"
          fi

          # Signal downstream provenance + SBOM steps that we did publish.
          echo "published=true" >> "$GITHUB_OUTPUT"
          # Synthesize the publishedPackages output that the changesets/action
          # step would normally produce, so the SBOM upload step can derive the
          # release tag in the same way.
          published_pkgs=$(jq -nc --arg name "nexus-agents" --arg version "$local_version" \
            '[{name: $name, version: $version}]')
          echo "publishedPackages=$published_pkgs" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM to GitHub Release
        # changesets/action creates the GitHub release itself via
        # @changesets/changelog-github; it does NOT expose an `uploadUrl`
        # output. Derive the release tag from publishedPackages and use
        # `gh release upload` which looks up the release by tag.
        # (#1841 follow-up; SPDX dropped — CycloneDX is dominant for npm.)
        if: (steps.changesets.outputs.published == 'true' || steps.fallback-publish.outputs.published == 'true') && hashFiles('sbom.cdx.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prefer changesets/action's output; fall back to the synthesized
          # output from the race-recovery step.
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages || steps.fallback-publish.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          # publishedPackages is a JSON array: [{"name": "...", "version": "..."}]
          TAG=$(printf '%s' "$PUBLISHED_PACKAGES" \
            | jq -r '.[] | select(.name == "nexus-agents") | "\(.name)@\(.version)"')
          if [[ -z "$TAG" ]]; then
            echo "::warning::nexus-agents not in publishedPackages; skipping SBOM upload"
            exit 0
          fi
          echo "Uploading SBOM to release tag: $TAG"
          gh release upload "$TAG" sbom.cdx.json --clobber

      - name: Attest SBOM
        if: (steps.changesets.outputs.published == 'true' || steps.fallback-publish.outputs.published == 'true') && hashFiles('sbom.cdx.json') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.cdx.json

      # "Attest npm package" was removed here (#5429). It bound the digest of
      # `packages/nexus-agents/package.json`, and pnpm rewrites the workspace
      # protocol at pack time — source says `"nexus-memory": "workspace:*"`,
      # the packed manifest says `"nexus-memory": "1.0.1"` — so the attested
      # digest matched no file a consumer could obtain, and `dist/**` (reached
      # via `bin`) was never a subject at all.
      #
      # Not repaired, because there is nothing correct to point it at: a
      # locally packed tarball has a different digest from the published one
      # (measured: 8840831f… published vs 1f615db0… packed, and a different
      # byte size), and the published tarball is ALREADY signed correctly by
      # npm's own Sigstore provenance via NPM_CONFIG_PROVENANCE above. A second
      # attestation over the same bytes from the same OIDC identity adds a
      # claim without adding assurance. Fewer claims, all true.

  # Manual publish (runs on workflow_dispatch)
  manual-publish:
    name: Manual Publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # A manual publish MUST run from `main`. Publishing from any other
      # ref (e.g. the changeset-release/main branch) desyncs npm from the
      # repo — exactly the npm-ahead skew the 2026-05-14 incident hit.
      - name: Guard — main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual publish must run from 'main' — got '${{ github.ref }}'." \
            "Publishing from any other ref desyncs npm from the repo." \
            "Re-run with --ref main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node
        with:
          # Node 24 — see comment on the publish-job setup-node above (#2524).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Fitness audit gate
        uses: ./.github/actions/fitness-gate
        with:
          threshold: '90'

      - name: Publish packages (dry run)
        if: ${{ inputs.dry_run == true }}
        run: pnpm -r publish --access public --no-git-checks --dry-run
        env:
          # OIDC trusted publishing — see the comment on the changesets/action
          # step above. Manual workflow_dispatch uses the same auth path.
          NPM_CONFIG_PROVENANCE: true

      - name: Publish packages
        if: ${{ inputs.dry_run != true }}
        run: pnpm -r publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
