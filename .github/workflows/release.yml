name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel a release mid-flight
jobs:
  # Automated release via changesets (runs on push to main)
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-sbom
        run: cargo install cargo-sbom

      - uses: ./.github/actions/setup-node
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: pnpm changeset:version
          publish: pnpm release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Generate SBOM artifacts
        # cargo-sbom 0.10 output formats: spdx_json_2_3 | cyclone_dx_json_1_6
        # (not `spdx` / `cyclonedx`); SBOM is written to stdout, not --file.
        if: steps.changesets.outputs.published == 'true' && hashFiles('crates/iso-parser/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          cd crates/iso-parser
          cargo sbom --output-format spdx_json_2_3 > ../../sbom.spdx.json
          cargo sbom --output-format cyclone_dx_json_1_6 > ../../sbom.cdx.json
          ls -la ../../sbom.*.json

      - name: Upload SBOM artifacts to GitHub Release
        # changesets/action creates the GitHub release itself via
        # @changesets/changelog-github; it does NOT expose an `uploadUrl`
        # output for the legacy actions/upload-release-asset to consume.
        # Derive the release tag from publishedPackages and use `gh release
        # upload` which looks up the release by tag. (#1841 follow-up)
        if: steps.changesets.outputs.published == 'true' && hashFiles('sbom.spdx.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          # publishedPackages is a JSON array: [{"name": "...", "version": "..."}]
          TAG=$(printf '%s' "$PUBLISHED_PACKAGES" \
            | jq -r '.[] | select(.name == "nexus-agents") | "\(.name)@\(.version)"')
          if [[ -z "$TAG" ]]; then
            echo "::warning::nexus-agents not in publishedPackages; skipping SBOM upload"
            exit 0
          fi
          echo "Uploading SBOMs to release tag: $TAG"
          gh release upload "$TAG" sbom.spdx.json sbom.cdx.json --clobber

  # Manual publish (runs on workflow_dispatch)
  manual-publish:
    name: Manual Publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Fitness audit gate
        uses: ./.github/actions/fitness-gate
        with:
          threshold: '90'

      - name: Publish packages (dry run)
        if: ${{ inputs.dry_run == true }}
        run: pnpm -r publish --access public --no-git-checks --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish packages
        if: ${{ inputs.dry_run != true }}
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
