name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel a release mid-flight
jobs:
  # Automated release via changesets (runs on push to main)
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node
        with:
          # Node 24 LTS ships with npm 11.x, which natively supports OIDC
          # trusted publishing. Node 22 LTS ships npm 10.9.x which silently
          # emits `E404 'not in this registry'` on OIDC publishes — diagnosed
          # via nexus-eval-atbench v0.1.0–0.1.3 attempts (#2524). The CI
          # composite default is 22; the publish path overrides to 24.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Bidirectional skew detection. The `Detect publish-race version skew`
      # step below recovers the package.json-AHEAD-of-npm direction (a
      # missed publish). This step catches the INVERSE — npm AHEAD of
      # package.json — which the 2026-05-14 incident showed can happen when
      # a publish lands but its "Version Packages" PR is never merged, or
      # when a manual publish runs from a non-main ref. That state cannot be
      # auto-recovered (it means a stale version PR needs merging), so fail
      # loudly here rather than let the release machinery drift further.
      - name: Detect npm-ahead version skew
        shell: bash
        run: |
          set -euo pipefail
          local_version=$(jq -r '.version' packages/nexus-agents/package.json)
          published_version=$(npm view nexus-agents version 2>/dev/null || echo "0.0.0")
          larger=$(printf '%s\n%s\n' "$local_version" "$published_version" | sort -V | tail -1)
          if [ "$published_version" != "$local_version" ] && [ "$larger" = "$published_version" ]; then
            echo "::error::npm-ahead version skew: npm latest is $published_version but" \
              "packages/nexus-agents/package.json is $local_version. A 'Version Packages'" \
              "PR is likely unmerged, or a publish ran from a non-main ref. See" \
              "docs/ops/release-changeset-race.md — merge the open version PR to reconcile."
            exit 1
          fi
          echo "Version sync OK (package.json=$local_version, npm=$published_version)."

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset:version
          publish: pnpm release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth: npm trusted publishing via OIDC. NPM_TOKEN is no longer
          # used — the workflow's `id-token: write` permission produces an
          # OIDC token that npm trusts via the per-package trusted-publisher
          # configuration on npmjs.com (Settings → Trusted Publishers).
          # Configured for: nexus-agents, nexus-memory.
          # NPM_CONFIG_PROVENANCE: true is kept so npm publish auto-signs
          # the artifact with Sigstore — the same OIDC token covers both
          # auth and provenance.
          NPM_CONFIG_PROVENANCE: true

      - name: Detect publish-race version skew (#2382)
        id: fallback-publish
        # The changesets/action enters one of two modes:
        # 1. publish — when no pending changesets exist on main → runs `pnpm release`.
        # 2. PR-update — when changesets exist → updates the release PR.
        #
        # If a release PR is merged while OTHER PRs added new changesets to main
        # in the meantime, the post-merge run finds those new changesets, enters
        # PR mode, and never publishes the just-bumped version. Result: package.json
        # gets ahead of npm, and the next release skips the missed minor entirely
        # (e.g. 2.64.0 → 2.67.0 on 2026-05-04, missing 2.65.0 and 2.66.0).
        #
        # This step detects the skew and force-publishes when:
        #   - changesets/action did NOT publish this run (in PR mode)
        #   - AND local package.json version > npm latest version
        #   - AND no .changeset/*.md files remain on the current commit
        #     (i.e. the version commit landed cleanly; only stragglers from the
        #     just-merged release PR are gone, but new ones haven't appeared)
        #
        # The third condition prevents publishing partial state when changesets
        # are still pending; in that case the next merge will close the loop.
        #
        # CRITICAL (#2696, 2026-05-14): in PR-update mode the changesets/action
        # runs `changeset version` on a `changeset-release/main` branch and
        # LEAVES THE WORKING TREE CHECKED OUT THERE. Reading package.json or
        # .changeset/ from the working tree would see the NEXT version already
        # bumped and the changesets already consumed — making this step
        # force-publish an unreleased version straight off the changeset-release
        # branch on every changeset-bearing feature merge, with no git tag
        # pushed and no GitHub Release created (2.68.0–2.76.0 all published this
        # way). `git checkout "$GITHUB_SHA"` pins the whole step to the
        # triggering main commit so the skew check only ever reasons about main.
        if: steps.changesets.outputs.published != 'true'
        shell: bash
        env:
          # OIDC trusted publishing — same auth path as the changesets/action
          # step above. `id-token: write` at the job level provides the token;
          # npm validates via the trusted-publisher config on npmjs.com.
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pin to the triggering main commit — never trust the working tree,
          # which changesets/action may have left on changeset-release/main.
          git checkout --quiet "$GITHUB_SHA"

          local_version=$(jq -r '.version' packages/nexus-agents/package.json)
          published_version=$(npm view nexus-agents version 2>/dev/null || echo "0.0.0")

          # Use sort -V to pick the larger of the two versions.
          larger=$(printf '%s\n%s\n' "$local_version" "$published_version" | sort -V | tail -1)
          if [ "$larger" != "$local_version" ] || [ "$local_version" = "$published_version" ]; then
            echo "Versions in sync ($local_version == $published_version) or local is behind. No fallback publish needed."
            exit 0
          fi

          pending_changesets=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)
          if [ "$pending_changesets" -gt 0 ]; then
            echo "::warning::package.json is at $local_version but npm has $published_version, AND $pending_changesets changeset(s) are still pending. The next release-PR merge should close the loop. Not force-publishing."
            exit 0
          fi

          echo "::warning::Detected publish-race version skew. package.json=$local_version, npm=$published_version, no pending changesets. Force-publishing $local_version from main ($GITHUB_SHA)."
          pnpm release

          # `changeset publish` (inside `pnpm release`) creates the git tag
          # LOCALLY but does not push it, and the GitHub Release is normally the
          # changesets/action's job — which this fallback bypasses. Without the
          # next block the tag + Release + SBOM trail is silently lost (#2696:
          # 2.68.0–2.76.0 reached npm with no git tag and no GitHub Release).
          TAG="nexus-agents@$local_version"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git push origin "refs/tags/$TAG" || echo "::warning::tag $TAG already on origin"
          else
            echo "::warning::changeset publish did not create tag $TAG — creating it now"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          # Release notes = this version's section of the changesets CHANGELOG.
          notes=$(awk -v v="## $local_version" '
            $0 == v { f = 1; next } /^## / { f = 0 } f' packages/nexus-agents/CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists — leaving it."
          else
            gh release create "$TAG" --title "$TAG" \
              --notes "${notes:-Release $local_version. (CHANGELOG section not found — see packages/nexus-agents/CHANGELOG.md.)}"
          fi

          # Signal downstream provenance + SBOM steps that we did publish.
          echo "published=true" >> "$GITHUB_OUTPUT"
          # Synthesize the publishedPackages output that the changesets/action
          # step would normally produce, so the SBOM upload step can derive the
          # release tag in the same way.
          published_pkgs=$(jq -nc --arg name "nexus-agents" --arg version "$local_version" \
            '[{name: $name, version: $version}]')
          echo "publishedPackages=$published_pkgs" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        # Node-native SBOM via @cyclonedx/cdxgen against pnpm-lock.yaml.
        # Replaces the prior Rust-only cargo-sbom flow (#1852) which was
        # gated on a non-existent crates/iso-parser/Cargo.toml and silently
        # skipped on every release from 2.29.1 onward. cdxgen 12.3+ is run
        # via npx so we don't need pnpm 10 (cdxgen 12.x's stated minimum).
        # CycloneDX 1.6 is the current stable spec version.
        if: steps.changesets.outputs.published == 'true' || steps.fallback-publish.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx -y @cyclonedx/cdxgen@12.3.1 \
            -t pnpm \
            --spec-version 1.6 \
            -o sbom.cdx.json \
            --no-recurse
          # Sanity: confirm output is a valid CycloneDX 1.6 doc with components.
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length > 0)' \
            sbom.cdx.json > /dev/null
          echo "SBOM generated: $(jq '.components | length' sbom.cdx.json) components"

      - name: Upload SBOM to GitHub Release
        # changesets/action creates the GitHub release itself via
        # @changesets/changelog-github; it does NOT expose an `uploadUrl`
        # output. Derive the release tag from publishedPackages and use
        # `gh release upload` which looks up the release by tag.
        # (#1841 follow-up; SPDX dropped — CycloneDX is dominant for npm.)
        if: (steps.changesets.outputs.published == 'true' || steps.fallback-publish.outputs.published == 'true') && hashFiles('sbom.cdx.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prefer changesets/action's output; fall back to the synthesized
          # output from the race-recovery step.
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages || steps.fallback-publish.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          # publishedPackages is a JSON array: [{"name": "...", "version": "..."}]
          TAG=$(printf '%s' "$PUBLISHED_PACKAGES" \
            | jq -r '.[] | select(.name == "nexus-agents") | "\(.name)@\(.version)"')
          if [[ -z "$TAG" ]]; then
            echo "::warning::nexus-agents not in publishedPackages; skipping SBOM upload"
            exit 0
          fi
          echo "Uploading SBOM to release tag: $TAG"
          gh release upload "$TAG" sbom.cdx.json --clobber

      - name: Attest SBOM
        if: (steps.changesets.outputs.published == 'true' || steps.fallback-publish.outputs.published == 'true') && hashFiles('sbom.cdx.json') != ''
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: sbom.cdx.json

      - name: Attest npm package
        if: steps.changesets.outputs.published == 'true' || steps.fallback-publish.outputs.published == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: packages/nexus-agents/package.json

  # Manual publish (runs on workflow_dispatch)
  manual-publish:
    name: Manual Publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # A manual publish MUST run from `main`. Publishing from any other
      # ref (e.g. the changeset-release/main branch) desyncs npm from the
      # repo — exactly the npm-ahead skew the 2026-05-14 incident hit.
      - name: Guard — main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual publish must run from 'main' — got '${{ github.ref }}'." \
            "Publishing from any other ref desyncs npm from the repo." \
            "Re-run with --ref main."
          exit 1

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node
        with:
          # Node 24 — see comment on the publish-job setup-node above (#2524).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Fitness audit gate
        uses: ./.github/actions/fitness-gate
        with:
          threshold: '90'

      - name: Publish packages (dry run)
        if: ${{ inputs.dry_run == true }}
        run: pnpm -r publish --access public --no-git-checks --dry-run
        env:
          # OIDC trusted publishing — see the comment on the changesets/action
          # step above. Manual workflow_dispatch uses the same auth path.
          NPM_CONFIG_PROVENANCE: true

      - name: Publish packages
        if: ${{ inputs.dry_run != true }}
        run: pnpm -r publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
