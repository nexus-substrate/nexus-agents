name: Models.dev Sync

# Weekly regeneration of packages/nexus-agents/src/config/models-dev-snapshot.json
# from models.dev. When the snapshot drifts from upstream, opens a PR with the
# refreshed JSON. The sync script writes deterministic output, so re-running it
# against unchanged upstream produces no diff (and no PR).
#
# Issue: #2589 (follow-up from #2587).

on:
  schedule:
    # Mondays 05:23 UTC (off-minute, distinct from registry-refresh on Sundays 04:17).
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run the sync but do not open a PR'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Read-only by default; the sync job adds write scopes only where needed.
permissions: read-all

jobs:
  sync:
    name: Refresh models.dev snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # See #4424 — without this the PR carries no checks at all.
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node

      - name: Run sync script
        run: pnpm exec tsx scripts/sync-models-dev.ts
        working-directory: ${{ github.workspace }}

      - name: Detect snapshot drift
        id: changed
        run: |
          if git diff --quiet packages/nexus-agents/src/config/models-dev-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            ADDED=$(git diff packages/nexus-agents/src/config/models-dev-snapshot.json | grep -cE '^\+  *"id":' || true)
            REMOVED=$(git diff packages/nexus-agents/src/config/models-dev-snapshot.json | grep -cE '^-  *"id":' || true)
            echo "added=$ADDED" >> "$GITHUB_OUTPUT"
            echo "removed=$REMOVED" >> "$GITHUB_OUTPUT"
          fi

      # The PR is opened whether or not verification passed, so that the head
      # commit can carry a status that says which. A failed verification used to
      # kill the job here, before any PR existed, so the branch carried NO status
      # at all — the "absent is indistinguishable from verified" state of #4424
      # (#4927 finding 8). The job still ends red on a failure (last step).
      - name: Verify refreshed data before opening a PR
        id: verify
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        run: bash scripts/verify-refresh.sh

      - name: Open PR with refreshed snapshot
        id: cpr
        if: steps.changed.outputs.changed == 'true' && inputs['dry-run'] != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/models-dev-sync
          delete-branch: true
          commit-message: |
            chore(config): weekly refresh of models-dev-snapshot.json

            Added entries: ${{ steps.changed.outputs.added }}, removed: ${{ steps.changed.outputs.removed }}.
          title: 'chore(config): weekly refresh of models-dev-snapshot.json'
          body: |
            Automated weekly refresh from models.dev (issue #2589).

            - Added entries: ${{ steps.changed.outputs.added }}
            - Removed entries: ${{ steps.changed.outputs.removed }}

            The sync script is deterministic — re-running it against unchanged upstream produces no diff. This PR exists because upstream changed.

            Review the diff for any model removals you didn't expect, then squash-merge.
          labels: |
            automated
            models-dev-sync

      - name: No-op summary
        if: steps.changed.outputs.changed == 'false'
        run: echo "Snapshot already in sync with upstream; no PR opened."

      - name: Publish verification status onto the PR head
        if: always() && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          # Records the verify step's ACTUAL outcome on the commit the PR points
          # at. This used to be a hardcoded `state=success` that could only run
          # after a pass, so the status could only ever say pass (#4927 finding
          # 8). Anything other than success/failure means verification did not
          # run, which is reported as `error`, never as passed.
          case "$VERIFY_OUTCOME" in
            success) state=success; description='typecheck + registry-coverage + config tests passed' ;;
            failure) state=failure; description='verify-refresh.sh failed — see the run log before merging' ;;
            *)       state=error;   description="verification did not run (step outcome: ${VERIFY_OUTCOME:-none})" ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=refresh/verify \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail the job when verification failed
        if: always() && steps.verify.outcome == 'failure'
        run: |
          echo "::error::verify-refresh.sh failed; the PR (if opened) carries a failing refresh/verify status. See the verify step's log."
          exit 1
