# Multi-voter PR review (#2233 Child 6)
#
# Runs on every PR by default. Add the `skip-pr-review` label to opt out
# (e.g. for trivial typo fixes, dependabot bumps, or cost-sensitive periods).
#
# Each voter (architect, security, devex, catfish, scope_steward) emits an
# approve/request_changes/abstain decision with citation-backed findings.
# Output is posted as a single PR comment.
#
# Aggregate decision tiers (per #2251 + #2254):
#   ❌ verified blocker — ≥1 voter has ≥1 verified finding (4-point gate
#      passed with substantive named_assertion). Strict block.
#   ⚠️  soft blocker — ≥3 of 5 non-error voters voted request_changes,
#      but no verified findings. Reviewers apply the gate themselves.
#   ✅ approve — all non-error voters approved.
#   ➖ abstain — anything else.
#
# Empirical validation: v5 retest hit 100% bug-catch on diff-readable bugs,
# caught a real bug in #2235 that no human reviewer noticed. See
# docs/research/pr-review-experiment-results-v5.md.
#
# Required secrets: ANTHROPIC_API_KEY (or OPENAI_API_KEY / GOOGLE_AI_API_KEY)
# for the underlying voter LLM calls.
#
# Cost: ~50 voter LLM calls per PR (~10 messages of subscription quota).
# If quota becomes a problem, add `skip-pr-review` to high-volume automation
# PRs (dependabot, etc) or revert this file's trigger to label-gated mode.
#
# Rollback: change the `if:` condition below to
#   contains(github.event.pull_request.labels.*.name, 'pr-review')
# and rename the label everywhere to revert to opt-in mode.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    name: Multi-voter PR review
    # Skip when the opt-out label is present. Runs on every other PR by
    # default (#2242 Child 6 promotion — empirically validated 100% bug-catch
    # on the v5 retest dataset).
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-pr-review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json's packageManager field — passing
        # `version:` here conflicts with that and fails with ERR_PNPM_BAD_PM_VERSION.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter nexus-agents build

      - name: Compute PR diff
        id: diff
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Cap diff at 50k chars (matches MAX_DIFF_LENGTH in pr-review-tool.ts).
          # Truncating before the tool sees it keeps the failure mode visible
          # in the workflow logs rather than buried in a Zod error.
          DIFF=$(git diff "${BASE_SHA}" "${HEAD_SHA}" | head -c 50000)
          {
            echo 'diff<<DIFF_EOF'
            echo "${DIFF}"
            echo 'DIFF_EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Run pr_review tool
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Invoke the pr_review MCP tool via a small node harness. We do this
          # inline rather than via a CLI subcommand to keep the experiment
          # self-contained; if/when Children 5-6 promote this past experiment,
          # we'll add a `nexus-agents pr-review` CLI command.
          node --input-type=module -e "$(cat <<'NODE_EOF'
            import { collectRealVotes } from './packages/nexus-agents/dist/index.js';
            import { buildPrReviewProposal, mapVoteDecisionToPrDecision, aggregatePrDecisions, PR_REVIEW_ROLES } from './packages/nexus-agents/dist/index.js';
            import * as fs from 'node:fs/promises';

            const input = {
              prTitle: process.env.PR_TITLE || '(untitled)',
              prDescription: process.env.PR_BODY || '',
              prDiff: process.env.PR_DIFF || '',
              baseRef: process.env.BASE_REF,
              headRef: process.env.HEAD_REF,
              simulate: false,
            };

            const proposal = buildPrReviewProposal(input);
            const voteResults = await collectRealVotes({
              roles: PR_REVIEW_ROLES,
              proposal,
              simulate: false,
            });

            const reviews = voteResults.map((r) => ({
              role: r.role,
              decision: mapVoteDecisionToPrDecision(r.vote.decision),
              confidence: r.vote.confidence,
              reasoning: r.vote.reasoning,
              source: r.source,
              cli: r.cli,
            }));
            const aggregate = aggregatePrDecisions(reviews);

            await fs.writeFile('pr-review-result.json', JSON.stringify({ summary: aggregate.decision, verified: aggregate.verified, reviews }, null, 2));
            console.log('Summary:', aggregate.decision, '(verified=' + aggregate.verified + ')');
            console.log('Per-voter:', reviews.map((r) => r.role + '=' + r.decision).join(', '));
          NODE_EOF
          )"

      - name: Post review summary as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const result = JSON.parse(fs.readFileSync('pr-review-result.json', 'utf8'));
              // Three icons: ✅ approve, ❌ verified-blocker, ⚠️ soft-block (majority dissent without verified findings — apply gate yourself), ➖ abstain.
              const isSoftBlock = result.summary === 'request_changes' && result.verified === false;
              const icon = isSoftBlock
                ? '⚠️'
                : ({ approve: '✅', request_changes: '❌', abstain: '➖' }[result.summary] || '❓');
              const tag = isSoftBlock ? 'REQUEST CHANGES (UNVERIFIED — majority dissent)' : result.summary.toUpperCase();
              const lines = [
                `## ${icon} PR Review Experiment (#2233)`,
                '',
                `**Overall:** ${tag}`,
                ...(isSoftBlock
                  ? ['', '> ⚠️ Majority of voters requested changes but none produced a verified finding. Apply the verification gate (`.rules/discovered-issues.md`) before acting on these concerns — they may be false positives.']
                  : []),
                '',
                '| Voter | Decision | Confidence | CLI |',
                '| --- | --- | --- | --- |',
                ...result.reviews.map(r => `| ${r.role} | ${r.decision} | ${(r.confidence * 100).toFixed(0)}% | ${r.cli || '—'} |`),
                '',
                '<details><summary>Reasoning per voter</summary>',
                '',
                ...result.reviews.flatMap(r => [
                  `### ${r.role} — ${r.decision}`,
                  '',
                  r.reasoning,
                  '',
                ]),
                '</details>',
                '',
                '---',
                '_Experimental — opt-in per PR via the `pr-review-experiment` label. Findings should be verified before action; see `.rules/discovered-issues.md` for the verification gate. To stop, remove the label._',
              ];
              body = lines.join('\n');
            } catch (e) {
              body = `## ❓ PR Review Experiment (#2233)\n\nReview failed: ${e.message}\n\nCheck the workflow logs.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
