# Multi-voter PR review (#2233 Child 6) — DISABLED BY DEFAULT
#
# This workflow is dormant by default because nexus-agents users on Anthropic's
# subscription plan (Claude Pro/Max) cannot use ANTHROPIC_API_KEY in CI without
# violating the subscription ToS. The validated rollout path for that auth model
# is `scripts/pr-review-local.ts` running on the maintainer's machine, where
# voters route through the local Claude CLI subprocess and consume subscription
# quota interactively (which is the intended use).
#
# Re-enabling this workflow:
# To turn this back into "runs on every PR" mode, change the `if:` condition to:
#   if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-pr-review') }}
# AND ensure ANTHROPIC_API_KEY (or OPENAI_API_KEY / GOOGLE_AI_API_KEY /
# OPENROUTER_API_KEY) is set as a repo secret with a real metered API key
# (NOT a subscription account's session token).
#
# Current trigger: only fires when the `pr-review-ci` label is added to a PR.
# That label doesn't exist by default — adding it is the explicit opt-in.
#
# Security isolation (#7696):
# Execution is split across two jobs:
# 1. pr-review: Runs on trusted base code, receives model API secrets, has
#    strictly read-only permissions (contents:read, pull-requests:read).
#    Never checks out, installs, or executes untrusted PR head code. Emits
#    a signed/bound structured review artifact.
# 2. post-comment: Receives minimum write permissions (pull-requests:write, issues:write),
#    no model secrets, no repository checkout, validates the artifact binding
#    (PR number + head SHA), and fails closed if malformed.

name: PR Review

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions: {}

jobs:
  pr-review:
    name: Multi-voter PR review
    # OPT-IN: only runs when the `pr-review-ci` label is added.
    # Default is local-mode via scripts/pr-review-local.ts (subscription auth).
    # #3614: never run on auto-remediation bot branches — model-API-key secrets
    # must not be exposed to a bot-authored remediation PR (Rule-of-Two third leg
    # via CI). Prefixes kept in sync with src/mcp/tools/auto-remediation-branch.ts.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'pr-review-ci') &&
      !startsWith(github.event.pull_request.head.ref, 'auto-remediation/') &&
      !startsWith(github.event.pull_request.head.ref, 'nexus-codepr/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Verify at least one model API key is configured
        # Without an API key, voters can't actually run — they fall back to
        # abstain/0% which produces confusing "review" comments. Fail fast
        # with an actionable message so the maintainer adds a secret.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}${OPENAI_API_KEY}${GOOGLE_AI_API_KEY}${OPENROUTER_API_KEY}" ]; then
            echo "::error::pr_review needs at least one model API key in repo Actions secrets."
            echo "Add one of: ANTHROPIC_API_KEY, OPENAI_API_KEY, GOOGLE_AI_API_KEY, OPENROUTER_API_KEY"
            echo "Settings → Secrets and variables → Actions → New repository secret."
            echo ""
            echo "If you don't want pr_review to run, add the 'skip-pr-review' label to PRs."
            echo "If you want to disable it entirely, revert the trigger in .github/workflows/pr-review.yml"
            echo "to require the 'pr-review-experiment' label (see #2242 PR for the previous opt-in shape)."
            exit 1
          fi
          echo "API key configured — proceeding."

      # Checkout trusted base ref (main) — never untrusted PR head code
      - name: Checkout base ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter nexus-agents --fail-if-no-match build

      # Fetch PR head commit object into git history strictly as data (does not alter working tree)
      - name: Fetch PR head
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Compute PR diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}" || true)
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::could not compute merge-base of origin/${BASE_REF} and ${HEAD_SHA}"
            exit 1
          fi
          DIFF=$(git diff "${BASE_SHA}" "${HEAD_SHA}" | head -c 50000)
          {
            echo 'diff<<DIFF_EOF'
            echo "${DIFF}"
            echo 'DIFF_EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Run pr_review tool
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          node --input-type=module -e "$(cat <<'NODE_EOF'
            import { collectRealVotes } from './packages/nexus-agents/dist/index.js';
            import { buildPrReviewProposal, toPrReviewVote, aggregatePrDecisions, PR_REVIEW_ROLES } from './packages/nexus-agents/dist/index.js';
            import * as fs from 'node:fs/promises';

            const input = {
              prTitle: process.env.PR_TITLE || '(untitled)',
              prDescription: process.env.PR_BODY || '',
              prDiff: process.env.PR_DIFF || '',
              baseRef: process.env.BASE_REF,
              headRef: process.env.HEAD_REF,
              simulate: false,
            };

            const proposal = buildPrReviewProposal(input);
            const voteResults = await collectRealVotes({
              roles: PR_REVIEW_ROLES,
              proposal,
              simulate: false,
            });

            const reviews = voteResults.map(toPrReviewVote);
            const aggregate = aggregatePrDecisions(reviews);

            const allErrored = reviews.length > 0 && reviews.every((r) => r.source === 'error');
            const resultPayload = {
              prNumber: Number(process.env.PR_NUMBER),
              headSha: process.env.HEAD_SHA,
              summary: aggregate.decision,
              verified: aggregate.verified,
              reason: aggregate.reason,
              reviews,
              allErrored: allErrored ? true : undefined,
            };

            await fs.writeFile('pr-review-result.json', JSON.stringify(resultPayload, null, 2));

            if (allErrored) {
              const firstErr = reviews[0]?.reasoning ?? 'unknown';
              console.error('All voters errored — likely auth or network failure.');
              console.error("First voter's error: " + firstErr.slice(0, 500));
              process.exit(1);
            }

            console.log('Summary:', aggregate.decision, '(verified=' + aggregate.verified + ')');
            console.log('Per-voter:', reviews.map((r) => r.role + '=' + r.decision).join(', '));
          NODE_EOF
          )"

      - name: Upload review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review-result-${{ github.event.pull_request.number }}
          path: pr-review-result.json
          retention-days: 1

  post-comment:
    name: Post review comment
    needs: pr-review
    if: always() && needs.pr-review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Download review artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-result-${{ github.event.pull_request.number }}
          path: .

      - name: Post review summary as PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXPECTED_PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const expectedPr = Number(process.env.EXPECTED_PR);
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;

            // Fail closed: missing or unreadable artifact fails the job without posting
            const rawContent = fs.readFileSync('pr-review-result.json', 'utf8');
            if (!rawContent || !rawContent.trim()) {
              throw new Error('Review artifact is empty; failing closed without posting comment.');
            }

            let result;
            try {
              result = JSON.parse(rawContent);
            } catch (err) {
              throw new Error(`Review artifact is invalid JSON: ${err.message}; failing closed.`);
            }

            // Strictly validate PR number and head SHA binding (#7696)
            if (result.prNumber !== expectedPr) {
              throw new Error(`Review artifact PR mismatch: expected ${expectedPr}, got ${result.prNumber}; failing closed.`);
            }
            if (result.headSha !== expectedHeadSha) {
              throw new Error(`Review artifact head SHA mismatch: expected ${expectedHeadSha}, got ${result.headSha}; failing closed.`);
            }
            if (!result.summary || !Array.isArray(result.reviews)) {
              throw new Error('Review artifact missing required summary or reviews array; failing closed.');
            }

            // Icons: ✅ approve, ❌ verified-blocker, ⚠️ unconfirmed finding or majority dissent, ➖ abstain.
            const isSoftBlock = result.summary === 'request_changes' && result.verified === false;
            const icon = isSoftBlock
              ? '⚠️'
              : ({ approve: '✅', request_changes: '❌', abstain: '➖' }[result.summary] || '❓');
            const tag = isSoftBlock ? `REQUEST CHANGES (UNVERIFIED — ${result.reason ?? 'majority dissent'})` : result.summary.toUpperCase();
            const lines = [
              `## ${icon} Multi-voter PR Review`,
              '',
              `**Overall:** ${tag}`,
              ...(isSoftBlock && result.reason === undefined
                ? ['', '> ⚠️ Majority of voters requested changes but none produced a verified finding. Apply the verification gate (`.rules/discovered-issues.md`) before acting on these concerns — they may be false positives.']
                : []),
              '',
              '| Voter | Decision | Confidence | CLI |',
              '| --- | --- | --- | --- |',
              ...result.reviews.map(r => `| ${r.role} | ${r.decision} | ${(r.confidence * 100).toFixed(0)}% | ${r.cli || '—'} |`),
              '',
              '<details><summary>Reasoning per voter</summary>',
              '',
              ...result.reviews.flatMap(r => [
                `### ${r.role} — ${r.decision}`,
                '',
                r.reasoning,
                '',
              ]),
              '</details>',
              '',
              '---',
              '_Findings should be verified before action; see `.rules/discovered-issues.md` for the gate. To opt out of pr_review on a specific PR, add the `skip-pr-review` label._',
            ];
            const body = lines.join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
