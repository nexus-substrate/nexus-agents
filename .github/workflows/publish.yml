name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Fitness audit gate (requires score >= 90 for release)
        run: |
          cd packages/nexus-agents
          node dist/cli.js fitness-audit --format=json > fitness-report.json
          SCORE=$(jq '.score' fitness-report.json)
          echo "Fitness Score: $SCORE/100"

          if [ "$SCORE" -lt 90 ]; then
            echo "::error::Fitness score $SCORE is below release threshold of 90"
            echo "Run 'nexus-agents fitness-audit' locally to see detailed findings"
            exit 1
          fi

          echo "::notice::Fitness audit passed with score $SCORE/100 (release threshold: 90)"

      - name: Publish packages (dry run)
        if: ${{ inputs.dry_run == 'true' }}
        run: pnpm -r publish --access public --no-git-checks --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages
        if: ${{ inputs.dry_run != 'true' }}
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
