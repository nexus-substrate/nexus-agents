name: Remediation Audit Smoke (no readiness evidence)

# Scheduled AUDIT-mode auto-remediation cycle (#4224) — SMOKE ONLY (#4279).
#
# WHAT THIS IS: a daily end-to-end smoke test of the audit path. It proves the
# built CLI can collect signals, research, vote (degrading to no_quorum — no LLM
# credentials are wired), and append to a soak sink without error.
#
# WHAT THIS IS NOT: readiness evidence for #3769 (the audit -> enforce flip).
# It produces NONE, and a green run here is NOT progress toward that gate:
#   * The file it appends to lives under the workspace `NEXUS_DATA_DIR` and is
#     persisted only in the actions/cache (evicted after 7 idle days). The gate
#     reads the OPERATOR store — `~/.nexus-agents/learning/remediation-soak.jsonl`
#     via `remediation-readiness-collector.ts` — which this job never touches.
#   * Even if the records were bridged, they would arrive un-judged: readiness
#     requires a NAMED evaluator and owner (`remediation-review mark` / `sign-off`),
#     which are human acts by design, and 43 daily runs against a near-identical
#     checkout are correlated near-duplicates, not the diverse signal `volume` wants.
# The panel on #4279 (5–2, Option B) therefore declared the CI soak non-evidence:
# the evidence path is an operator running `nexus-agents auto-remediate` where
# real telemetry lives, then judging records with `nexus-agents remediation-review`.
# `remediation-review readiness` now prints a staleness/flatline alarm on that
# store so a stalled evidence path is visible instead of hidden behind this job.
#
# SAFETY: this runs in AUDIT mode ONLY. Audit is the default
# (`NEXUS_AUTO_REMEDIATE` unset -> audit) and produces vote/plan soak evidence with
# ZERO writes — it never opens a PR and never remediates. Belt-and-braces, we
# EXPORT `NEXUS_AUTO_REMEDIATE=audit` explicitly and assert it before running, so
# CI can never be nudged into `enforce`. Even if it were, the cycle entry point
# (`runAutoRemediationCycle`) structurally withholds `repoRoot`, so `enforce`
# cannot engage from here (see auto-remediation-cycle.ts / auto-remediation-deps.ts).

on:
  schedule:
    # Daily at 07:17 UTC. Once a day is enough to catch a regression in the audit
    # path within a day without excess CI cost. The offset minute (:17, not :00)
    # avoids the well-known top-of-hour GitHub-cron congestion that delays or
    # drops scheduled runs.
    - cron: '17 7 * * *'
  workflow_dispatch: {}

# No writes are needed: audit mode opens no PRs and this workflow commits nothing.
# Keep this read-only (#4279): widening it so CI could commit its records would
# let the automation seeking enforce authority author the evidence that grants it.
permissions:
  contents: read

# Serialize runs so an overlapping scheduled + manual (or a slow prior) run can
# never interleave writes to — or races on the save of — the same soak file.
# cancel-in-progress: false so a running cycle is allowed to FINISH its
# append + cache-save rather than being killed mid-write (which could lose or
# truncate the accrued evidence); the newer run waits its turn.
concurrency:
  group: remediation-audit-soak
  cancel-in-progress: false

jobs:
  soak:
    name: Audit-mode remediation smoke (not readiness evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Belt-and-braces: force AUDIT (default) so this can never remediate in CI.
      NEXUS_AUTO_REMEDIATE: audit
      # Workspace-local data dir: keeps the smoke's records in the cache-backed
      # scratch store, disjoint from the operator store the readiness gate reads.
      NEXUS_DATA_DIR: ${{ github.workspace }}/.nexus-soak-data
      # This is a frozen CI checkout — never touch the tree or route state per-repo.
      NEXUS_GITIGNORE_AUTO: '0'
      NEXUS_REPO_PREFERRED: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Assert AUDIT mode (never enforce in CI)
        run: |
          if [ "${NEXUS_AUTO_REMEDIATE}" != "audit" ]; then
            echo "::error::NEXUS_AUTO_REMEDIATE must be 'audit' in this workflow (got '${NEXUS_AUTO_REMEDIATE}')"
            exit 1
          fi
          echo "AUDIT mode confirmed — zero writes, smoke-only."

      - name: Build nexus-agents
        run: pnpm build

      # Restore the prior smoke records so this run APPENDS to them. The JSONL
      # soak sink hydrates-on-construct and appends-on-write, so a restored
      # `remediation-soak.jsonl` grows rather than being overwritten. This
      # exercises the hydrate + append path of the sink; the accumulated file is
      # cache-only scratch (see the header) and is NOT readiness evidence.
      #
      # Accumulation strategy — ROLLING key + restore-keys prefix (NOT a fixed key):
      #   * `key` embeds `github.run_id`, so it is UNIQUE per run and the post-job
      #     save always writes a NEW cache entry (a fixed key would hit on restore
      #     and GitHub then SKIPS the save — the file would never grow).
      #   * `restore-keys` is a bare prefix, so each run restores the MOST RECENT
      #     prior cache under that prefix — i.e. yesterday's accumulated file.
      # Restore latest -> append this run -> save under a fresh key == genuine
      # run-over-run accumulation.
      - name: Restore + persist accumulating soak
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ github.workspace }}/.nexus-soak-data/learning
          key: remediation-audit-soak-${{ github.run_id }}
          restore-keys: |
            remediation-audit-soak-

      - name: Record pre-run soak volume
        id: pre
        run: |
          SOAK="${NEXUS_DATA_DIR}/learning/remediation-soak.jsonl"
          before=0
          [ -f "$SOAK" ] && before=$(wc -l < "$SOAK" | tr -d ' ')
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "Soak records before this run: ${before}"

      - name: Run audit-mode remediation cycle
        working-directory: packages/nexus-agents
        run: |
          mkdir -p "${NEXUS_DATA_DIR}/learning"
          node dist/cli.js auto-remediate --format json

      - name: Report accrual to job summary
        if: always()
        run: |
          SOAK="${NEXUS_DATA_DIR}/learning/remediation-soak.jsonl"
          after=0
          [ -f "$SOAK" ] && after=$(wc -l < "$SOAK" | tr -d ' ')
          before="${{ steps.pre.outputs.before }}"
          {
            echo "### Remediation audit smoke (#4224) — NOT readiness evidence (#4279)"
            echo ""
            echo "- Mode: \`audit\` (zero writes, smoke-only)"
            echo "- Cache-scratch records before: **${before:-0}**"
            echo "- Cache-scratch records after:  **${after}**"
            echo "- Appended this run:            **$(( after - ${before:-0} ))**"
            echo ""
            echo "These records live only in the actions/cache and are never read by the"
            echo "enforce-readiness gate (#3769). A green run here proves the audit path"
            echo "runs end to end; it is not progress toward the readiness gate. The"
            echo "evidence path is the operator store — run \`nexus-agents remediation-review readiness\`."
          } >> "$GITHUB_STEP_SUMMARY"
