name: Self-Dogfood Review

# nexus-agents using itself for PR review and issue triage
# (Source: Issue #191 - Self-dogfooding workflow)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issues:
    types: [opened]
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (leave empty for latest)'
        required: false
        type: number
      issue_number:
        description: 'Issue number to triage (leave empty for latest)'
        required: false
        type: number

permissions: read-all

concurrency:
  group: self-dogfood-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true
env:
  # Protocol selection: reflexion for multi-perspective review
  NEXUS_PROTOCOL: reflexion
  # Expert selection for reviews
  NEXUS_EXPERTS: architect,security,reviewer

jobs:
  # Job 0: can a review run at all? (#4919)
  #
  # This has to be its own job so `review-pr` can be SKIPPED rather than run
  # and pass. A step-level `if` leaves the JOB green, and a green check is what
  # a human spot-check reads — the mission statement's stated worst case, "it
  # launders unreviewed work as reviewed". A skipped job renders gray: neither
  # a pass nor a failure, which is the honest value for "not measured".
  #
  # It probes what `orchestrate` ACTUALLY requires. The previous gate checked
  # for an API key, and `ANTHROPIC_API_KEY` is configured on this repo, so it
  # passed — and then `orchestrateCommand` (cli/orchestrate-command.ts:292-300)
  # exited 1 before looking at any key because no CLI binary was on PATH. The
  # gate measured key presence and reported it as reviewability.
  preflight:
    name: Review preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.actor != 'dependabot[bot]' &&
       !startsWith(github.event.pull_request.head.ref, 'auto-remediation/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    permissions:
      contents: read
    outputs:
      reviewable: ${{ steps.probe.outputs.reviewable }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - name: Probe review preconditions
        id: probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          CLI=""
          for candidate in claude gemini codex; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CLI="$candidate"
              break
            fi
          done

          if [ -z "$CLI" ]; then
            echo "reviewable=false" >> "$GITHUB_OUTPUT"
            echo "reason=no CLI adapter on the runner — orchestrate needs one of claude, gemini or codex on PATH and exits before it reads any API key" >> "$GITHUB_OUTPUT"
          elif [ -z "${ANTHROPIC_API_KEY}${OPENAI_API_KEY}${GOOGLE_AI_API_KEY}${OPENROUTER_API_KEY}" ]; then
            echo "reviewable=false" >> "$GITHUB_OUTPUT"
            echo "reason=no model credential configured" >> "$GITHUB_OUTPUT"
          else
            echo "reviewable=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
          fi

      - name: Report that no review will run
        if: steps.probe.outputs.reviewable != 'true'
        env:
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          {
            echo "### 🤖 Self-Dogfood Review"
            echo ""
            echo "⚪ NOT MEASURED — ${REASON}."
            echo ""
            echo "The review job is skipped rather than passed, so this check is gray"
            echo "rather than green: nothing was reviewed and the record says so (#4919)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 1: PR Review using nexus-agents orchestrate
  review-pr:
    name: Self-Review PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    # #3778 (Rule-of-Two CI leg): never run the model-driven review on
    # auto-remediation bot branches — keeps secrets off untrusted-signal-derived
    # content. Explicit prefix guard (not just draft-status); kept in sync with
    # AUTO_REMEDIATION_BRANCH_PREFIX in src/mcp/tools/auto-remediation-branch.ts.
    # The event/branch guard moved to `preflight`, which this job needs — so the
    # Rule-of-Two exclusion still holds (an excluded branch never reaches
    # `preflight`, so `reviewable` is empty and this stays skipped).
    if: needs.preflight.outputs.reviewable == 'true'
    permissions:
      contents: read
      # Read-only. Nothing in this job writes a comment or a label, and with
      # model credentials present it would otherwise hold untrusted input,
      # write access and secrets at once — the Rule of Two (#4919).
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node

      - name: Build nexus-agents
        run: pnpm build

      # The precondition is `preflight`'s job now — this job does not run unless
      # it said a review can happen (#4919).
      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Self-Review PR
        id: review
        # No `continue-on-error` (#4919). Every branch below writes an outcome
        # and exits 0 on purpose, so the step itself does not fail — but
        # `Enforce review outcome` below turns a non-review into a red check
        # instead of leaving it to a summary line nobody reads.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          # Bounded read. CLAUDE.md permits reviewing part of a large diff; it
          # requires the record to say which part.
          MAX_DIFF_BYTES: '200000'
        run: |
          set -uo pipefail

          PR_DIFF="$(gh pr diff "$PR_NUM" --repo "$REPO" 2>/dev/null || true)"
          if [ -z "$PR_DIFF" ]; then
            echo "::warning::Could not fetch the diff for PR #$PR_NUM — nothing to review."
            echo "outcome=no_diff" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIFF_BYTES="$(printf '%s' "$PR_DIFF" | wc -c | tr -d ' ')"
          BOUNDED="$(printf '%s' "$PR_DIFF" | head -c "$MAX_DIFF_BYTES")"
          if [ "$DIFF_BYTES" -gt "$MAX_DIFF_BYTES" ]; then
            COVERAGE="first ${MAX_DIFF_BYTES} of ${DIFF_BYTES} bytes"
          else
            COVERAGE="all ${DIFF_BYTES} bytes"
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

          # The DIFF is the artifact. Reviewing the file list is reviewing a
          # description of the change, which CLAUDE.md rules out.
          TASK="Review this diff from PR #${PR_NUM} in ${REPO}.

          Diff (${COVERAGE}):
          ${BOUNDED}

          Focus on:
          1. Code quality (TypeScript best practices, Result<T,E> pattern)
          2. Security (no secrets, input validation, path traversal prevention)
          3. Testing (adequate coverage)
          4. Documentation style (technical, no marketing fluff)

          Provide findings by severity: critical, high, medium, low, info.
          Reference CLAUDE.md and CODING_STANDARDS.md for project standards."

          CLI="packages/nexus-agents/dist/cli.js"
          if [ ! -f "$CLI" ]; then
            echo "::error::Built CLI not found at $CLI — the build step did not produce it."
            echo "outcome=cli_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if node "$CLI" orchestrate "$TASK" --format=json > review-result.json 2> review-error.log; then
            :
          else
            echo "::warning::orchestrate exited non-zero; review did not complete."
            sed -n '1,40p' review-error.log
            echo "outcome=cli_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A non-empty file is not evidence of a review: the previous version
          # redirected stderr into this same file, so an npm resolution error
          # satisfied its `-s` check and reported a completed review.
          if node -e "const r=JSON.parse(require('fs').readFileSync('review-result.json','utf8')); if(typeof r!=='object'||r===null) throw new Error('not an object');" 2>/dev/null; then
            cat review-result.json
            echo "outcome=reviewed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::orchestrate succeeded but its output was not valid JSON."
            sed -n '1,40p' review-result.json
            echo "outcome=malformed_output" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Review Summary
        if: always()
        env:
          OUTCOME: ${{ steps.review.outputs.outcome }}
          COVERAGE: ${{ steps.review.outputs.coverage }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          {
            echo "### 🤖 Self-Dogfood Review"
            echo ""
            echo "PR: #${PR_NUM}"
            echo "Protocol: ${NEXUS_PROTOCOL}"
            echo "Experts: ${NEXUS_EXPERTS}"
            echo ""
            case "${OUTCOME:-}" in
              reviewed)
                echo "✅ Reviewed — diff read: ${COVERAGE}"
                ;;
              no_diff)
                echo "⚠️ NOT REVIEWED — the diff could not be fetched."
                ;;
              cli_missing)
                echo "⚠️ NOT REVIEWED — the built CLI was missing."
                ;;
              cli_failed)
                echo "⚠️ NOT REVIEWED — orchestrate failed. See the step log."
                ;;
              malformed_output)
                echo "⚠️ NOT REVIEWED — orchestrate returned output this job could not parse."
                ;;
              *)
                # The no-credential case cannot land here any more: `preflight`
                # skips this whole job, so an empty outcome means the step died
                # before writing one.
                echo "⚠️ NOT REVIEWED — the review step did not report an outcome."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # #4919, the requirement that did not land the first time: "there is no
      # input that makes this job fail". `preflight` already skipped the job if
      # a review was impossible, so reaching here means a review was possible
      # and something in the substrate stopped it. That is a red check, not a
      # summary line — the check is the part a human spot-check reads.
      - name: Enforce review outcome
        if: always()
        env:
          OUTCOME: ${{ steps.review.outputs.outcome }}
        run: |
          if [ "${OUTCOME:-}" = "reviewed" ]; then
            echo "Review completed."
            exit 0
          fi
          echo "::error::No review was produced (outcome: ${OUTCOME:-none}). Preconditions were met, so this is a substrate failure — see the Self-Review PR step log."
          exit 1

      # #2662 — the dogfood run exercises the agents and accumulates
      # OutcomeStore data; stratify it into a JSON artifact for trend
      # tracking. (fitness-audit is static analysis and never sees this
      # runtime data — this is the separate runtime-outcome report.)
      - name: Stratified outcome report
        if: always()
        run: pnpm exec tsx scripts/stratify-outcomes.ts --json > fitness-stratified.json || echo '{}' > fitness-stratified.json

      - name: Upload stratified outcome report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fitness-stratified
          path: fitness-stratified.json
          if-no-files-found: warn

  # Job 2: Issue Triage using task classification
  triage-issue:
    name: Triage Issue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'workflow_dispatch' && inputs.issue_number != '')
    permissions:
      contents: read
      # Read-only — see the note on the review job. The issue body is
      # untrusted input and this job carries model credentials.
      issues: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Build nexus-agents
        run: pnpm build

      - name: Get Issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Detect model credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}${OPENAI_API_KEY}${GOOGLE_AI_API_KEY}${OPENROUTER_API_KEY}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Triage Issue
        id: triage
        if: steps.creds.outputs.available == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          ISSUE_TITLE="$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json title -q '.title' 2>/dev/null || true)"
          ISSUE_BODY="$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json body -q '.body' 2>/dev/null | head -100 || true)"
          if [ -z "$ISSUE_TITLE" ]; then
            echo "::warning::Could not fetch issue #$ISSUE_NUM — nothing to triage."
            echo "outcome=no_issue" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TASK="Triage Issue #${ISSUE_NUM}: ${ISSUE_TITLE}

          Body:
          ${ISSUE_BODY}

          Classify this issue:
          1. Type: bug, enhancement, documentation, question, research
          2. Priority: P1 (critical), P2 (high), P3 (medium), P4 (low)
          3. Complexity: trivial, low, medium, high
          4. Suggested labels based on content
          5. Related existing issues if any

          Provide brief reasoning for each classification."

          CLI="packages/nexus-agents/dist/cli.js"
          if [ ! -f "$CLI" ]; then
            echo "::error::Built CLI not found at $CLI — the build step did not produce it."
            echo "outcome=cli_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if node "$CLI" orchestrate "$TASK" --format=json > triage-result.json 2> triage-error.log; then
            :
          else
            echo "::warning::orchestrate exited non-zero; triage did not complete."
            sed -n '1,40p' triage-error.log
            echo "outcome=cli_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if node -e "const r=JSON.parse(require('fs').readFileSync('triage-result.json','utf8')); if(typeof r!=='object'||r===null) throw new Error('not an object');" 2>/dev/null; then
            cat triage-result.json
            echo "outcome=triaged" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::orchestrate succeeded but its output was not valid JSON."
            sed -n '1,40p' triage-result.json
            echo "outcome=malformed_output" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Triage Summary
        if: always()
        env:
          OUTCOME: ${{ steps.triage.outputs.outcome }}
          CREDS: ${{ steps.creds.outputs.available }}
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
        run: |
          {
            echo "### 🏷️ Issue Triage"
            echo ""
            echo "Issue: #${ISSUE_NUM}"
            echo ""
            case "${OUTCOME:-}" in
              triaged)
                echo "✅ Triage analysis produced. It is advisory — no label or comment is applied."
                ;;
              no_issue)
                echo "⚠️ NOT TRIAGED — the issue could not be fetched."
                ;;
              cli_missing)
                echo "⚠️ NOT TRIAGED — the built CLI was missing."
                ;;
              cli_failed)
                echo "⚠️ NOT TRIAGED — orchestrate failed. See the step log."
                ;;
              malformed_output)
                echo "⚠️ NOT TRIAGED — orchestrate returned output this job could not parse."
                ;;
              *)
                if [ "${CREDS}" != "true" ]; then
                  echo "⚠️ NOT TRIAGED — no model API key is configured, so no triage ran."
                else
                  echo "⚠️ NOT TRIAGED — the triage step did not report an outcome."
                fi
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
