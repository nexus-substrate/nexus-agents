# Self-Development Meta-Workflow Template
# Version: 2.1.0
# Protocol: nexus-agents self-improvement
# Status: BLOCKED - See prerequisites
# GitHub Issue: https://github.com/williamzujkowski/nexus-agents/issues/144
#
# This workflow enables nexus-agents to analyze issues, plan implementations,
# achieve consensus, and execute code changes autonomously after plan approval.
#
# SECURITY: All execution happens in Docker sandbox with strict resource limits.
# AUTONOMY: After human approves plan, workflow runs autonomously through security gates.
# HUMAN CHECKPOINT: Plan approval only (Phase 6). No blocking during execution.

name: self-development
version: 2.1.0
description: |
  Meta-workflow for nexus-agents self-improvement. Analyzes open issues,
  plans implementations using TRINITY protocol, refines via Reflexion,
  achieves consensus, and implements with Self-Debug/Self-Refine.

  BLOCKED UNTIL:
  - v2.3.0 CLI Adapters stable (1 day zero critical bugs) (Issues #75, #76, #77)
  - v2.3.0 Quality Router stable (Issue #78)
  - Security audit complete

  AUTONOMY MODEL:
  - Human approves plan (Phase 6) - ONLY human checkpoint
  - After approval, execution runs autonomously
  - Security enforced by automated gates (Docker sandbox, security scans)
  - PRs auto-merge after all checks pass
  - Human receives notifications but is never a blocker

# =============================================================================
# PREREQUISITES - Workflow will fail if not met
# =============================================================================
prerequisites:
  - id: cli_adapters_stable
    description: v2.3.0 CLI Adapters must have 1 day zero critical bugs
    check: stability_check
    minVersion: 2.3.0
    stabilityDays: 1 # Zero critical bugs for 1 calendar day
    issues: ['#75', '#76', '#77']

  - id: quality_router_stable
    description: Quality Router must be production-ready
    check: feature_flag
    flag: quality_router_enabled
    issue: '#78'

  - id: docker_available
    description: Docker CLI must be available for sandboxed execution
    check: command_exists
    command: docker

  - id: security_audit
    description: Security safeguards implemented and tested
    check: manual_approval
    approver: repository_owner

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
security:
  # Only process issues from authorized authors
  authorizedAuthors:
    - williamzujkowski # Repository owner

  # Required label for self-development processing
  requiredLabel: self-development-approved

  # Input sanitization patterns (blocked)
  dangerousPatterns:
    - '`[^`]*`' # Backticks (command substitution)
    - "\\$\\([^)]*\\)" # $(command) substitution
    - "\\|" # Pipe operator
    - '&' # Background/AND operator
    - ';' # Command separator
    - '>' # Redirect output
    - '<' # Redirect input
    - "\\beval\\b" # eval keyword
    - "\\bexec\\b" # exec keyword
    - "\\bsudo\\b" # sudo command
    - "\\brm\\s+-rf\\b" # rm -rf pattern
    - "\\bcurl\\b.*\\|\\s*\\w" # curl pipe to execution

  # Docker sandbox configuration
  sandbox:
    enabled: true
    image: node:22-slim
    memoryLimit: 512m
    cpuLimit: '1.0'
    timeoutSeconds: 300
    networkMode: none
    readOnlyRootFilesystem: true
    allowedWritePaths:
      - /tmp
      - /workspace
    noNewPrivileges: true
    seccompProfile: default
    capDrop:
      - ALL

  # Automated security checks
  securityChecks:
    - name: hardcoded_secrets
      patterns:
        - "api[_-]?key\\s*=\\s*[\"'][^\"']+[\"']"
        - "password\\s*=\\s*[\"'][^\"']+[\"']"
        - "secret\\s*=\\s*[\"'][^\"']+[\"']"
        - "token\\s*=\\s*[\"'][^\"']+[\"']"
        - 'sk-[a-zA-Z0-9]{48}'
        - 'ghp_[a-zA-Z0-9]{36}'
    - name: command_injection
      patterns:
        - "exec\\s*\\("
        - "spawn\\s*\\([^)]*\\$"
        - "shell:\\s*true"
    - name: path_traversal
      patterns:
        - "\\.\\.[\\/\\\\]"
        - "path\\.join\\([^)]*\\.\\."

# =============================================================================
# RATE LIMITING (Optional - Disabled by Default)
# =============================================================================
rateLimits:
  enabled: false # Rate limiting disabled by default
  # Optional limits (only enforced when enabled: true)
  maxCyclesPerDay: null # Unlimited by default
  maxRetriesPerPhase: 5 # Prevent infinite loops
  cooldownAfterFailureMs: 60000 # 1 minute (brief pause)
  maxFilesPerRun: null # Unlimited by default
  maxLinesPerRun: null # Unlimited by default

# =============================================================================
# IMPROVEMENT METRICS (Before/After Validation)
# =============================================================================
metrics:
  enabled: true
  # Baseline metrics captured BEFORE changes
  baseline:
    - name: test_coverage
      command: pnpm test:coverage --json
      parser: coverage_percent
      required: true
    - name: test_count
      command: pnpm test --json
      parser: test_count
      required: true
    - name: lint_errors
      command: pnpm lint --format json
      parser: error_count
      required: true
    - name: type_errors
      command: pnpm typecheck 2>&1 | grep -c "error TS"
      parser: count
      required: true
    - name: bundle_size
      command: du -sb dist/ | cut -f1
      parser: bytes
      required: false
    - name: security_findings
      command: pnpm audit --json
      parser: vulnerability_count
      required: true

  # Validation thresholds (changes must not regress)
  validation:
    test_coverage:
      min_delta: 0 # Coverage must not decrease
      target_delta: 2 # Aim for 2% improvement
    test_count:
      min_delta: 0 # Tests must not be removed
    lint_errors:
      max_delta: 0 # Errors must not increase
    type_errors:
      max_delta: 0 # Type errors must not increase
    bundle_size:
      max_percent_increase: 5 # Max 5% size increase
    security_findings:
      max_delta: 0 # Vulnerabilities must not increase

  # Improvement tracking
  tracking:
    store_history: true
    history_path: .self-dev/metrics/
    trend_analysis: true
    alert_on_regression: true

# =============================================================================
# ROLLBACK CONFIGURATION
# =============================================================================
rollback:
  enabled: true
  checkpointPrefix: self-dev-checkpoint
  maxCheckpoints: 5
  cleanupAfterDays: 30
  procedure:
    - git checkout main
    - git reset --hard <checkpoint-tag>
    - git push --force-with-lease origin main

# =============================================================================
# AUDIT TRAIL
# =============================================================================
auditTrail:
  enabled: true
  logPath: logs/self-development/
  format: jsonl
  retention:
    days: 90
    maxSizeMb: 100
  fields:
    - timestamp
    - workflowVersion
    - issueNumber
    - phases
    - decisions
    - humanApprovals
    - rollbacks
    - errors

# =============================================================================
# INPUT DEFINITIONS
# =============================================================================
inputs:
  - name: repository
    type: string
    description: GitHub repository (owner/repo format)
    required: true
    default: williamzujkowski/nexus-agents

  - name: issue_labels
    type: array
    description: Labels to filter issues by
    required: false
    default: [enhancement, bug, tech-debt]

  - name: exclude_labels
    type: array
    description: Labels to exclude from consideration
    required: false
    default: [wontfix, blocked, duplicate]

  - name: max_issues
    type: number
    description: Maximum issues to analyze
    required: false
    default: 20

  - name: auto_commit
    type: boolean
    description: Automatically create branch and PR (still requires human merge)
    required: false
    default: true

# Workflow steps
steps:
  # ==========================================================================
  # Phase 0: PREREQUISITES - Verify all prerequisites are met
  # ==========================================================================
  - id: check_prerequisites
    agent: tech_lead
    action: verify_prerequisites
    inputs:
      prerequisites: '{{workflow.prerequisites}}'
    timeout: 30000
    failOnError: true # Workflow cannot proceed without prerequisites

  # ==========================================================================
  # Phase 1: ANALYZE - Analyze and prioritize open issues
  # ==========================================================================
  - id: analyze_issues
    agent: tech_lead
    action: analyze_github_issues
    inputs:
      repository: '{{inputs.repository}}'
      labels: '{{inputs.issue_labels}}'
      exclude: '{{inputs.exclude_labels}}'
      max_count: '{{inputs.max_issues}}'
    timeout: 60000
    retries: 2

  - id: prioritize_issues
    agent: tech_lead
    action: prioritize_by_score
    inputs:
      issues: '{{steps.analyze_issues.output.issues}}'
      scoring:
        alignment_weight: 3
        urgency_weight: 2
        feasibility_weight: 2
        risk_penalty: 1.5
        complexity_penalty: 0.5
    dependsOn: [analyze_issues]
    timeout: 30000

  - id: select_issue
    agent: tech_lead
    action: select_top_issue
    inputs:
      prioritized: '{{steps.prioritize_issues.output.ranked}}'
    dependsOn: [prioritize_issues]
    timeout: 10000

  # --------------------------------------------------------------------------
  # Security Gate: Issue Origin Verification
  # --------------------------------------------------------------------------
  - id: verify_issue_origin
    agent: security_expert
    action: verify_issue_author
    inputs:
      issue: '{{steps.select_issue.output.issue}}'
      authorizedAuthors: '{{workflow.security.authorizedAuthors}}'
      requiredLabel: '{{workflow.security.requiredLabel}}'
    dependsOn: [select_issue]
    timeout: 10000
    failOnError: true # Block if issue is from unauthorized source

  # --------------------------------------------------------------------------
  # Security Gate: Input Sanitization
  # --------------------------------------------------------------------------
  - id: sanitize_issue_input
    agent: security_expert
    action: sanitize_input
    inputs:
      text: '{{steps.select_issue.output.issue.body}}'
      dangerousPatterns: '{{workflow.security.dangerousPatterns}}'
    dependsOn: [verify_issue_origin]
    timeout: 10000
    failOnError: true # Block if dangerous patterns detected

  # ==========================================================================
  # Phase 2: RESEARCH - Gather context in parallel
  # ==========================================================================
  - id: research_codebase
    agent: code_expert
    action: search_relevant_code
    inputs:
      issue: '{{steps.select_issue.output.issue}}'
      patterns:
        - interfaces
        - implementations
        - tests
        - related_features
    dependsOn: [sanitize_issue_input] # After security gates
    parallel: true
    timeout: 60000

  - id: research_papers
    agent: research_expert
    action: search_arxiv
    inputs:
      keywords: '{{steps.select_issue.output.issue.keywords}}'
      max_results: 10
    dependsOn: [sanitize_issue_input] # After security gates
    parallel: true
    timeout: 60000

  - id: research_docs
    agent: docs_expert
    action: search_documentation
    inputs:
      topics: '{{steps.select_issue.output.issue.topics}}'
    dependsOn: [sanitize_issue_input] # After security gates
    parallel: true
    timeout: 60000

  - id: research_history
    agent: tech_lead
    action: search_git_history
    inputs:
      repository: '{{inputs.repository}}'
      related_issues: '{{steps.select_issue.output.issue.related}}'
    dependsOn: [sanitize_issue_input] # After security gates
    parallel: true
    timeout: 60000

  - id: synthesize_research
    agent: tech_lead
    action: aggregate_research
    inputs:
      codebase: '{{steps.research_codebase.output}}'
      papers: '{{steps.research_papers.output}}'
      docs: '{{steps.research_docs.output}}'
      history: '{{steps.research_history.output}}'
    dependsOn:
      - research_codebase
      - research_papers
      - research_docs
      - research_history
    timeout: 30000

  # ==========================================================================
  # Phase 3: PLAN - Create implementation plan using TRINITY
  # ==========================================================================
  - id: trinity_planning
    agent: tech_lead
    action: execute_trinity
    inputs:
      task:
        id: 'plan-{{steps.select_issue.output.issue.number}}'
        description: |
          Create a detailed implementation plan for issue #{{steps.select_issue.output.issue.number}}:
          {{steps.select_issue.output.issue.title}}

          Context:
          {{steps.synthesize_research.output.synthesized}}

          Requirements:
          - Define file changes (create/modify/delete)
          - Specify interface definitions
          - Include test plan
          - Document migration steps if breaking
        context:
          issue: '{{steps.select_issue.output.issue}}'
          research: '{{steps.synthesize_research.output}}'
      config:
        maxIterations: 3
        timeoutMs: 300000
        includeHistory: true
    dependsOn: [synthesize_research]
    timeout: 300000

  # ==========================================================================
  # Phase 4: REFINE - Refine plan using multi-persona Reflexion
  # ==========================================================================
  - id: reflexion_refinement
    agent: tech_lead
    action: execute_reflexion
    inputs:
      task:
        id: 'refine-{{steps.select_issue.output.issue.number}}'
        description: |
          Refine this implementation plan by gathering feedback from multiple perspectives.
        context:
          plan: '{{steps.trinity_planning.output.workerOutput}}'
          criteria: '{{steps.trinity_planning.output.thinkerOutput.successCriteria}}'
      config:
        maxIterations: 3
        severityThreshold: 0.3
        personas:
          - id: architect
            role: Software Architect
            focusAreas: [design_quality, patterns, modularity]
            weight: 0.25
          - id: security
            role: Security Engineer
            focusAreas: [vulnerabilities, input_validation, secrets]
            weight: 0.25
          - id: tester
            role: QA Engineer
            focusAreas: [testability, coverage, edge_cases]
            weight: 0.20
          - id: devex
            role: Developer Experience
            focusAreas: [usability, documentation, ergonomics]
            weight: 0.15
          - id: maintainer
            role: Maintainer
            focusAreas: [tech_debt, long_term, upgrades]
            weight: 0.15
    dependsOn: [trinity_planning]
    timeout: 180000

  # ==========================================================================
  # Phase 5: VOTE - Multi-agent consensus voting
  # ==========================================================================
  - id: consensus_vote
    agent: tech_lead
    action: execute_consensus
    inputs:
      task:
        id: 'vote-{{steps.select_issue.output.issue.number}}'
        description: |
          Vote on the refined implementation plan for issue #{{steps.select_issue.output.issue.number}}.

          Plan Summary:
          {{steps.reflexion_refinement.output.finalOutput}}

          Final Severity Score: {{steps.reflexion_refinement.output.finalSeverity}}
        context:
          issue: '{{steps.select_issue.output.issue}}'
          plan: '{{steps.reflexion_refinement.output.finalOutput}}'
          critiques: '{{steps.reflexion_refinement.output.critiques}}'
      config:
        experts:
          - architect_agent
          - security_agent
          - qa_agent
          - devex_agent
          - pm_agent
        requireUnanimous: false
        minVotes: 4
    dependsOn: [reflexion_refinement]
    timeout: 60000

  - id: check_vote_result
    agent: tech_lead
    action: evaluate_consensus
    inputs:
      votes: '{{steps.consensus_vote.output.votes}}'
      threshold: 0.8
      change_type: '{{steps.select_issue.output.issue.type}}'
    dependsOn: [consensus_vote]
    timeout: 10000
    condition: 'steps.consensus_vote.output.success'

  # ==========================================================================
  # Phase 6: REVIEW - Human checkpoint (blocks until human responds)
  # ==========================================================================
  - id: human_review
    agent: human_interface
    action: request_approval
    inputs:
      type: implementation_plan
      issue: '{{steps.select_issue.output.issue}}'
      plan: '{{steps.reflexion_refinement.output.finalOutput}}'
      vote_result: '{{steps.consensus_vote.output}}'
      impact:
        files_changed: '{{steps.reflexion_refinement.output.fileCount}}'
        risk_level: '{{steps.check_vote_result.output.riskLevel}}'
      message: |
        ## Self-Development Review Request

        **Issue:** #{{steps.select_issue.output.issue.number}} - {{steps.select_issue.output.issue.title}}

        **Agent Consensus:** {{steps.consensus_vote.output.approvalCount}}/5 approved

        **Estimated Impact:**
        - Files to change: {{steps.reflexion_refinement.output.fileCount}}
        - Risk level: {{steps.check_vote_result.output.riskLevel}}

        Do you approve this implementation? (yes/no/revise)
    dependsOn: [check_vote_result]
    timeout: 86400000 # 24 hours
    condition: 'steps.check_vote_result.output.approved'

  # ==========================================================================
  # Phase 6.5: GENERATE - Generate code (no execution yet)
  # ==========================================================================
  - id: generate_code
    agent: code_expert
    action: generate_code_changes
    inputs:
      plan: '{{steps.reflexion_refinement.output.finalOutput}}'
      self_refine_config:
        maxIterations: 3
        convergenceThreshold: 0.9
      # NOTE: This step ONLY generates code, does NOT execute it
      dryRun: true
    dependsOn: [human_review]
    timeout: 300000
    condition: "steps.human_review.output.decision == 'approved'"

  # ==========================================================================
  # Phase 6.5: BASELINE METRICS - Capture metrics BEFORE changes
  # ==========================================================================
  - id: capture_baseline
    agent: tech_lead
    action: capture_metrics
    inputs:
      metrics: '{{workflow.metrics.baseline}}'
      outputPath: '.self-dev/metrics/{{steps.select_issue.output.issue.number}}/baseline.json'
    dependsOn: [generate_code]
    timeout: 120000
    condition: 'steps.generate_code.output.success'

  # --------------------------------------------------------------------------
  # Security Gate: Create checkpoint before execution
  # --------------------------------------------------------------------------
  - id: create_checkpoint
    agent: tech_lead
    action: git_operation
    inputs:
      operation: create_tag
      name: '{{workflow.rollback.checkpointPrefix}}-{{steps.select_issue.output.issue.number}}-{{workflow.startTime}}'
      message: 'Checkpoint before self-development execution for #{{steps.select_issue.output.issue.number}}'
    dependsOn: [capture_baseline]
    timeout: 30000

  # ==========================================================================
  # Phase 7: EXECUTE - Run in Docker sandbox with Self-Debug (AUTONOMOUS)
  # ==========================================================================
  - id: execute_changes
    agent: code_expert
    action: execute_in_sandbox
    inputs:
      code: '{{steps.generate_code.output.files}}'
      sandbox: '{{workflow.security.sandbox}}'
      self_debug_config:
        maxIterations: 5
        includeExplanation: true
        stopOnFirstError: false
      executor:
        commands:
          typecheck: pnpm typecheck
          lint: pnpm lint
          test: pnpm test
      # Docker sandbox configuration
      docker:
        image: '{{workflow.security.sandbox.image}}'
        memoryLimit: '{{workflow.security.sandbox.memoryLimit}}'
        cpuLimit: '{{workflow.security.sandbox.cpuLimit}}'
        timeout: '{{workflow.security.sandbox.timeoutSeconds}}'
        networkMode: '{{workflow.security.sandbox.networkMode}}'
        readOnly: '{{workflow.security.sandbox.readOnlyRootFilesystem}}'
        writePaths: '{{workflow.security.sandbox.allowedWritePaths}}'
        noNewPrivileges: '{{workflow.security.sandbox.noNewPrivileges}}'
        capDrop: '{{workflow.security.sandbox.capDrop}}'
    dependsOn: [create_checkpoint]
    timeout: 600000
    # NOTE: No human approval required - runs autonomously after plan approval

  # ==========================================================================
  # Phase 7.5: SECURITY CHECK - Automated security scanning
  # ==========================================================================
  - id: security_scan
    agent: security_expert
    action: scan_generated_code
    inputs:
      files: '{{steps.execute_changes.output.modifiedFiles}}'
      checks: '{{workflow.security.securityChecks}}'
    dependsOn: [execute_changes]
    timeout: 120000
    failOnError: true # Block if security issues found

  # ==========================================================================
  # Phase 8: VERIFY - Comprehensive verification
  # ==========================================================================
  - id: verify_typecheck
    agent: code_expert
    action: run_command
    inputs:
      command: pnpm typecheck
    dependsOn: [security_scan] # After security check passes
    parallel: false
    timeout: 120000

  - id: verify_lint
    agent: code_expert
    action: run_command
    inputs:
      command: pnpm lint
    dependsOn: [verify_typecheck]
    timeout: 120000

  - id: verify_tests
    agent: code_expert
    action: run_command
    inputs:
      command: pnpm test
    dependsOn: [verify_lint]
    timeout: 300000

  - id: verify_coverage
    agent: code_expert
    action: run_command
    inputs:
      command: pnpm test:coverage
      threshold: 80
    dependsOn: [verify_tests]
    timeout: 300000

  - id: verify_build
    agent: code_expert
    action: run_command
    inputs:
      command: pnpm build
    dependsOn: [verify_coverage]
    timeout: 180000

  - id: verify_security
    agent: security_expert
    action: run_command
    inputs:
      command: pnpm audit --audit-level=high
    dependsOn: [verify_build]
    timeout: 60000

  - id: aggregate_verification
    agent: tech_lead
    action: aggregate_results
    inputs:
      results:
        - step: verify_typecheck
          name: TypeCheck
          required: true
        - step: verify_lint
          name: Lint
          required: true
        - step: verify_tests
          name: Tests
          required: true
        - step: verify_coverage
          name: Coverage
          required: true
        - step: verify_build
          name: Build
          required: true
        - step: verify_security
          name: Security
          required: true
    dependsOn:
      - verify_typecheck
      - verify_lint
      - verify_tests
      - verify_coverage
      - verify_build
      - verify_security
    timeout: 10000

  # ==========================================================================
  # Phase 8.5: VALIDATE IMPROVEMENT - Compare before/after metrics
  # ==========================================================================
  - id: capture_after_metrics
    agent: tech_lead
    action: capture_metrics
    inputs:
      metrics: '{{workflow.metrics.baseline}}'
      outputPath: '.self-dev/metrics/{{steps.select_issue.output.issue.number}}/after.json'
    dependsOn: [aggregate_verification]
    timeout: 120000
    condition: 'steps.aggregate_verification.output.allPassed'

  - id: validate_improvement
    agent: tech_lead
    action: compare_metrics
    inputs:
      baseline: '.self-dev/metrics/{{steps.select_issue.output.issue.number}}/baseline.json'
      after: '.self-dev/metrics/{{steps.select_issue.output.issue.number}}/after.json'
      thresholds: '{{workflow.metrics.validation}}'
      # Generate improvement report
      report:
        template: |
          ## Improvement Validation Report

          | Metric | Before | After | Delta | Status |
          |--------|--------|-------|-------|--------|
          {{#each metrics}}
          | {{name}} | {{before}} | {{after}} | {{delta}} | {{status}} |
          {{/each}}

          **Overall: {{overallStatus}}**

          {{#if regressions}}
          ### Regressions Detected
          {{#each regressions}}
          - {{name}}: {{reason}}
          {{/each}}
          {{/if}}

          {{#if improvements}}
          ### Improvements
          {{#each improvements}}
          - {{name}}: +{{delta}} ({{percentChange}}%)
          {{/each}}
          {{/if}}
    dependsOn: [capture_after_metrics]
    timeout: 30000
    failOnError: true # Block if regressions detected

  # ==========================================================================
  # Phase 9: COMMIT - Create branch and PR (AUTO-MERGE)
  # ==========================================================================
  - id: create_branch
    agent: tech_lead
    action: git_operation
    inputs:
      operation: create_branch
      name: 'feat/{{steps.select_issue.output.issue.number}}-self-dev'
    dependsOn: [validate_improvement]
    condition: 'inputs.auto_commit && steps.validate_improvement.output.passed'
    timeout: 30000

  - id: stage_changes
    agent: tech_lead
    action: git_operation
    inputs:
      operation: stage
      files: '{{steps.execute_changes.output.modifiedFiles}}'
    dependsOn: [create_branch]
    timeout: 30000

  - id: create_commit
    agent: tech_lead
    action: git_operation
    inputs:
      operation: commit
      message: |
        feat(self-dev): implement #{{steps.select_issue.output.issue.number}}

        {{steps.select_issue.output.issue.title}}

        Changes:
        {{steps.execute_changes.output.summary}}

        Verified:
        - TypeCheck: PASS
        - Lint: PASS
        - Tests: PASS ({{steps.verify_coverage.output.coverage}}% coverage)
        - Build: PASS
        - Security: PASS

        Agent Consensus: {{steps.consensus_vote.output.approvalCount}}/5

        Generated with [Claude Code](https://claude.com/claude-code)

        Co-Authored-By: Claude Opus 4.5 <noreply@anthropic.com>
    dependsOn: [stage_changes]
    timeout: 30000

  - id: push_branch
    agent: tech_lead
    action: git_operation
    inputs:
      operation: push
      remote: origin
      branch: '{{steps.create_branch.output.branchName}}'
    dependsOn: [create_commit]
    timeout: 60000

  - id: create_pr
    agent: tech_lead
    action: github_operation
    inputs:
      operation: create_pr
      title: 'feat(self-dev): {{steps.select_issue.output.issue.title}}'
      body: |
        ## Summary
        Closes #{{steps.select_issue.output.issue.number}}

        This PR was generated by the nexus-agents self-development workflow (autonomous mode).

        ### Changes
        {{steps.execute_changes.output.fileList}}

        ### Improvement Validation
        {{steps.validate_improvement.output.report}}

        ### Security
        - **Human checkpoint:** Plan review ✅ (only gate)
        - **Execution:** Docker sandbox (512MB RAM, no network)
        - **Checkpoint tag:** {{steps.create_checkpoint.output.tagName}}
        - **Security scan:** PASS

        ### Agent Consensus
        - Approved by: {{steps.consensus_vote.output.approvalCount}}/5 agents
        - Plan approved by human: Yes

        ### Verification
        - TypeCheck: PASS
        - Lint: PASS
        - Tests: PASS ({{steps.verify_coverage.output.coverage}}% coverage)
        - Build: PASS
        - Security Scan: PASS
        - **Improvement Validation: {{steps.validate_improvement.output.status}}**

        ### Self-Development Metrics
        - Trinity iterations: {{steps.trinity_planning.output.iterations}}
        - Reflexion iterations: {{steps.reflexion_refinement.output.iterations}}
        - Self-Debug iterations: {{steps.execute_changes.output.debugIterations}}
        - Self-Refine iterations: {{steps.generate_code.output.refineIterations}}
        - Total duration: {{workflow.duration}}ms

        ---
        Generated by nexus-agents Self-Development Workflow v2.1.0 (Autonomous Mode)
      labels:
        - self-development
        - automated
        - auto-merge
      base: main
      head: '{{steps.create_branch.output.branchName}}'
    dependsOn: [push_branch]
    timeout: 60000

  # ==========================================================================
  # Phase 10: AUTO-MERGE - Merge PR automatically (single developer mode)
  # ==========================================================================
  - id: auto_merge_pr
    agent: tech_lead
    action: github_operation
    inputs:
      operation: merge_pr
      pr: '{{steps.create_pr.output.prNumber}}'
      method: squash
      deleteSourceBranch: true
      # Notify human but don't wait for approval
      notify:
        enabled: true
        message: 'PR #{{steps.create_pr.output.prNumber}} auto-merged: {{steps.select_issue.output.issue.title}}'
    dependsOn: [create_pr]
    timeout: 60000

  # ==========================================================================
  # Phase 11: NOTIFY - Send completion summary
  # ==========================================================================
  - id: send_completion_notification
    agent: tech_lead
    action: notify
    inputs:
      priority: low
      channel: console
      message: |
        ═══════════════════════════════════════════════════════════════
          SELF-DEVELOPMENT RUN COMPLETE
        ═══════════════════════════════════════════════════════════════
          Run ID:     {{workflow.runId}}
          Issue:      #{{steps.select_issue.output.issue.number}} - {{steps.select_issue.output.issue.title}}
          Duration:   {{workflow.duration}}ms

          IMPROVEMENT VALIDATION:
          {{steps.validate_improvement.output.summary}}

          PR: #{{steps.create_pr.output.prNumber}} (auto-merged)
          Checkpoint: {{steps.create_checkpoint.output.tagName}}
        ═══════════════════════════════════════════════════════════════
    dependsOn: [auto_merge_pr]
    timeout: 10000

# Global timeout: 4 hours (plan approval may take time)
timeout: 14400000

# Default context budget
defaultBudget:
  system: 0.15
  task: 0.20
  active: 0.50
  reserved: 0.15
