# docker-compose.opencode.yml — OpenCode + nexus-agents MCP testing
#
# Usage:
#   docker compose -f docker-compose.opencode.yml run --rm opencode
#   docker compose -f docker-compose.opencode.yml run --rm smoke-test
#   docker compose -f docker-compose.opencode.yml run --rm e2e-test

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - CUSTOM_API_BASE_URL=${CUSTOM_API_BASE_URL:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - NEXUS_LOG_LEVEL=${NEXUS_LOG_LEVEL:-info}
    volumes:
      - workspace:/home/nexus/workspace
    entrypoint: ['opencode']
    command: []

  smoke-test:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    environment:
      - NEXUS_ALLOW_MOCK_ORCHESTRATION=true
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        echo "=== Smoke Test: OpenCode + nexus-agents MCP ==="
        PASS=0; FAIL=0
        echo ""
        echo "1. Checking OpenCode version..."
        VER=$$(opencode --version 2>&1)
        if echo "$$VER" | grep -q "1.2.15"; then echo "  PASS: $$VER"; PASS=$$((PASS+1)); else echo "  FAIL: $$VER"; FAIL=$$((FAIL+1)); fi
        echo ""
        echo "2. Checking nexus-agents MCP server starts..."
        if timeout 10 node /home/nexus/nexus-agents/dist/cli.js --help >/dev/null 2>&1; then echo "  PASS: CLI starts"; PASS=$$((PASS+1)); else echo "  FAIL: CLI failed"; FAIL=$$((FAIL+1)); fi
        echo ""
        echo "3. Checking opencode.json config..."
        if [ -f /home/nexus/opencode.json ] && grep -q "nexus-agents" /home/nexus/opencode.json; then echo "  PASS: Config found"; PASS=$$((PASS+1)); else echo "  FAIL: Config missing"; FAIL=$$((FAIL+1)); fi
        echo ""
        echo "4. Checking MCP server connection..."
        MCP_OUT=$$(opencode mcp list 2>&1)
        if echo "$$MCP_OUT" | grep -q "connected"; then echo "  PASS: MCP connected"; PASS=$$((PASS+1)); else echo "  FAIL: MCP not connected"; FAIL=$$((FAIL+1)); fi
        echo ""
        echo "5. Checking provider config..."
        if grep -q "anthropic" /home/nexus/opencode.json && grep -q "custom" /home/nexus/opencode.json; then echo "  PASS: Providers configured"; PASS=$$((PASS+1)); else echo "  FAIL: Providers missing"; FAIL=$$((FAIL+1)); fi
        echo ""
        echo "=== Results: $$PASS passed, $$FAIL failed ==="
        [ $$FAIL -eq 0 ] && exit 0 || exit 1

  e2e-test:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CUSTOM_API_BASE_URL=${CUSTOM_API_BASE_URL:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        echo "=== E2E Test: OpenCode + nexus-agents MCP ==="
        echo ""
        echo "1. Running OpenCode with nexus-agents list_experts tool..."
        opencode run --format json -m anthropic/claude-sonnet-4-5 "Use the list_experts MCP tool to show all available expert types" 2>&1
        echo ""
        echo "=== E2E test complete ==="

volumes:
  workspace:
